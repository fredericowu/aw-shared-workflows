name: Code Review (reusable)

# The canonical two-round PR review -> merge loop, as a `workflow_call`
# reusable workflow. Deep PR review by the Dev Team's own reviewer agent
# (`code-reviewer-sonnet`), published as the commit status
# `devteam/code-review` on the PR's head SHA.
# ADVISORY BY DESIGN: no single automated reviewer is the authority, and this
# is never promoted to a required check on its own.
#
# ── PROVENANCE ────────────────────────────────────────────────────────────
# Extracted verbatim-in-behaviour from fredericowu/agents-platform-multitenant's
# merged `.github/workflows/code-review.yml` (commit `2aab9cd5`), which was
# itself copy-adapted from tekflox/aw-app-template's original. Three copies of
# the same ~975-line file existed by the third consumer; this is the
# convergence point, and the two older copies became thin callers of it.
#
# Semantics are UNCHANGED from `2aab9cd5`. Only the three axes of real
# variance between those copies became inputs:
#
#   `ci_check_name`  (required) the repo's own CI check that must be present
#                    AND passing before a merge: `coverage` on aw-app-template,
#                    `pytest` on AP-MT, `unit` on aw-workspace core.
#   `runs_on`        (optional) a JSON-encoded `runs-on` value. Default
#                    `"ubuntu-latest"`; AP-MT passes `["self-hosted","aw-baremetal"]`
#                    because its own CI and deploy already live on that runner.
#   `dispatch_url` / `event_url`
#                    (optional) the Agents Platform base this loop talks to.
#                    Defaults to the production deployment; separate inputs so a
#                    staging AP-MT could be reviewed by production, or vice
#                    versa, without forking this file.
#
# Everything else is deliberately NOT parameterized. The agent slug, the label
# names, the status context, the round state machine, the fail-closed
# `blocks_merge` rule, the HMAC scheme — varying any of those between repos is
# how the three copies drifted in the first place.
#
# ── PINNING: EXACT TAGS ONLY ──────────────────────────────────────────────
# Callers MUST pin an exact, immutable tag (`@v1.0.0`), never `@master` and
# never a moving major alias (`@v1`). This is not style. `app-release.yml` in
# this estate is referenced via a moving `@master` ref from ~45 app repos, and
# a single fail-loud edit there turned the entire marketplace red at once. A
# tag is never retagged here; a change ships as a new tag and each caller is
# bumped deliberately, with the oldest/most-exercised consumer
# (tekflox/aw-app-template) used as the canary.
#
# ── SECRETS: DECLARED, AND PASSED EXPLICITLY ──────────────────────────────
# All three are declared under `on.workflow_call.secrets:` below as
# `required: false`, and every caller passes them BY NAME.
#
# `secrets: inherit` was tried first and is NOT sufficient, for a reason that
# fails silently rather than loudly. GitHub's rule: "Workflows that call
# reusable workflows in the same organization or enterprise can use the
# `inherit` keyword" — `inherit` does not cross an ACCOUNT boundary. This
# repo is owned by `fredericowu`; `tekflox/aw-app-template` is one of the
# callers. Measured live on 2026-11-04 (aw-app-template PR #16): the caller
# passed `secrets: inherit`, `AW_CODEREVIEW_V1_KEY` IS set on that repo, and
# it still arrived here as an EMPTY STRING. Meanwhile the same-owner caller
# (`fredericowu/aw-workspace`) inherited it fine — which is exactly the shape
# of bug that looks like "the secret is missing" and sends you to the wrong
# repo. Declaring them and passing by name works regardless of who owns what.
#
# Each secret is still read with an explicit "unset" branch, because an
# optional, unpassed secret yields an EMPTY STRING here, never an error — and
# that guard is what turned the failure above into a one-line CI error naming
# the repo instead of a confusing downstream 401:
#
#   `AW_CODEREVIEW_V1_KEY`     the reviewer dispatch; MUST be a
#                              WORKSPACE-BOUND Agents Platform ApiKey (an
#                              unbound key gives an opaque 500 at the `/v1`
#                              door), scoped to `code-reviewer-sonnet`.
#   `AW_DEVTEAM_MERGE_TOKEN`   the merge PAT. See the merge step: falling back
#                              to GITHUB_TOKEN is REFUSED, loudly.
#   `AW_DEVTEAM_EVENT_SECRET`  the HMAC key the platform's
#                              `/api/github/devteam-review-event` verifies.
#   `GITHUB_TOKEN`             always present in a reusable workflow; used for
#                              every read, every comment, every status, every
#                              label. Never for the merge.
#
# ── CONCURRENCY LIVES IN THE CALLER ───────────────────────────────────────
# Workflow-level `concurrency` is deliberately absent here: a reusable
# workflow's `concurrency` would key on THIS file's identity, while what
# actually needs serializing is "reviews of caller-repo PR #N". Each caller
# declares its own `concurrency: code-review-<pr#>` with
# `cancel-in-progress: false`.
#
# ── THE TWO-ROUND REVIEW→MERGE LOOP ───────────────────────────────────────
# Round state lives ON THE PR, as two labels, an explicit state machine:
#
#   (no label)                -> round 1: normal review, all lenses.
#                                >=1 finding  -> label `devteam:awaiting-fixes`,
#                                                POST `findings` (wakes the coder
#                                                that opened the PR).
#                                0 findings   -> merge.
#   devteam:awaiting-fixes     -> round 2: the lenient "major only" lens. Merge
#                                eligibility is per-finding `blocks_merge`, NOT
#                                severity.
#                                none blocking -> merge.
#                                any blocking  -> label `devteam:needs-human`,
#                                                 POST `escalate`.
#   devteam:needs-human        -> round "needs-human": the SAME lenient
#                                `blocks_merge` lens as round 2, run again on
#                                every push or `/aw-review`.
#                                none blocking -> label REMOVED, merge, same
#                                                 as any other eligible round.
#                                any blocking  -> label stays, no new event
#                                                 (already escalated once).
#                                A human can still remove the label directly
#                                to force round 1's full lens on the next
#                                push/`/aw-review`, instead of waiting for a
#                                clean `blocks_merge` verdict.
#
# Why labels and not commit counts or status history: `/aw-review` can be
# invoked any number of times, workflow runs get cancelled and re-run, and a
# round-2 merge step can fail mechanically and be retried. Labels encode
# STATE; counts and history encode the past and break on exactly those
# re-runs. The gate reads them LIVE via `gh api` — never from the event
# payload, whose `issue_comment` form carries a stale label snapshot.
#
# The fix-cycle rounds — 2 and `needs-human` — are entered AUTOMATICALLY, on
# `pull_request: synchronize` — i.e. the coder's fix push. A `synchronize` on
# a PR carrying neither label is round 1 and is refused by the gate after one
# label read, before any paid judge run: a full deep review costs real
# subscription budget and PR-Agent already reviews every push, so "review
# every push" was never the ask. `/aw-review` survives untouched as the
# manual override — for a round 1 re-run, for a retry after a mechanical
# failure, and as the recovery path when an event is lost.
#
# Each caller repo must have both labels and both reviewer/merge secrets; see
# the "Caller checklist" comment at the bottom of this file.
#
# ── THE MERGE IS EVENT-DRIVEN, NOT POLLED (v1.3.0) ────────────────────────
# Through v1.2.1 the merge waited for the caller's CI by polling `gh pr
# checks` in a 20-minute loop inside the review job. That shape produced two
# distinct production bugs on its own (a masking empty-read on AP-MT PR #7, a
# missing `actions: read` on PR #9), burned a 20-minute window on every PR
# whose CI finished after the verdict, and capped the whole loop at 20
# minutes: a repo whose suite is slower than that could never merge at all.
#
# It is replaced by a commit status plus a real event:
#
#   1. The review job writes `devteam/merge-eligible` (state=success) on the
#      PR head SHA at the exact moment it computes `eligible=true`, and never
#      otherwise. That is the single place eligibility is decided — round
#      rule, `blocks_merge` rule, draft rule, all unchanged.
#   2. A `merge-attempt` job reads that status LIVE and merges. It has two
#      entry points running ONE script:
#        (a) same run, `needs: [gate, code-review]` — today's happy path,
#            where CI was already green before the verdict landed;
#        (b) a `workflow_run: types: [completed]` event on the CALLER's own
#            CI workflow, forwarded by the caller — the case the poll
#            existed for. CI finishing an hour after the verdict now merges
#            an hour after the verdict, instead of never.
#
# A commit status and not a label, because eligibility is a property of a
# SHA. A label is PR-scoped and survives the push that invalidates the review
# that set it, so a label would hand a brand-new, unreviewed head the
# eligibility its predecessor earned. The per-SHA status also IS the
# head-moved guard: the job re-reads the PR's live head before merging, and a
# head that moved simply has no status on it.
#
# What this costs, stated plainly so nobody rediscovers it as a bug:
#   - No poll means no self-healing window. A dropped `workflow_run`
#     delivery, or a merge-attempt that fails mechanically, is not retried by
#     anything — a human (or the coder) runs `/aw-review`, or pushes.
#   - Every completion of the named CI workflow on ANY branch spawns a
#     few-second merge-attempt job, which exits neutral when no open PR owns
#     that SHA. On a self-hosted caller that is real (small) runner noise.
#   - RENAMING THE CALLER'S CI WORKFLOW SILENTLY KILLS THE EVENT PATH. The
#     caller names it as a literal string in `on: workflow_run: workflows:`.
#     Nothing fails; merges just stop happening on the slow-CI path and
#     degrade to manual `/aw-review`. It never merges red — the merge-attempt
#     still reads the checks itself.
#
# ── ONE TRAP, IF YOU ARE EDITING A CALLER'S OWN code-review.yml IN A PR ───
# `pull_request` runs the caller's PR copy (round 1 and round 2 both see your
# edits live). `issue_comment` (`/aw-review`) and `workflow_run` BOTH always
# run the caller's DEFAULT BRANCH copy. A PR that modifies the caller's
# `code-review.yml` therefore cannot exercise its own comment path or its own
# workflow_run path — verify those on the NEXT PR after merge rather than
# burning time "debugging" them. (A PR that only bumps the `@vX.Y.Z` pin here
# is exactly that case, and so is the PR that first ADDS the `workflow_run`
# trigger: the event cannot fire for a trigger definition that is not yet on
# the default branch, which is why the v1.3.0 canary took two PRs.)

on:
  workflow_call:
    inputs:
      ci_check_name:
        description: >-
          The caller repo's own CI check name that must be PRESENT and PASSING
          on the PR head SHA before this loop will merge. Present-and-passing,
          not merely not-failing: "absent" must never read as "fine", or
          deleting the CI job would silently re-open the merge window.
        required: true
        type: string
      runs_on:
        description: >-
          JSON-encoded `runs-on` value, consumed as
          `fromJSON(inputs.runs_on)`. A JSON string ("ubuntu-latest") or a
          JSON array (["self-hosted","aw-baremetal"]) both work.
        required: false
        type: string
        default: '"ubuntu-latest"'
      dispatch_url:
        description: >-
          Agents Platform base URL for the reviewer dispatch
          (POST <base>/v1/chat/completions).
        required: false
        type: string
        default: 'https://agents-platform.aw.tekflox.com'
      event_url:
        description: >-
          Agents Platform base URL for the round-outcome event
          (POST <base>/api/github/devteam-review-event).
        required: false
        type: string
        default: 'https://agents-platform.aw.tekflox.com'
    secrets:
      # All `required: false`, deliberately. A caller missing one gets a
      # precise, fail-loud error from the step that needs it, naming the repo
      # and the secret — which is strictly more useful than GitHub refusing
      # the whole workflow call with a generic validation error before any of
      # our own diagnostics can run. See the SECRETS note in this file's
      # header for why these are declared at all rather than inherited.
      AW_CODEREVIEW_V1_KEY:
        description: >-
          Agents Platform ApiKey for the reviewer dispatch. MUST be
          WORKSPACE-BOUND and scoped to `code-reviewer-sonnet` — an unbound
          key gives an opaque 500 at the /v1 door, not a 401.
        required: false
      AW_DEVTEAM_MERGE_TOKEN:
        description: >-
          PAT with contents:write + pull-requests:write on the caller repo,
          used ONLY for the squash-merge. Never GITHUB_TOKEN: pushes it
          authors do not trigger downstream workflows.
        required: false
      AW_DEVTEAM_EVENT_SECRET:
        description: >-
          HMAC key the platform's /api/github/devteam-review-event verifies.
        required: false

# Declared here AND on the caller's calling job. For a reusable workflow the
# effective GITHUB_TOKEN permissions are the INTERSECTION of the two, so both
# sides state the same set: this file documents what the loop actually needs,
# and the caller's copy is what lifts a repo whose default workflow
# permissions are read-only.
#
# BOTH SIDES. That is not a stylistic preference, it is the whole mechanism,
# and v1.1.1 got it wrong by updating only the callers. Once a `permissions:`
# key names ANY scope, every scope it does not name is forced to `none`
# (GitHub docs, `permissions`: "If you specify the access for any of these
# permissions, all of those that are not specified are set to `none`"). So an
# omission here is not "inherit from the caller", it is an explicit `none`,
# and it silently caps every caller to zero no matter what they grant. A
# caller-side grant alone buys nothing.
#
# `checks: read` is the one that made this concrete. v1.1.1 added it to all
# three callers and to the checklist below, and left this block untouched —
# so the private-repo bug it was cut to fix was still fully live, now with a
# better error message instead of a fix. Caught in review on
# aw-app-template#17; fixed in v1.1.2, and guarded by a test
# (`test_the_reusable_requests_every_scope_the_caller_checklist_demands`) so
# the two lists cannot drift apart again.
permissions:
  contents: read
  pull-requests: write
  issues: write
  statuses: write
  # Required for `gh pr checks` in the merge-attempt job to see check-runs at
  # all on a PRIVATE caller. See the long note in the CALLER CHECKLIST below.
  checks: read
  # SEPARATE from checks: read, and additionally required. gh CLI's `gh pr
  # checks` always builds a GraphQL query that embeds
  # checkSuite{workflowRun{workflow{name}}} inside the CheckRun fragment, no
  # matter which --json fields you ask for (gh v2.97.0, api/query_builder.go).
  # Resolving that checkSuite -> workflowRun edge is an Actions-resource read,
  # not a Checks-API read, so checks: read alone does not cover it. On a
  # PRIVATE caller, missing this is a deterministic
  # "Resource not accessible by integration (...checkSuite.workflowRun)"
  # GraphQL error on every read — not transient, so no number of retries can
  # ever succeed. See the long note in the CALLER CHECKLIST below.
  actions: read

jobs:
  # Same two-entry-path shape as the original (fork check on both paths,
  # first-token command parse, comment body via env never interpolated into
  # the shell): an author allowlist, narrower than the fork check and layered
  # on top of it, not instead of it.
  #
  # `github.repository`, `github.event.*` and the `vars` context all resolve
  # against the CALLER repository inside a reusable workflow, which is why the
  # trusted-author gate needs no input: `vars.AW_REVIEW_TRUSTED_AUTHORS` is
  # read from whichever repo is calling.
  gate:
    if: >-
      github.event.sender.type != 'Bot' &&
      github.event.action != 'closed' &&
      (
        (
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        ) ||
        (
          github.event_name == 'issue_comment' &&
          github.event.issue.pull_request != null &&
          contains(
            fromJSON('["OWNER","MEMBER","COLLABORATOR"]'),
            github.event.comment.author_association
          )
        )
      )
    runs-on: ${{ fromJSON(inputs.runs_on) }}
    outputs:
      allowed: ${{ steps.decide.outputs.allowed }}
      sha: ${{ steps.decide.outputs.sha }}
      base: ${{ steps.decide.outputs.base }}
      pr_number: ${{ steps.decide.outputs.pr_number }}
      mode: ${{ steps.decide.outputs.mode }}
      round: ${{ steps.decide.outputs.round }}
      is_draft: ${{ steps.decide.outputs.is_draft }}
    steps:
      - name: Decide
        id: decide
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Via env, never interpolated into the script body — a comment
          # body is attacker-controlled text.
          BODY: ${{ github.event.comment.body }}
          # Comma-separated GitHub logins, set on the CALLER repo with
          # `gh variable set` (no commit) — see this file's trailing caller
          # checklist. Unset resolves to `fredericowu` HERE, in code, never
          # to "nobody" or "everyone" (the
          # allowlist-unset-ships-green-and-invisible failure mode is
          # documented in the KB).
          TRUSTED_AUTHORS: ${{ vars.AW_REVIEW_TRUSTED_AUTHORS }}
        run: |
          set -euo pipefail
          allowlist="${TRUSTED_AUTHORS:-fredericowu}"

          is_trusted() {
            local login="$1" entry
            IFS=',' read -ra arr <<< "$allowlist"
            for entry in "${arr[@]}"; do
              entry="$(echo "$entry" | xargs)"
              [ "$entry" = "$login" ] && return 0
            done
            return 1
          }

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            pr_number="${{ github.event.pull_request.number }}"
            sha="${{ github.event.pull_request.head.sha }}"
            base="${{ github.event.pull_request.base.ref }}"
            author="${{ github.event.pull_request.user.login }}"
            is_draft="${{ github.event.pull_request.draft }}"
            mode=review
          else
            # Same first-whitespace-token matching, and the same reason:
            # startsWith('/aw-review') would also match "/aw-reviewing this
            # later", spending a run on a sentence. /aw-improve is the
            # lighter-weight sibling command -- same gate, same judge, just a
            # narrower focus (see the aw-agent-code-reviewer skill's "PR
            # deep-review entry path" for what `mode` changes).
            cmd="$(printf '%s' "$BODY" | head -n 1 | tr -d '\r' | awk '{print $1}')"
            case "$cmd" in
              /aw-review) mode=review ;;
              /aw-improve) mode=improve ;;
              *)
                echo "Not a review command: '$cmd'"
                echo "allowed=false" >> "$GITHUB_OUTPUT"
                exit 0
                ;;
            esac

            pr="$(gh api "repos/${{ github.repository }}/pulls/${{ github.event.issue.number }}")"
            head_repo="$(printf '%s' "$pr" | jq -r '.head.repo.full_name // ""')"
            if [ "$head_repo" != "${{ github.repository }}" ]; then
              {
                echo "### Code review skipped: \`$cmd\` on a fork PR"
                echo
                echo "This pull request's head is \`${head_repo:-a deleted fork}\`, not"
                echo "\`${{ github.repository }}\`. An \`issue_comment\` run has access to"
                echo "this repository's secrets regardless of where the PR came from, so"
                echo "running the credentialed reviewer here would send it over a diff"
                echo "this repository does not control. Declined deliberately."
              } >> "$GITHUB_STEP_SUMMARY"
              echo "allowed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            pr_number="${{ github.event.issue.number }}"
            sha="$(printf '%s' "$pr" | jq -r .head.sha)"
            base="$(printf '%s' "$pr" | jq -r .base.ref)"
            author="$(printf '%s' "$pr" | jq -r .user.login)"
            is_draft="$(printf '%s' "$pr" | jq -r '.draft')"
          fi

          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "base=$base" >> "$GITHUB_OUTPUT"

          # ---- round, from the PR's LIVE labels ----
          # `gh api`, never `github.event.*.labels`: an issue_comment payload
          # carries the label set as it was when the comment was written, so a
          # label this very loop added on the previous round can be missing
          # from it. Reading it live is the difference between a round-2 pass
          # and silently re-running round 1 forever.
          #
          # This fetch FAILS LOUDLY, with retries, and never falls back to an
          # empty label set — a PR #13 finding on the aw-app-template original.
          labels=""
          for attempt in 1 2 3; do
            if labels="$(gh api "repos/${{ github.repository }}/issues/$pr_number/labels" \
                           --jq '.[].name')"; then
              break
            fi
            echo "label fetch attempt $attempt failed"
            labels="__FETCH_FAILED__"
            sleep $(( attempt * 3 ))
          done
          if [ "$labels" = "__FETCH_FAILED__" ]; then
            echo "::error::could not read PR #$pr_number's labels after 3 attempts. \
            Refusing to guess the review round: defaulting to round 1 would reset a PR \
            that is mid-fix-cycle or already escalated. Re-run this workflow once the \
            GitHub API is answering again."
            exit 1
          fi
          has_label() { printf '%s\n' "$labels" | grep -Fxq "$1"; }

          if [ "$mode" = "improve" ]; then
            # /aw-improve is a suggestion re-run, not a review round. It must
            # not consume round 1, must not set a label, and must not merge.
            round=informational
          elif has_label "devteam:needs-human"; then
            # Terminal until a human removes the label. The review still runs
            # and still posts its findings — it just cannot change state.
            round=needs-human
          elif has_label "devteam:awaiting-fixes"; then
            round=2
          else
            round=1
          fi
          echo "round=$round" >> "$GITHUB_OUTPUT"
          # Draft state gates the MERGE, not the review: reviewing a WIP draft
          # early is the point, un-drafting and merging it is not. See the
          # eligibility step and the merge job's own live re-check.
          echo "is_draft=${is_draft:-false}" >> "$GITHUB_OUTPUT"
          echo "round=$round is_draft=${is_draft:-false} (labels: $(printf '%s' "$labels" | tr '\n' ' '))"

          # ---- `synchronize` is the fix-cycle rounds' automatic trigger ----
          # The coder pushing fixes is exactly the event rounds 2 and
          # `needs-human` are waiting for, and making it automatic removes
          # the one manual step left in the loop. Making it a review of
          # EVERY push is a different and much more expensive thing: one
          # judge run plus up to 3 research runs of real subscription
          # budget, on a diff PR-Agent has already reviewed. So a
          # synchronize is refused here unless the PR is genuinely
          # mid-fix-cycle (`devteam:awaiting-fixes` -> round 2, or
          # `devteam:needs-human` -> round needs-human).
          #
          # `needs-human` admits a push for the same reason round 2 does,
          # and v1.10.0 added it because refusing it was the worse of the
          # two costs: the PR's `devteam/code-review` status is per-commit,
          # so a silently-skipped synchronize leaves the PREVIOUS commit's
          # pass on display, which reads as "the escalated finding is
          # resolved" when nothing looked at the fix at all. The window is
          # self-closing — the first clean `blocks_merge` verdict removes
          # the label — and a still-blocking re-run posts no new escalate
          # event, so repeated pushes cost budget but never re-ping a human.
          #
          # Round 1 is still refused AFTER the label read and BEFORE
          # anything paid: that one `gh api` call is the whole cost of a
          # push to a PR no review has ever run on, which is the
          # high-volume case this strictness was written for. `/aw-review`
          # still forces a review from any state.
          if [ "${{ github.event.action }}" = "synchronize" ] \
             && [ "$round" != "2" ] && [ "$round" != "needs-human" ]; then
            echo "synchronize on a round-$round PR — not re-reviewing. \
            Automatic re-review is for the fix-cycle rounds only (labels \
            devteam:awaiting-fixes, devteam:needs-human); \
            comment /aw-review to force one."
            echo "allowed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! is_trusted "$author"; then
            {
              echo "### Deep review skipped: \`$author\` is not a trusted author"
              echo
              echo "\`AW_REVIEW_TRUSTED_AUTHORS\` is \`$allowlist\`. This narrows"
              echo "same-repo pushes to reviewers worth the credentialed run's"
              echo "budget."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "allowed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "allowed=true" >> "$GITHUB_OUTPUT"

  code-review:
    needs: gate
    if: needs.gate.outputs.allowed == 'true'
    runs-on: ${{ fromJSON(inputs.runs_on) }}
    outputs:
      # Read by `merge-attempt`'s same-run entry point, purely to decide
      # whether spawning that job is worth a runner at all. It is NOT the
      # authority: the job re-reads the `devteam/merge-eligible` status on
      # the PR's LIVE head before merging, because that is the only form of
      # the answer that is pinned to a SHA.
      eligible: ${{ steps.findings.outputs.eligible }}
    # Hard ceiling on a dead/stalled judge — paired with the server-side 900s
    # runner timeout on the dispatch call below and the always()-finalize
    # step, so `devteam/code-review` can never stay `pending` forever.
    #
    # 25, down from 45 in v1.2.1. The 45 was (dispatch 15) + (the old
    # ci_gate's own 20-minute poll) + headroom, and the two budgets had to
    # NEST rather than overlap — at 20/20 the job died before the gate could
    # print its own "still waiting" diagnostic, which is how AP-MT PR #6 lost
    # a passing round 2 to a bare `The operation was canceled`. The poll is
    # gone, so the only long thing left in this job is the dispatch and its
    # 900s = 15 min server-side ceiling; 25 leaves 10 minutes for everything
    # else (posting N inline comments on a big review is the slow part) and
    # no longer holds a runner for 45.
    timeout-minutes: 25
    steps:
      - name: Mark code review pending
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X POST "repos/${{ github.repository }}/statuses/${{ needs.gate.outputs.sha }}" \
            -f state=pending \
            -f context=devteam/code-review \
            -f description="Dev Team deep review in progress" \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --silent

      # Agent-scoped Agents Platform ApiKey, workspace-bound, scoped to
      # `code-reviewer-sonnet` alone — minted and set as a secret on each
      # caller repo already (not re-minted here). A key that is NOT
      # workspace-bound gives an opaque 500 at the `/v1` door, not a 401.
      #
      # `curl --max-time 960` outlives the server-side 900s runner ceiling on
      # purpose, so a slow-but-alive run gets its own answer back rather than
      # this step timing out first and masking it as a dispatch failure.
      #
      # The message body is plain coordinates, no [SYSTEM] framing and no
      # anti-refusal wording: the platform's own /v1 door injects this text as
      # a USER turn, and anti-refusal boilerplate has caused refusals here
      # before. Everything tunable about the review itself (lenses, budget,
      # output schema, comment-placement rule, bot-identity banner) lives in
      # the aw-agent-code-reviewer skill's "PR deep-review entry path"
      # section, not here.
      - name: Dispatch Code Reviewer - Sonnet
        id: dispatch
        env:
          AW_CODEREVIEW_V1_KEY: ${{ secrets.AW_CODEREVIEW_V1_KEY }}
          DISPATCH_URL: ${{ inputs.dispatch_url }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ needs.gate.outputs.pr_number }}
          HEAD_SHA: ${{ needs.gate.outputs.sha }}
          BASE_REF: ${{ needs.gate.outputs.base }}
          MODE: ${{ needs.gate.outputs.mode }}
          ROUND: ${{ needs.gate.outputs.round }}
        run: |
          set -euo pipefail
          if [ -z "${AW_CODEREVIEW_V1_KEY:-}" ]; then
            echo "::error::AW_CODEREVIEW_V1_KEY is not set on ${REPO}. Either the \
            secret is missing or the caller did not pass \`secrets: inherit\`. It must \
            be a WORKSPACE-BOUND Agents Platform ApiKey scoped to code-reviewer-sonnet."
            exit 1
          fi
          payload="$(jq -n \
            --arg repo "$REPO" --arg pr "$PR_NUMBER" \
            --arg sha "$HEAD_SHA" --arg base "$BASE_REF" --arg mode "$MODE" \
            --arg round "$ROUND" \
            '{
              model: "agent/code-reviewer-sonnet",
              messages: [{role: "user", content: (
                "PR deep review. Repo: " + $repo + ". PR #" + $pr +
                ". Head SHA: " + $sha + ". Base ref: " + $base +
                ". Round: " + $round + ". " +
                (if $round == "2" or $round == "needs-human" then
                  "This is a ROUND 2 review: the coder has already addressed " +
                  "round 1 and pushed fixes. Follow the \"Round 2: the " +
                  "major-only lens\" section of the aw-agent-code-reviewer " +
                  "skill, in addition to the entry-path section below. Your " +
                  "JSON must include the required per-finding boolean " +
                  "`blocks_merge` that section defines. Read the coder'\''s " +
                  "\"Won'\''t do:\" replies on the PR as input before judging " +
                  "a finding they declined. " +
                  (if $round == "needs-human" then
                    "NOTE: this PR already carries the `devteam:needs-human` " +
                    "label from an earlier escalation. Judge it exactly like " +
                    "round 2: if nothing you find is genuinely `blocks_merge`, " +
                    "the label will be REMOVED and the PR will merge. "
                  else "" end)
                else "" end) +
                (if $mode == "improve" then
                  "Triggered via /aw-improve: focus this run specifically " +
                  "on producing improvement suggestions for the current " +
                  "diff (the normal `suggestion` output field), not a full " +
                  "lens sweep. Do not spin up the dependency/CVE research " +
                  "lens unless the diff genuinely needs it (e.g. a new or " +
                  "bumped dependency) -- this is about code-level " +
                  "improvement, not research. "
                else "" end) +
                "Follow the aw-agent-code-reviewer skill'\''s " +
                "\"PR deep-review entry path\" section for the full " +
                "contract (lenses, budget, output JSON schema, comment " +
                "placement). Your final message must be only the JSON " +
                "object described there."
              )}]
            }')"
          http_code="$(curl -sS --max-time 960 -o "$RUNNER_TEMP/dispatch_response.json" \
            -w '%{http_code}' \
            -X POST "${DISPATCH_URL%/}/v1/chat/completions" \
            -H "Authorization: Bearer $AW_CODEREVIEW_V1_KEY" \
            -H "Content-Type: application/json" \
            --data-binary "$payload")"
          echo "dispatch HTTP $http_code"
          cat "$RUNNER_TEMP/dispatch_response.json"
          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            echo "::error::dispatch failed with HTTP $http_code"
            exit 1
          fi

      # The judge never calls `gh` to post its own review: its session's `gh`
      # is the SAME shared personal credential every Dev Team agent
      # reads/writes the repo with, so a comment posted through it would
      # render as Frederico's own GitHub account. This step parses the
      # judge's returned JSON and posts every comment itself, under
      # `secrets.GITHUB_TOKEN` (renders as `github-actions[bot]`), with a
      # distinct banner.
      - name: Post findings and prepare the status description
        id: findings
        if: always() && steps.dispatch.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ needs.gate.outputs.pr_number }}
          HEAD_SHA: ${{ needs.gate.outputs.sha }}
          ROUND: ${{ needs.gate.outputs.round }}
          IS_DRAFT: ${{ needs.gate.outputs.is_draft }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 <<'PYEOF'
          import json
          import os
          import re
          import subprocess
          import sys

          # RUNNER_TEMP, not a hardcoded /tmp path: a self-hosted runner
          # can process more than one job's /tmp at once (two PRs reviewed
          # around the same time, or this job racing the caller's test/deploy
          # runs on the same host) -- a bare /tmp/devteam_*.json name is
          # shared host state two concurrent jobs can clobber. RUNNER_TEMP is
          # unique per job even on a self-hosted runner.
          TMP = os.environ["RUNNER_TEMP"]

          raw = json.load(open(os.path.join(TMP, "dispatch_response.json")))
          content = raw["choices"][0]["message"]["content"]

          # Strip a markdown fence by matching the OPENING fence's own
          # backtick run against the CLOSING one, not a naive text[3:-3]
          # slice -- a fence can open with 4+ backticks. re.search, not
          # re.match: the judge routinely prefixes the fence with a sentence
          # of prose. Falls back to scanning for the outermost {...} only
          # when there is truly no fence anywhere in the message.
          body = content
          fence = re.search(r"(`{3,})[^\n]*\n(.*?)\n\1`*", content, re.S)
          if fence:
              body = fence.group(2)
          start, end = body.find("{"), body.rfind("}")
          if start == -1 or end == -1:
              print("::error::no JSON object found in the judge's response")
              print(content[:2000], file=sys.stderr)
              sys.exit(1)
          data = json.loads(body[start:end + 1])

          repo = os.environ["REPO"]
          pr = os.environ["PR_NUMBER"]
          sha = os.environ["HEAD_SHA"]
          banner = (
              "\U0001F50E **Dev Team Code Review** — automated deep "
              "review by `code-reviewer-sonnet`."
          )

          findings = data.get("findings") or []
          for f in findings:
              sev = str(f.get("severity", "info")).upper()
              conf = f.get("confidence", "possible")
              klass = f.get("class", "diff_local")
              text = f"{banner}\n\n**[{sev}/{conf}/{klass}]** {f.get('title', '')}\n\n{f.get('body', '')}"
              evidence = f.get("evidence")
              if evidence:
                  text += f"\n\n_Evidence: {evidence}_"

              path, line = f.get("file"), f.get("line")
              # `suggestion` is the raw replacement text for lines
              # line_start..line, nothing else -- only meaningful anchored to
              # a real hunk, so it's ignored on a cross-cutting finding (no
              # path/line). Wrapped in a ```suggestion fence, this renders as
              # GitHub's native one-click-applicable diff.
              suggestion = f.get("suggestion")
              if suggestion and path and line:
                  # Same reasoning as the judge-response fence match above:
                  # don't hardcode a 3-backtick fence -- if `suggestion`
                  # itself contains a ``` run, a fixed fence breaks. Open/close
                  # with one more backtick than the longest run found inside
                  # the text, floor 3.
                  longest_run = max((len(m) for m in re.findall(r"`+", suggestion)), default=0)
                  sugg_fence = "`" * max(longest_run + 1, 3)
                  text += f"\n\n{sugg_fence}suggestion\n{suggestion}\n{sugg_fence}"

              if path and line:
                  # Line-anchored finding -> inline review comment on that hunk.
                  cmd = [
                      "gh", "api", f"repos/{repo}/pulls/{pr}/comments",
                      "-f", f"body={text}", "-f", f"commit_id={sha}",
                      "-f", f"path={path}", "-F", f"line={int(line)}",
                      "-f", "side=RIGHT",
                  ]
                  line_start = f.get("line_start")
                  # GitHub's REST API requires start_line < line strictly --
                  # a reversed/equal range from the judge 422s. Drop to a
                  # single-line suggestion at `line` rather than send one.
                  if line_start and int(line_start) < int(line):
                      cmd += ["-F", f"start_line={int(line_start)}",
                              "-f", "start_side=RIGHT"]
              else:
                  # Cross-cutting finding -> a normal top-level PR comment,
                  # never force-fit onto a line it isn't really about.
                  cmd = ["gh", "api", f"repos/{repo}/issues/{pr}/comments",
                         "-f", f"body={text}"]

              result = subprocess.run(cmd, capture_output=True, text=True)
              if result.returncode != 0:
                  # An inline anchor 422s when that line isn't part of the
                  # diff (stale hunk, renamed file) -- fall back to a
                  # top-level comment rather than silently losing the finding.
                  print(f"::warning::inline comment failed, falling back to "
                        f"top-level: {result.stderr[:300]}")
                  fallback_text = text + f"\n\n_(anchored at {path}:{line} originally)_"
                  subprocess.run(
                      ["gh", "api", f"repos/{repo}/issues/{pr}/comments",
                       "-f", f"body={fallback_text}"],
                      check=True,
                  )

          counts = data.get("counts") or {}
          parts = [f"{v} {k}" for k, v in counts.items() if v]
          desc = ("; ".join(parts) or "no findings")[:140]

          # ---- merge eligibility, and the digest the platform event carries ----
          #
          # Round 1: eligible iff there are NO findings at all. Any finding
          # wakes the coder instead.
          #
          # Round 2 and `needs-human`: eligible iff no finding has
          # `blocks_merge == true`. That boolean — not severity — is the
          # gate, and it is the SAME gate for both: `needs-human` is not a
          # harsher lens, it is round 2 run again on an already-escalated
          # PR. A clean verdict here re-arms the machine (the "Set round
          # labels" step below removes the label), the same as a human
          # manually clearing it.
          #
          # FAIL CLOSED on a missing `blocks_merge`: a finding without the
          # field counts as blocking, on round 2 or `needs-human` alike.
          round_ = os.environ.get("ROUND", "1")

          def _digest(items):
              out = []
              for f in items:
                  out.append({"title": (f.get("title") or "")[:300],
                              "severity": f.get("severity"),
                              "file": f.get("file"),
                              "line": f.get("line"),
                              "blocks_merge": f.get("blocks_merge")})
              return out

          blocking = []
          missing_field = 0
          if round_ in ("2", "needs-human"):
              for f in findings:
                  if "blocks_merge" not in f:
                      missing_field += 1
                      blocking.append(f)
                  elif bool(f.get("blocks_merge")):
                      blocking.append(f)

          if round_ == "1":
              eligible = not findings
          elif round_ in ("2", "needs-human"):
              eligible = not blocking
          else:
              # informational (/aw-improve suggestion runs): never eligible,
              # by definition — it is not a review round at all.
              eligible = False

          # A DRAFT PR is never merge-eligible, whatever the review said.
          if eligible and os.environ.get("IS_DRAFT", "").lower() == "true":
              eligible = False
              print("::notice::PR is a DRAFT — review complete, merge withheld. "
                    "Mark it ready for review to re-run round 1 and merge.")

          if missing_field:
              print(f"::warning::{missing_field} round-2 finding(s) have no "
                    f"`blocks_merge` field — counted as BLOCKING (fail closed). "
                    f"Check the round-2 lens section of the aw-agent-code-reviewer skill.")

          with open(os.path.join(TMP, "devteam_findings.json"), "w") as fh:
              json.dump(_digest(findings), fh)
          with open(os.path.join(TMP, "devteam_blocking.json"), "w") as fh:
              json.dump(_digest(blocking), fh)
          with open(os.path.join(TMP, "devteam_counts.json"), "w") as fh:
              json.dump(counts, fh)

          with open(os.environ["GITHUB_OUTPUT"], "a") as gh_out:
              gh_out.write(f"desc={desc}\n")
              gh_out.write(f"findings_count={len(findings)}\n")
              gh_out.write(f"blocking_count={len(blocking)}\n")
              gh_out.write(f"missing_blocks_merge={missing_field}\n")
              gh_out.write(f"eligible={'true' if eligible else 'false'}\n")
          print(f"round={round_} findings={len(findings)} blocking={len(blocking)} "
                f"eligible={eligible}")

          # ---- publish eligibility AS A COMMIT STATUS ON THIS SHA ----
          #
          # This is the hand-off to `merge-attempt`, and the whole reason the
          # merge no longer needs a poll: the verdict is now durable, pinned
          # to a SHA, and readable by a job in a LATER workflow run that
          # shares no state with this one.
          #
          # WRITTEN ONLY WHEN ELIGIBLE, never as a `failure`/`pending`
          # counterpart. Three reasons, all load-bearing:
          #   - `merge-attempt` treats "no success status on this SHA" as
          #     "not cleared", so absence already carries the negative. A
          #     second state to keep in sync is a second thing to get wrong.
          #   - this context must never look like a failing check on a PR
          #     that is simply mid-fix-cycle, which is the normal state of
          #     every round-1 PR with findings.
          #   - it must not become a blocking check if anyone ever turns on
          #     branch protection — it is in the gate's own ADVISORY set for
          #     the same reason.
          #
          # A new push gets a new SHA with no status, so eligibility can
          # never be inherited by an unreviewed head. That property is the
          # reason this is a status and not a label.
          if eligible:
              subprocess.run(
                  ["gh", "api", "-X", "POST", f"repos/{repo}/statuses/{sha}",
                   "-f", "state=success",
                   "-f", "context=devteam/merge-eligible",
                   "-f", f"description=round {round_}: cleared to merge once CI is green",
                   "-f", f"target_url={os.environ.get('RUN_URL', '')}",
                   "--silent"],
                  check=True,
              )
              print(f"devteam/merge-eligible -> success on {sha[:7]}")
          PYEOF

      # always(), same reason as the gate's own publish step: a status left on
      # `pending` forever is indistinguishable from a queue backlog. A job
      # killed by `timeout-minutes` above still reaches this step.
      - name: Publish code-review status
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISPATCH_OUTCOME: ${{ steps.dispatch.outcome }}
          FINDINGS_OUTCOME: ${{ steps.findings.outcome }}
          DESC: ${{ steps.findings.outputs.desc }}
        run: |
          set -euo pipefail
          if [ "$DISPATCH_OUTCOME" = "success" ] && [ "$FINDINGS_OUTCOME" = "success" ]; then
            state=success
            description="${DESC:-review complete}"
          elif [ "$DISPATCH_OUTCOME" = "cancelled" ] || [ "$FINDINGS_OUTCOME" = "cancelled" ]; then
            state=error
            description="code review cancelled"
          else
            state=failure
            description="code review failed or timed out - see run log"
          fi
          gh api -X POST "repos/${{ github.repository }}/statuses/${{ needs.gate.outputs.sha }}" \
            -f state="$state" \
            -f context=devteam/code-review \
            -f description="$description" \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --silent
          echo "devteam/code-review -> $state ($description)"

      # ---- the round state machine's write to the PR ----
      # Adds a label on round 1/2 escalation, same as always. The one
      # subtraction: a clean `needs-human`-round verdict (no blocking
      # finding) now REMOVES `devteam:needs-human` itself — a human clearing
      # it by hand and a review clearing it by verdict are the same re-arm,
      # so the machine stops being stuck on the human action specifically.
      # A human can still remove it directly at any time to force round 1's
      # full lens on the next push. `devteam:awaiting-fixes` is left in place
      # after round 2 on purpose: it is what makes a later `/aw-review`
      # round 2 (or `needs-human`) again rather than silently round 1. Both
      # labels must already exist on the caller repo — see the caller
      # checklist at the bottom of this file.
      - name: Set round labels
        id: labels
        # always(): the round state must not be lost because an EARLIER step
        # (the status publish, which is itself always()) hiccuped. The real
        # guard is findings.outcome — without a parsed review there is nothing
        # to label.
        if: >-
          always() && steps.findings.outcome == 'success' &&
          (needs.gate.outputs.round == '1' || needs.gate.outputs.round == '2' ||
           needs.gate.outputs.round == 'needs-human')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ROUND: ${{ needs.gate.outputs.round }}
          FINDINGS_COUNT: ${{ steps.findings.outputs.findings_count }}
          BLOCKING_COUNT: ${{ steps.findings.outputs.blocking_count }}
        run: |
          set -euo pipefail
          add_label() {
            gh api -X POST \
              "repos/${{ github.repository }}/issues/${{ needs.gate.outputs.pr_number }}/labels" \
              -f "labels[]=$1" --silent
            echo "labelled: $1"
          }
          remove_label() {
            # 404s if already absent (e.g. a human beat the review to it) --
            # that is the goal state, not a failure. ':' must be
            # percent-encoded in the URL path, or GitHub's API 404s on the
            # literal character — done here, not at the call site, so the
            # log line stays the plain label name.
            encoded="${1/:/%3A}"
            gh api -X DELETE \
              "repos/${{ github.repository }}/issues/${{ needs.gate.outputs.pr_number }}/labels/$encoded" \
              --silent || true
            echo "un-labelled: $1"
          }
          if [ "$ROUND" = "1" ] && [ "${FINDINGS_COUNT:-0}" -gt 0 ]; then
            add_label "devteam:awaiting-fixes"
          elif [ "$ROUND" = "2" ] && [ "${BLOCKING_COUNT:-0}" -gt 0 ]; then
            add_label "devteam:needs-human"
          elif [ "$ROUND" = "needs-human" ] && [ "${BLOCKING_COUNT:-0}" -eq 0 ]; then
            remove_label "devteam:needs-human"
          else
            echo "no label change (round=$ROUND findings=${FINDINGS_COUNT:-0} blocking=${BLOCKING_COUNT:-0})"
          fi

      # ---- tell the platform what this round decided ----
      # LAST, and after the findings are already on the PR: the woken coder
      # must never arrive at a PR with nothing on it. `findings` wakes the
      # coder that opened the PR (resolved server-side from its run_id);
      # `escalate` does not wake anyone and moves the Kanban card to
      # need_human with a sysadmin Telegram ping. `cleared` (v1.5.0) also
      # wakes no one — it exists purely so an eligible round leaves a durable
      # row behind (the close-gate design, card
      # merge-gate-close-loop-backlog-cards): the `merged-event` job looks
      # this row up by head_sha when the PR actually closes, to file Backlog
      # cards for whatever non-blocking leftovers the merged head carried.
      #
      # The endpoint is idempotent on (repo, pr_number, head_sha, round,
      # event), so a re-run of this job is safe. This step is best-effort by
      # design (`continue-on-error`): a platform hiccup must not redden a PR
      # whose review and merge both went fine.
      - name: Report round outcome to the platform
        id: event
        if: >-
          always() && steps.findings.outcome == 'success' &&
          (needs.gate.outputs.round == '1' || needs.gate.outputs.round == '2' ||
           needs.gate.outputs.round == 'needs-human')
        continue-on-error: true
        env:
          AW_DEVTEAM_EVENT_SECRET: ${{ secrets.AW_DEVTEAM_EVENT_SECRET }}
          EVENT_URL: ${{ inputs.event_url }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ needs.gate.outputs.pr_number }}
          HEAD_SHA: ${{ needs.gate.outputs.sha }}
          ROUND: ${{ needs.gate.outputs.round }}
          FINDINGS_COUNT: ${{ steps.findings.outputs.findings_count }}
          BLOCKING_COUNT: ${{ steps.findings.outputs.blocking_count }}
          # Carried into the payload so an `escalate` that happened only
          # because the judge omitted `blocks_merge` says so to the human it
          # pings, instead of reading as a real blocking finding.
          MISSING_BLOCKS_MERGE: ${{ steps.findings.outputs.missing_blocks_merge }}
          ELIGIBLE: ${{ steps.findings.outputs.eligible }}
          PR_URL: ${{ github.server_url }}/${{ github.repository }}/pull/${{ needs.gate.outputs.pr_number }}
        run: |
          set -euo pipefail
          if [ -z "${AW_DEVTEAM_EVENT_SECRET:-}" ]; then
            echo "::warning::AW_DEVTEAM_EVENT_SECRET is not set — the coder cannot be woken."
            exit 0
          fi
          round="$ROUND"
          if [ "$round" = "1" ] && [ "${FINDINGS_COUNT:-0}" -gt 0 ]; then
            event=findings
          elif [ "$round" = "2" ] && [ "${BLOCKING_COUNT:-0}" -gt 0 ]; then
            event=escalate
          elif [ "$round" = "needs-human" ] && [ "${BLOCKING_COUNT:-0}" -gt 0 ]; then
            # Still blocking on an already-escalated PR: this is not new
            # news, `escalate` already fired on the round that set the
            # label. Re-posting it on every push/`/aw-review` would just
            # re-ping a human who already knows.
            echo "still blocking on an escalated PR — no new event"
            exit 0
          else
            # Eligible: still report, as `cleared`. A round-1-clean PR sends
            # an EMPTY findings digest (devteam_findings.json is already []
            # at this point); a round-2/needs-human-clean PR sends whatever
            # non-blocking findings survived, `blocks_merge` flags included.
            # The `merged` event (from the merged-event job, when the PR
            # actually closes) looks this row up by head_sha.
            event=cleared
          fi
          python3 - "$event" <<'PYEOF'
          import hashlib, hmac, json, os, subprocess, sys

          # See the "Post findings" step's own comment: RUNNER_TEMP, not a
          # bare /tmp name, is what keeps two concurrent jobs on a
          # self-hosted runner from clobbering each other's findings files.
          TMP = os.environ["RUNNER_TEMP"]

          event = sys.argv[1]
          base = os.environ["EVENT_URL"].rstrip("/")
          payload = {
              "v": 1,
              "event": event,
              "repo": os.environ["REPO"],
              "pr_number": int(os.environ["PR_NUMBER"]),
              "pr_url": os.environ["PR_URL"],
              "head_sha": os.environ["HEAD_SHA"],
              "round": os.environ["ROUND"],
              "counts": json.load(open(os.path.join(TMP, "devteam_counts.json"))),
              "findings": json.load(open(os.path.join(TMP, "devteam_findings.json"))),
              "blocking": json.load(open(os.path.join(TMP, "devteam_blocking.json"))),
              "missing_blocks_merge": int(os.environ.get("MISSING_BLOCKS_MERGE") or 0),
          }
          # Sign the EXACT bytes that get posted — build once, write once,
          # sign the file's contents, send the file. Signed in python rather
          # than `openssl dgst -hmac "$SECRET"` so the secret never appears
          # in a process argv.
          raw = json.dumps(payload).encode()
          event_path = os.path.join(TMP, "devteam_event.json")
          response_path = os.path.join(TMP, "devteam_event_response.json")
          with open(event_path, "wb") as fh:
              fh.write(raw)
          sig = hmac.new(os.environ["AW_DEVTEAM_EVENT_SECRET"].encode(),
                         raw, hashlib.sha256).hexdigest()
          code = subprocess.run([
              "curl", "-sS", "--max-time", "60", "-o", response_path,
              "-w", "%{http_code}",
              "-X", "POST",
              f"{base}/api/github/devteam-review-event",
              "-H", "Content-Type: application/json",
              "-H", f"X-Hub-Signature-256: sha256={sig}",
              "--data-binary", f"@{event_path}",
          ], capture_output=True, text=True, check=True).stdout.strip()
          body = open(response_path).read()
          print(f"{event} -> HTTP {code}: {body[:800]}")
          if not code.startswith("2"):
              print(f"::warning::devteam-review-event {event} returned HTTP {code}")
              sys.exit(1)
          PYEOF

  # ---------------------------------------------------------------------------
  # PROVENANCE: every Dev Team PR must carry which agent run created it,
  # enforced at a layer no coder can forget or skip (Architect design on
  # Kanban card 40f5bf3b-9510-8174-be1c-c69bdc2676ba). A `prepare-commit-msg`
  # hook stamps an `AW-Run-Id` trailer on every commit a runner container
  # makes (separate card, agents-platform-runners repo); this job is the
  # unskippable half. It fails the PR unless at least one commit actually
  # carries one, and on success records the ids durably on the PR itself —
  # a multi-commit squash-merge can drop commit bodies depending on repo
  # settings, so the merge commit message is NOT relied on.
  #
  # Gated like `code-review` is — `needs.gate.outputs.allowed == 'true'` —
  # same precondition: a fork PR, an untrusted author, or a non-round-2
  # synchronize never reaches either job.
  #
  # Modelled on `devteam/merge-eligible`, not on raw check-run pass/fail:
  # this job's own name is in `merge-attempt`'s ADVISORY set below (like
  # every other job this file defines), so a transient failure here doesn't
  # get re-litigated through the generic "any non-advisory check failing
  # blocks" scan that exists for the CALLER's own CI. The actual gate is the
  # explicit `devteam/provenance` commit status, written ONLY on success and
  # read LIVE by `merge-attempt` — durable across workflow runs, which a
  # `needs.<job>.outputs` read is not (entry point (b) below shares no job
  # graph with the run that set it).
  # ---------------------------------------------------------------------------
  provenance-gate:
    needs: gate
    if: needs.gate.outputs.allowed == 'true'
    runs-on: ${{ fromJSON(inputs.runs_on) }}
    timeout-minutes: 10
    steps:
      - name: Check for a stamped AW-Run-Id trailer and record it on the PR
        id: provenance
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ needs.gate.outputs.pr_number }}
          HEAD_SHA: ${{ needs.gate.outputs.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 <<'PYEOF'
          import json, os, re, subprocess, sys

          REPO = os.environ["REPO"]
          PR_NUMBER = os.environ["PR_NUMBER"]
          SHA = os.environ["HEAD_SHA"]

          def api(path, *, paginate=False):
              cmd = ["gh", "api", path]
              if paginate:
                  cmd.append("--paginate")
              out = subprocess.run(cmd, capture_output=True, text=True, timeout=60)
              if out.returncode != 0:
                  print(f"::error::gh api {path} failed: {out.stderr[:300]}")
                  sys.exit(1)
              return json.loads(out.stdout or "null")

          def publish_cleared(description):
              subprocess.run(
                  ["gh", "api", "-X", "POST", f"repos/{REPO}/statuses/{SHA}",
                   "-f", "state=success",
                   "-f", "context=devteam/provenance",
                   "-f", f"description={description}",
                   "-f", f"target_url={os.environ.get('RUN_URL', '')}",
                   "--silent"],
                  check=True,
              )
              print(f"devteam/provenance -> success on {SHA[:7]} ({description})")

          # ---- the escape hatch, checked FIRST ----
          # Every PR in this rollout shares the `fredericowu` author identity
          # (agent and human both push as the same GitHub user), so an
          # author allowlist cannot tell a human PR from an agent one — a
          # label a human applies by hand is the only exemption that cannot
          # be spoofed by the thing it is meant to catch. Agent contracts
          # forbid applying this label themselves; the threat model here is
          # omission (a coder that forgot/lost the hook), not an adversarial
          # agent faking its way past review.
          labels = api(f"repos/{REPO}/issues/{PR_NUMBER}/labels")
          if any(l.get("name") == "provenance-exempt" for l in (labels or [])):
              publish_cleared("provenance-exempt label applied by a human")
              sys.exit(0)

          # ---- zero commits: nothing to check, and nothing to merge either ----
          # A draft/empty PR has no commit to carry a trailer yet. Failing it
          # here would just be a red check on a PR that was never mergeable
          # from this state anyway (the draft guard in merge-attempt already
          # withholds it) — `devteam/provenance` is simply never published,
          # the same "absence is the negative, not an error" shape as
          # `devteam/merge-eligible`.
          commits = api(f"repos/{REPO}/pulls/{PR_NUMBER}/commits", paginate=True)
          if not commits:
              print(f"PR #{PR_NUMBER} has zero commits — nothing to check")
              sys.exit(0)

          TRAILER_RE = re.compile(r"^AW-Run-Id:\s*([0-9a-f]{32})\s*$", re.MULTILINE)
          SESSION_RE = re.compile(r"^AW-Session-Id:\s*(\S+)\s*$", re.MULTILINE)
          CARD_RE = re.compile(r"^AW-Card:\s*(\S+)\s*$", re.MULTILINE)
          AGENT_RE = re.compile(r"^AW-Agent-Slug:\s*([A-Za-z0-9._-]+)\s*$", re.MULTILINE)

          def first_match(regex, message):
              m = regex.search(message)
              return m.group(1) if m else None

          # Newest commit first: the provenance footer should reflect this
          # PR's most recent work, so a later push's trailer wins over an
          # earlier one even if both happen to carry one.
          found = None
          for commit in reversed(commits):
              message = (commit.get("commit") or {}).get("message") or ""
              run_id = first_match(TRAILER_RE, message)
              if run_id:
                  found = {
                      "run_id": run_id,
                      "session_id": first_match(SESSION_RE, message) or "",
                      "card_id": first_match(CARD_RE, message) or "",
                      "agent_slug": first_match(AGENT_RE, message) or "",
                      "commit_sha": commit.get("sha", "")[:7],
                  }
                  break

          if found is None:
              print(f"::error::no commit on PR #{PR_NUMBER} carries a well-formed "
                    f"AW-Run-Id trailer ({len(commits)} commit(s) checked). Every "
                    f"Dev Team PR must carry which agent run created it — see the "
                    f"aw-agent-coder contract. A human opening this PR by hand "
                    f"should apply the `provenance-exempt` label instead of faking "
                    f"a trailer.")
              sys.exit(1)

          print(f"provenance OK: AW-Run-Id {found['run_id']} on {found['commit_sha']} "
                f"(session={found['session_id'] or '-'} card={found['card_id'] or '-'})")
          with open(os.environ["GITHUB_OUTPUT"], "a") as gh_out:
              for k, v in found.items():
                  gh_out.write(f"{k}={v}\n")
          publish_cleared(f"AW-Run-Id {found['run_id'][:12]}… verified")
          PYEOF

      - name: Record the provenance footer on the PR body and a sticky comment
        if: steps.provenance.outputs.run_id != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ needs.gate.outputs.pr_number }}
          RUN_ID: ${{ steps.provenance.outputs.run_id }}
          SESSION_ID: ${{ steps.provenance.outputs.session_id }}
          CARD_ID: ${{ steps.provenance.outputs.card_id }}
          AGENT_SLUG: ${{ steps.provenance.outputs.agent_slug }}
        run: |
          set -euo pipefail
          python3 <<'PYEOF'
          import json, os, re, subprocess, sys

          REPO = os.environ["REPO"]
          PR_NUMBER = os.environ["PR_NUMBER"]
          # Markers, not a fixed byte range: idempotent on every round (round
          # 1, round 2, a later /aw-review) rather than appending a new
          # footer each time. This is the durable record a squash-merge can
          # drop the commit body of — see the header note on this job.
          START = "<!-- devteam:provenance:start -->"
          END = "<!-- devteam:provenance:end -->"

          lines = [f"**Run:** `{os.environ['RUN_ID']}`"]
          if os.environ.get("SESSION_ID"):
              lines.append(f"**Session:** `{os.environ['SESSION_ID']}`")
          if os.environ.get("CARD_ID"):
              lines.append(f"**Card:** `{os.environ['CARD_ID']}`")
          if os.environ.get("AGENT_SLUG"):
              lines.append(f"**Agent:** `{os.environ['AGENT_SLUG']}`")
          footer = (
              f"{START}\n---\n\U0001F9FE **Provenance** — this PR carries the "
              f"agent run that created it, stamped by a `prepare-commit-msg` "
              f"hook (survives a squash-merge that drops commit bodies).\n\n"
              + "\n".join(lines) + f"\n{END}"
          )

          def gh(*args):
              out = subprocess.run(["gh", *args], capture_output=True, text=True, timeout=60)
              if out.returncode != 0:
                  print(f"::error::gh {' '.join(args)} failed: {out.stderr[:300]}")
                  sys.exit(1)
              return out.stdout

          # ---- PR body: idempotent replace between markers ----
          pr = json.loads(gh("api", f"repos/{REPO}/pulls/{PR_NUMBER}"))
          body = pr.get("body") or ""
          if START in body and END in body:
              body = re.sub(re.escape(START) + r".*?" + re.escape(END), footer,
                             body, flags=re.S)
          else:
              body = body.rstrip() + "\n\n" + footer
          gh("api", "-X", "PATCH", f"repos/{REPO}/pulls/{PR_NUMBER}", "-f", f"body={body}")

          # ---- sticky comment: find-and-update, or create ----
          comments = json.loads(gh("api", f"repos/{REPO}/issues/{PR_NUMBER}/comments",
                                    "--paginate"))
          existing = next((c for c in comments if START in (c.get("body") or "")), None)
          if existing:
              gh("api", "-X", "PATCH", f"repos/{REPO}/issues/comments/{existing['id']}",
                 "-f", f"body={footer}")
          else:
              gh("api", f"repos/{REPO}/issues/{PR_NUMBER}/comments", "-f", f"body={footer}")
          print("provenance footer recorded on the PR body and a sticky comment")
          PYEOF

      # ---- enrichment, not a gate: apply the resolved ids as PR labels ----
      # Pure trailer-to-label mapping, no network dependency beyond GitHub's
      # own API — agent_slug is self-stamped by the same hook as run_id/
      # card_id (agents-platform-runners' prepare-commit-msg), so there is no
      # AP-MT lookup here (that shape was designed and explicitly superseded —
      # see Architect card 4165bf3b-9510-8138-b764-ea10a9f79e9c). `needs:
      # [gate, code-review, provenance-gate]` on `merge-attempt` below means a
      # red step here would block real merges over pure enrichment, so this
      # step is structured to never surface a non-zero exit: every failure
      # mode (missing trailer, a GitHub API hiccup, a label that already
      # exists) becomes a `::warning::` and the script always finishes with
      # `sys.exit(0)`. `continue-on-error` is additional belt-and-braces for
      # a failure mode even that can't anticipate (e.g. python3 itself
      # missing on the runner image).
      - name: Apply provenance labels
        if: steps.provenance.outputs.run_id != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ needs.gate.outputs.pr_number }}
          RUN_ID: ${{ steps.provenance.outputs.run_id }}
          CARD_ID: ${{ steps.provenance.outputs.card_id }}
          AGENT_SLUG: ${{ steps.provenance.outputs.agent_slug }}
        run: |
          python3 <<'PYEOF'
          import json, os, subprocess, sys, urllib.parse

          def main():
              REPO = os.environ["REPO"]
              PR_NUMBER = os.environ["PR_NUMBER"]

              # Data-driven: {label prefix: (value, color, description)}. A
              # future `aw-plan` entry is one line here, not a redesign.
              LABELS = {
                  "aw-run": (os.environ.get("RUN_ID", ""), "0e8a16",
                             "Dev Team provenance: the agent run that created this PR"),
                  "aw-card": (os.environ.get("CARD_ID", "").replace("-", ""), "1d76db",
                              "Dev Team provenance: the Kanban card this PR implements"),
                  "aw-agent": (os.environ.get("AGENT_SLUG", ""), "5319e7",
                               "Dev Team provenance: the agent slug that created this PR"),
              }

              def gh(*args):
                  return subprocess.run(["gh", *args], capture_output=True, text=True, timeout=30)

              existing = gh("api", f"repos/{REPO}/issues/{PR_NUMBER}/labels", "--paginate")
              existing_names = []
              if existing.returncode == 0:
                  try:
                      existing_names = [l.get("name", "") for l in json.loads(existing.stdout or "[]")]
                  except json.JSONDecodeError:
                      print(f"::warning::could not parse existing PR labels: {existing.stdout[:200]}")
              else:
                  print(f"::warning::could not list PR #{PR_NUMBER} labels: {existing.stderr[:200]}")

              for prefix, (value, color, description) in LABELS.items():
                  if not value:
                      continue
                  label_name = f"{prefix}:{value}"
                  if len(label_name) > 50:
                      print(f"::warning::skipping {prefix} label — {label_name!r} exceeds "
                            f"GitHub's 50-char label-name limit")
                      continue

                  # Replace-by-prefix: drop any stale same-prefix label whose
                  # value changed (the colon needs URL-encoding in the path).
                  stale_names = [n for n in existing_names
                                 if n.startswith(f"{prefix}:") and n != label_name]
                  for stale in stale_names:
                      encoded = urllib.parse.quote(stale, safe="")
                      d = gh("api", "-X", "DELETE",
                             f"repos/{REPO}/issues/{PR_NUMBER}/labels/{encoded}")
                      if d.returncode != 0:
                          print(f"::warning::could not remove stale label {stale!r}: "
                                f"{d.stderr[:200]}")

                  if label_name in existing_names:
                      continue  # already applied, nothing to do

                  # Ensure the label exists on the repo — create-on-demand,
                  # treating "already exists" (422) as success.
                  create = gh("api", "-X", "POST", f"repos/{REPO}/labels",
                               "-f", f"name={label_name}", "-f", f"color={color}",
                               "-f", f"description={description}")
                  if create.returncode != 0 and "already_exists" not in create.stderr:
                      print(f"::warning::could not ensure label {label_name!r} exists on "
                            f"{REPO}: {create.stderr[:200]}")

                  add = gh("api", f"repos/{REPO}/issues/{PR_NUMBER}/labels",
                            "-f", f"labels[]={label_name}")
                  if add.returncode != 0:
                      print(f"::warning::could not apply label {label_name!r} to PR "
                            f"#{PR_NUMBER}: {add.stderr[:200]}")
                  else:
                      print(f"applied label {label_name!r}")

          try:
              main()
          except Exception as e:
              print(f"::warning::provenance label step failed unexpectedly: {e!r}")
          sys.exit(0)
          PYEOF

  # ---------------------------------------------------------------------------
  # THE MERGE. One script, two entry points, no polling.
  #
  #   (a) same run — `needs: [gate, code-review]`, taken when the review just
  #       computed eligible=true. The common case: CI was already green
  #       before the verdict landed, so this merges immediately.
  #   (b) `workflow_run` — the caller forwards a `completed` event from its
  #       OWN CI workflow, and this job runs with no gate and no review in
  #       front of it. This is the case the 20-minute poll existed for, and
  #       the reason it can be deleted: the real event arrives whenever CI
  #       actually finishes, at 3 minutes or at 3 hours.
  #
  # `always()` is REQUIRED, not defensive. On entry point (b) BOTH `needs`
  # are skipped (the gate's own `if` admits only pull_request/issue_comment),
  # and a job whose needs were skipped is itself skipped unless the condition
  # is `always()`/`!cancelled()`. The explicit event test then carries the
  # whole decision — which is why it is written out rather than relying on
  # the needs' outcome.
  #
  # `needs.code-review.outputs.eligible` on the same-run arm is an
  # optimisation, not the authority: it decides whether this job is worth a
  # runner. The script re-reads `devteam/merge-eligible` live on the PR's
  # CURRENT head before it merges anything, because that is the only form of
  # the verdict that cannot be stale.
  # ---------------------------------------------------------------------------
  merge-attempt:
    # `provenance-gate` added so entry point (a) WAITS for it to post its own
    # check-run before the live `gh pr checks` read below — without this, a
    # same-run merge attempt can race it and see its own job as "pending",
    # which is the identical self-referential trap `merge-attempt`'s own name
    # is in ADVISORY to avoid (see that set's comment). It does not change
    # whether a provenance failure BLOCKS the merge — that is the explicit
    # `devteam/provenance` status read below, for the same reason
    # `devteam/merge-eligible` is a status and not a `needs` check: entry
    # point (b) shares no job graph with the run that set it.
    needs: [gate, code-review, provenance-gate]
    if: >-
      always() &&
      (
        github.event_name == 'workflow_run' ||
        needs.code-review.outputs.eligible == 'true'
      )
    runs-on: ${{ fromJSON(inputs.runs_on) }}
    # Nothing here waits on anything: a handful of bounded API reads and one
    # merge call. 10 is already generous; if this job is running long it is
    # stuck, not busy.
    timeout-minutes: 10
    steps:
      - name: Attempt the merge
        id: merge
        env:
          # Every READ uses GITHUB_TOKEN. The merge itself does NOT — see the
          # MERGE_TOKEN note in the script.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MERGE_TOKEN: ${{ secrets.AW_DEVTEAM_MERGE_TOKEN }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          CI_CHECK_NAME: ${{ inputs.ci_check_name }}
          # Entry point (a). Empty on a workflow_run run, where both needs
          # are skipped.
          PR_NUMBER: ${{ needs.gate.outputs.pr_number }}
          HEAD_SHA: ${{ needs.gate.outputs.sha }}
          # Entry point (b).
          WORKFLOW_RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          WORKFLOW_RUN_NAME: ${{ github.event.workflow_run.name }}
          WORKFLOW_RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          set -euo pipefail
          python3 <<'PYEOF'
          import json, os, subprocess, sys, time

          REPO = os.environ["REPO"]
          EVENT_NAME = os.environ["EVENT_NAME"]

          # The status the review job writes the instant it computes
          # eligible=true, and only then. Absence of a `success` here on a
          # given SHA IS the negative verdict for that SHA — there is no
          # failure-state counterpart to read.
          ELIGIBLE_CONTEXT = "devteam/merge-eligible"

          # Same shape, written by `provenance-gate` only when a commit on
          # this SHA carries a well-formed `AW-Run-Id` trailer (or a human
          # applied `provenance-exempt`). Read live rather than through
          # `needs.provenance-gate` for the same reason eligibility is: entry
          # point (b) below shares no job graph with the run that set it.
          PROVENANCE_CONTEXT = "devteam/provenance"

          # Pinned BY NAME to the caller's own CI job, via the required
          # `ci_check_name` input (`coverage` on aw-app-template, `pytest` on
          # AP-MT, `unit` on aw-workspace core, `Validate compose config` on
          # aw-stack). Present AND passing is required — "absent" must not
          # read as "fine", or deleting the CI job would silently re-open
          # this merge window.
          REQUIRED = {os.environ["CI_CHECK_NAME"]}

          # Our own review surfaces are advisory by standing rule and must
          # not gate the merge. Names are listed even for repos that don't
          # have the corresponding workflow — an absent check name simply
          # never appears in `gh pr checks` output, so it costs nothing.
          #
          # `devteam/merge-eligible` is in here for the same reason
          # `devteam/code-review` is: it is this loop's own surface, it is
          # advisory by standing rule, and it must never be something the
          # merge waits on.
          #
          # `merge-attempt` is THIS JOB. It is `pending` while this very code
          # runs, so without the entry the single read below would always see
          # a pending check and this job would decline to merge, every time,
          # forever. The old polling gate had the identical hazard with
          # `code-review`; this is the same trap one job over.
          #
          # `CodeRabbit` is the literal check name the CodeRabbit GitHub App
          # publishes (verified against tekflox/aw-app-template PRs #13-15).
          # It is a THIRD-PARTY SaaS reviewer and advisory by the same
          # standing rule as our own — and it must be here, not merely
          # harmless: it sits `pending` for as long as CodeRabbit is
          # reviewing, which without this entry would stall every merge on
          # such a repo. Only aw-app-template has it installed today; the
          # other callers pay nothing for the entry.
          # `devteam/provenance` / `provenance-gate` are here for the exact
          # same reason `devteam/merge-eligible` / `code-review` are: this
          # file's own jobs never gate the merge through their raw
          # check-run pass/fail, only through an explicit status it writes
          # on success. See `PROVENANCE_CONTEXT` below.
          ADVISORY = {"devteam/ai-review", "devteam/code-review",
                      "devteam/merge-eligible", "devteam/provenance",
                      "ai-review", "code-review", "merge-eligible",
                      "provenance-gate", "gate", "fork-notice",
                      "merged-event", "merge-attempt", "CodeRabbit"}

          # As a REUSABLE workflow, this file's jobs are reported to `gh pr
          # checks` as "<caller job id> / <job id>" — e.g. "review /
          # code-review". A flat exact-name match would not recognise any of
          # them. So each row is matched on its full name AND on the segment
          # after the last "/", and the caller's job name is irrelevant
          # either way.
          def tail(name):
              return (name or "").rsplit("/", 1)[-1].strip()

          def is_advisory(name):
              return name in ADVISORY or tail(name) in ADVISORY

          def neutral(msg):
              """There is nothing to merge, and that is not a failure.

              Entry point (b) fires on EVERY completion of the caller's CI
              workflow, on every branch — most of which have no open PR, no
              eligibility status, or CI still running elsewhere. Those must
              exit 0: a red run on an unrelated branch's CI completion is
              noise that trains people to ignore this workflow, and the
              signal that a merge did not happen is the PR still being open.
              """
              print(f"::notice::{msg}")
              sys.exit(0)

          def api(path):
              """`gh api <path>` -> parsed JSON, or None on an unreadable call.

              Bounded, for the same reason the merge gate's `gh pr checks`
              call is: an unbounded `gh` that hangs blocks the step while
              printing nothing at all, which is invisible until the job
              timeout kills it (AP-MT PR #6 sat in exactly that state for
              17m53s). A bounded call turns a hang into a readable failure.
              """
              try:
                  out = subprocess.run(["gh", "api", path],
                                       capture_output=True, text=True, timeout=60)
              except subprocess.TimeoutExpired:
                  print(f"::warning::gh api {path} did not return within 60s")
                  return None
              if out.returncode != 0:
                  print(f"::warning::gh api {path} failed: {out.stderr[:300]}")
                  return None
              try:
                  return json.loads(out.stdout or "null")
              except json.JSONDecodeError:
                  print(f"::warning::could not parse gh api {path}: {out.stdout[:200]}")
                  return None

          # ---- 1. which PR is this event about ----
          if EVENT_NAME == "workflow_run":
              event_sha = os.environ.get("WORKFLOW_RUN_HEAD_SHA") or ""
              print(f"workflow_run: {os.environ.get('WORKFLOW_RUN_NAME')} "
                    f"-> {os.environ.get('WORKFLOW_RUN_CONCLUSION')} on {event_sha[:7]}")
              if not event_sha:
                  neutral("workflow_run event carried no head_sha")
              # `commits/{sha}/pulls`, NOT `github.event.workflow_run
              # .pull_requests[]`. That array is documented as populated only
              # when the head and base are in the SAME repository, and in
              # practice it comes back empty for exactly the runs we care
              # about. Resolving the PR from the SHA is one extra API call
              # and is simply correct.
              pulls = api(f"repos/{REPO}/commits/{event_sha}/pulls")
              if pulls is None:
                  print(f"::error::could not resolve a PR from {event_sha}")
                  sys.exit(1)
              open_pulls = [p for p in pulls if p.get("state") == "open"]
              if not open_pulls:
                  neutral(f"no open PR has {event_sha[:7]} as its head — "
                          f"nothing to merge (a push to the default branch, or an "
                          f"already-merged PR, lands here and is expected)")
              pr_number = open_pulls[0]["number"]
          else:
              pr_number = os.environ.get("PR_NUMBER") or ""
              event_sha = os.environ.get("HEAD_SHA") or ""
              if not pr_number or not event_sha:
                  print("::error::same-run entry point reached with no PR number "
                        "or head SHA from the gate")
                  sys.exit(1)

          # ---- 2. is this PR still a thing we may merge, RIGHT NOW ----
          # Every one of these is re-read live rather than taken from the
          # event payload or from the gate's snapshot. On entry point (b) the
          # payload is about a CI run, not a PR, and on entry point (a) the
          # snapshot can be 20 minutes old — the author can close, draft or
          # push to the PR during the review, and those are precisely the
          # moments they most mean "do not merge this".
          pr = api(f"repos/{REPO}/pulls/{pr_number}")
          if pr is None:
              print(f"::error::could not read PR #{pr_number}; refusing to merge")
              sys.exit(1)

          if pr.get("merged"):
              print(f"#{pr_number} is already merged — nothing to do")
              sys.exit(0)
          if pr.get("state") != "open":
              neutral(f"#{pr_number} is {pr.get('state')} — not merging")

          # Fork guard, on BOTH entry points. The gate has its own for the
          # review; this one is independent because entry point (b) never
          # passes through the gate at all, and a `workflow_run` run executes
          # with the caller's full secrets regardless of where the PR came
          # from.
          head_repo = ((pr.get("head") or {}).get("repo") or {}).get("full_name")
          if head_repo != REPO:
              neutral(f"#{pr_number}'s head is {head_repo or 'a deleted fork'}, "
                      f"not {REPO} — declining to merge a fork PR")

          if pr.get("draft"):
              neutral(f"#{pr_number} is a draft — not merging. Mark it ready for "
                      f"review to re-run round 1.")

          live_sha = ((pr.get("head") or {}).get("sha")) or ""
          if live_sha != event_sha:
              # NEW IN v1.3.0, and it closes a race the polling version had
              # wide open: the old gate merged "the PR", not "the SHA the
              # review passed". A push landing between the verdict and the
              # merge therefore shipped an unreviewed head under a review
              # that never saw it.
              neutral(f"#{pr_number}'s head moved to {live_sha[:7]} since "
                      f"{event_sha[:7]} was cleared — not merging. The new head "
                      f"gets its own review.")

          # ---- 3. eligibility, read live from the commit status ----
          combined = api(f"repos/{REPO}/commits/{live_sha}/status")
          if combined is None:
              print(f"::error::could not read commit statuses on {live_sha[:7]}; "
                    f"refusing to merge")
              sys.exit(1)
          statuses = combined.get("statuses") or []
          cleared = any(s.get("context") == ELIGIBLE_CONTEXT
                        and s.get("state") == "success"
                        for s in statuses)
          if not cleared:
              neutral(f"{ELIGIBLE_CONTEXT} is not success on {live_sha[:7]} — the "
                      f"review has not cleared this head for merge")

          provenance_cleared = any(s.get("context") == PROVENANCE_CONTEXT
                                    and s.get("state") == "success"
                                    for s in statuses)
          if not provenance_cleared:
              neutral(f"{PROVENANCE_CONTEXT} is not success on {live_sha[:7]} — no "
                      f"commit on this PR carries a verified AW-Run-Id trailer (or "
                      f"the provenance-exempt label) — not merging")

          # ---- 4. the caller's own CI: ONE bounded read, no loop ----
          def checks():
              # `timeout=` is not optional. Without it a hung `gh` blocks
              # this step forever, printing NOTHING. AP-MT PR #6's round 2
              # sat in exactly this call for 17m53s and emitted not one line
              # between `##[endgroup]` and `The operation was canceled`. A
              # bounded call turns that into a retryable failed read, which
              # the `rows is None` branch already knows how to handle.
              try:
                  out = subprocess.run(
                      ["gh", "pr", "checks", str(pr_number), "--repo", REPO,
                       "--json", "name,state,bucket"],
                      capture_output=True, text=True, timeout=60)
              except subprocess.TimeoutExpired:
                  print("::warning::gh pr checks did not return within 60s; "
                        "treating as a failed read and retrying")
                  return None
              # `gh pr checks` exits non-zero when anything is failing or
              # pending, so returncode is not an error signal here — only
              # unparseable output is. But empty stdout WITH stderr content
              # is a real command failure (bad flag, auth, transient API
              # error) — `out.stdout or "[]"` used to treat that identically
              # to "found zero checks", which silently turned a real error
              # into "required check did not pass" on AP-MT PR #7 (confirmed
              # live: 4 straight /aw-review retries, same instant empty
              # result, even ~40 min after pytest had actually gone green).
              #
              # The underlying cause there was a MISSING `checks: read` on
              # the caller's token: `gh pr checks` reads check-runs through
              # the Checks API, and on a PRIVATE repo that read is refused
              # without it — deterministically, not flakily. `actions: read`
              # is a second, separate scope the same call needs (AP-MT PR
              # #9). A public repo's rollup is readable without either, which
              # is why the same code merged fine on the public
              # aw-app-template and failed every single round on the private
              # AP-MT. See the caller checklist at the bottom of this file:
              # both scopes are REQUIRED, on both sides.
              stdout = out.stdout.strip()
              if not stdout:
                  if out.stderr.strip():
                      print(f"::warning::gh pr checks produced no output; stderr: "
                            f"{out.stderr[:300]}")
                      return None
                  return []
              try:
                  return json.loads(stdout)
              except json.JSONDecodeError:
                  print(f"::warning::could not parse gh pr checks output: "
                        f"{out.stdout[:200]} {out.stderr[:200]}")
                  return None

          # Retries cover a FAILED READ (a transient API error, a hung call)
          # — never "CI is still running". Waiting out a pending check is
          # what the 20-minute loop did and what this release exists to
          # delete: a pending check means the CI-completion event has not
          # arrived yet, and that event is the retry.
          rows = None
          for attempt in (1, 2, 3):
              rows = checks()
              if rows is not None:
                  break
              print(f"checks read attempt {attempt} failed")
              if attempt < 3:
                  time.sleep(attempt * 5)
          if rows is None:
              print(f"::error::could not read #{pr_number}'s checks after 3 "
                    f"attempts; refusing to merge")
              sys.exit(1)

          relevant = [r for r in rows if not is_advisory(r.get("name"))]
          pending = [r for r in relevant if r.get("bucket") == "pending"]
          failed = [r for r in relevant if r.get("bucket") in ("fail", "cancel")]
          # Both forms, so `ci_check_name` can name a plain job (`unit`) or,
          # in a caller whose CI is itself reusable, the tail of a
          # "parent / child" name.
          passed = set()
          for r in relevant:
              if r.get("bucket") == "pass":
                  passed.add(r["name"])
                  passed.add(tail(r["name"]))

          if failed:
              # exit 0, deliberately. CI being red is already reported by
              # CI — reddening this job too would just put a second failing
              # check on the PR saying the same thing, and on entry point (b)
              # it would do so on every single failed CI run in the repo. The
              # merge simply does not happen; a later green re-run fires its
              # own workflow_run and this job re-attempts.
              neutral("not merging — CI is not green on this head SHA: "
                      + ", ".join(f"{r['name']}={r.get('state')}" for r in failed))
          if pending:
              neutral("not merging yet — still running: "
                      + ", ".join(r["name"] for r in pending)
                      + ". The CI-completion event will re-attempt this.")

          missing = REQUIRED - passed
          if missing:
              # A warning rather than an error, and still no merge. "Absent"
              # must never read as "fine" — that rule is why `ci_check_name`
              # is required-and-passing rather than not-failing — but the
              # common way to get here is benign (CI has not started on this
              # SHA yet, so nothing is pending AND nothing has passed), and
              # failing the job for it would redden PRs for a race. The
              # genuinely broken case — a CI job that was renamed or deleted
              # — surfaces as a PR that stays open with this warning on it,
              # and `/aw-review` is the recovery path.
              print(f"::warning::not merging — required check(s) {sorted(missing)} "
                    f"have not reported a pass on {live_sha[:7]}. Saw: "
                    f"{sorted((r['name'], r.get('bucket')) for r in relevant)}")
              sys.exit(0)

          print("CI is green: " + ", ".join(sorted(passed)))

          # ---- 5. merge ----
          # `AW_DEVTEAM_MERGE_TOKEN`, a PAT with contents:write +
          # pull-requests:write on the caller repo. NOT `GITHUB_TOKEN`:
          # pushes created by GITHUB_TOKEN do not trigger downstream
          # workflows, so a GITHUB_TOKEN-authored merge push would land and
          # every `on: push` / `on: workflow_run` workflow in the caller repo
          # would silently never fire — a release cut, a deploy, an image
          # build, going dark with a green PR to point at.
          #
          # Plain `gh pr merge --squash`, no `--auto`: `--auto` only pauses
          # for checks that BRANCH PROTECTION marks required, and none of
          # these repos has branch protection (direct push to master is kept
          # deliberately as the break-glass path — if a bad merge breaks this
          # very loop, the fix must not depend on the loop it would be
          # fixing). Everything above is therefore not belt-and-suspenders:
          # it is the ONLY gate between a red test suite and a squash-merge.
          merge_token = os.environ.get("MERGE_TOKEN") or ""
          if not merge_token:
              print("::error::AW_DEVTEAM_MERGE_TOKEN is not set on this repository "
                    "(or the caller did not pass it BY NAME — `secrets: inherit` "
                    "does not cross an account boundary). Refusing to fall back to "
                    "GITHUB_TOKEN: its merge push would not trigger this repo's own "
                    "push-/workflow_run-triggered workflows, so the deploy or "
                    "release that normally follows a merge would silently stop "
                    "happening.")
              sys.exit(1)

          out = subprocess.run(
              ["gh", "pr", "merge", str(pr_number), "--repo", REPO,
               "--squash", "--delete-branch"],
              capture_output=True, text=True, timeout=180,
              env={**os.environ, "GH_TOKEN": merge_token})
          if out.returncode == 0:
              print(f"squash-merged #{pr_number} ({live_sha[:7]}) via "
                    f"AW_DEVTEAM_MERGE_TOKEN")
              sys.exit(0)

          # ALREADY MERGED IS A SUCCESS. Both entry points can fire for the
          # same head SHA — a CI run completing at the same moment the review
          # posts its verdict reaches this code twice — and whichever loses
          # that race must not redden a PR that merged perfectly well.
          after = api(f"repos/{REPO}/pulls/{pr_number}")
          if after and after.get("merged"):
              print(f"#{pr_number} was already merged (the other entry point, or "
                    f"a human, got there first) — treating as success")
              sys.exit(0)
          print(f"::error::gh pr merge failed: {out.stderr[:500]}")
          sys.exit(1)
          PYEOF

  # ---------------------------------------------------------------------------
  # The merged half of the loop, on the real close event.
  #
  # Keying this off `pull_request: closed` + `merged == true` covers a human
  # merging the PR by hand too, which is the case that leaves a shared tree
  # stale.
  #
  # No gate, no dispatch, no reviewer: this job only reports. It runs under the
  # same fork check as the gate, so a closed fork PR cannot reach it.
  #
  # Callers must include `closed` in their `pull_request` types for this to
  # fire at all; the gate job above excludes `closed` explicitly so a close
  # never dispatches a review.
  # ---------------------------------------------------------------------------
  merged-event:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ fromJSON(inputs.runs_on) }}
    steps:
      - name: Report the merge to the platform
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AW_DEVTEAM_EVENT_SECRET: ${{ secrets.AW_DEVTEAM_EVENT_SECRET }}
          EVENT_URL: ${{ inputs.event_url }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          # The squash commit, not the PR head: it is what landed on master,
          # and it makes this delivery's idempotency key unique per merge.
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          # The review happens against the HEAD sha, never the merge commit —
          # a review-digest row keyed on merge_commit_sha can therefore never
          # be found by the server's leftover lookup. Added alongside the old
          # field rather than replacing it, since existing callers may still
          # read `head_sha`.
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          if [ -z "${AW_DEVTEAM_EVENT_SECRET:-}" ]; then
            echo "::warning::AW_DEVTEAM_EVENT_SECRET is not set — the coder will not be \
            woken to sync the shared tree."
            exit 0
          fi
          # Which round we finished on, for the record only — read live, same
          # reason as the gate. Does NOT `exit 1` on a failed fetch (unlike
          # the gate's): guessing there only fills in a human-readable number
          # in the wake prompt, and failing this job instead would mean the
          # coder is never woken to sync the shared tree — strictly worse
          # than an unknown round number.
          labels="__FETCH_FAILED__"
          for attempt in 1 2; do
            if labels="$(gh api "repos/$REPO/issues/$PR_NUMBER/labels" --jq '.[].name')"; then
              break
            fi
            echo "::warning::label fetch attempt $attempt failed"
            labels="__FETCH_FAILED__"
            sleep 3
          done
          if [ "$labels" = "__FETCH_FAILED__" ]; then
            echo "::warning::could not read PR #$PR_NUMBER's labels — reporting round=unknown \
            rather than guessing. The merge itself is unaffected."
            round=unknown
          elif printf '%s\n' "$labels" | grep -Fxq "devteam:awaiting-fixes"; then
            round=2
          else
            round=1
          fi
          ROUND="$round" python3 <<'PYEOF'
          import hashlib, hmac, json, os, re, subprocess, sys

          # Same RUNNER_TEMP reasoning as the findings/escalate event block.
          TMP = os.environ["RUNNER_TEMP"]

          def _unchecked_items(body):
              """Literal `- [ ]` (unchecked) checklist lines out of a PR body.

              HTML comments are stripped FIRST, so a template's commented-out
              boilerplate checklist is never picked up. Bounded to 50 items of
              300 chars each — truncate, never error, on a pathological body.
              """
              body = re.sub(r"<!--.*?-->", "", body or "", flags=re.DOTALL)
              items = []
              for line in body.splitlines():
                  m = re.match(r"^\s*-\s*\[\s*\]\s*(.+)$", line)
                  if m:
                      items.append(m.group(1).strip()[:300])
              return items[:50]

          base = os.environ["EVENT_URL"].rstrip("/")
          payload = {
              "v": 1,
              "event": "merged",
              "repo": os.environ["REPO"],
              "pr_number": int(os.environ["PR_NUMBER"]),
              "pr_url": os.environ["PR_URL"],
              "head_sha": os.environ["MERGE_SHA"],
              "pr_head_sha": os.environ["PR_HEAD_SHA"],
              "unchecked_items": _unchecked_items(os.environ.get("PR_BODY", "")),
              "round": os.environ["ROUND"],
              "counts": {},
          }
          raw = json.dumps(payload).encode()
          event_path = os.path.join(TMP, "devteam_event.json")
          response_path = os.path.join(TMP, "devteam_event_response.json")
          with open(event_path, "wb") as fh:
              fh.write(raw)
          sig = hmac.new(os.environ["AW_DEVTEAM_EVENT_SECRET"].encode(),
                         raw, hashlib.sha256).hexdigest()
          code = subprocess.run([
              "curl", "-sS", "--max-time", "60", "-o", response_path,
              "-w", "%{http_code}",
              "-X", "POST",
              f"{base}/api/github/devteam-review-event",
              "-H", "Content-Type: application/json",
              "-H", f"X-Hub-Signature-256: sha256={sig}",
              "--data-binary", f"@{event_path}",
          ], capture_output=True, text=True, check=True).stdout.strip()
          body = open(response_path).read()
          print(f"merged -> HTTP {code}: {body[:800]}")
          if not code.startswith("2"):
              print(f"::warning::devteam-review-event merged returned HTTP {code}")
              sys.exit(1)
          PYEOF

# ── CALLER CHECKLIST ──────────────────────────────────────────────────────
# TRIGGER SURFACE, REQUIRED as of v1.3.0 — the caller's `on:` block:
#
#     on:
#       pull_request:
#         types: [opened, reopened, ready_for_review, synchronize, closed]
#       issue_comment:
#         types: [created]
#       workflow_run:
#         workflows: ["<THE CALLER'S OWN CI WORKFLOW `name:`>"]
#         types: [completed]
#
#     concurrency:
#       group: code-review-${{ github.event.pull_request.number
#                || github.event.issue.number
#                || github.event.workflow_run.head_branch }}
#       cancel-in-progress: false
#
# Three things about that block, each of which has a way of going wrong
# silently:
#
#   `synchronize` is what makes the fix-cycle rounds — 2 and `needs-human`
#   — automatic. Without it the loop still works, it just needs a
#   `/aw-review` comment after every fix push, which is what v1.2.1 and
#   earlier required. The gate refuses a round-1 synchronize after a single
#   label read, so adding it does not spend review budget on the pushes of
#   a PR no review has run on yet.
#
#   `workflow_run.workflows:` takes the CI workflow's `name:` — the human
#   string at the top of that file, NOT its filename and NOT its job id.
#   ("Test" on aw-app-template / AP-MT / aw-workspace, "CI" on aw-stack.)
#   Get it wrong, or rename the CI workflow later, and nothing fails: the
#   event simply never fires, and merges whose CI finishes after the review
#   verdict stop happening until someone comments `/aw-review`. Check it with
#   `gh api repos/<owner>/<repo>/actions/workflows --jq '.workflows[].name'`.
#
#   The `|| github.event.workflow_run.head_branch` arm of the concurrency
#   group is not cosmetic. A workflow_run event has neither
#   `pull_request.number` nor `issue.number`, so without it EVERY
#   workflow_run-triggered run in the repo collapses into the single group
#   `code-review-`, and with `cancel-in-progress: false` they queue behind
#   each other one at a time.
#
# AND NOTE: `workflow_run` only ever fires for a trigger definition that is
# already on the DEFAULT BRANCH. The PR that adds this block cannot exercise
# the path the block enables. Land it, then prove it on the next PR.
#
# In the caller's `uses:` job, REQUIRED — all six:
#     permissions:
#       contents: read
#       pull-requests: write
#       issues: write
#       statuses: write
#       checks: read        # <- omitting this breaks PRIVATE repos only
#       actions: read       # <- omitting this ALSO breaks PRIVATE repos only
#
# A caller grant is NECESSARY BUT NOT SUFFICIENT: the effective token is the
# intersection of the caller's block and THIS FILE's own top-level
# `permissions:`, and an unlisted scope there means `none`, not "inherit". So
# a scope has to appear in BOTH. Keep the two lists identical — the test
# `test_the_reusable_requests_every_scope_the_caller_checklist_demands`
# parses this checklist and that block and fails if they diverge, because
# v1.1.1 shipped exactly that divergence and capped every caller to zero.
#
# `checks: read` is not optional and its absence is invisible on a public
# repo. The merge gate reads the PR's checks with `gh pr checks`, which goes
# through the Checks API; on a private repo that read is REFUSED without
# `checks: read` and returns an empty list — deterministically, every round,
# with no error surfaced to the step. The gate then reports
# `required check(s) ['<ci_check_name>'] did not report a pass ... Saw: []`
# and never merges, which reads exactly like a CI failure and sends you to
# look at the wrong workflow. A public repo's rollup is readable without it,
# so the identical caller works there — the two live cases were the public
# tekflox/aw-app-template (merged first try) and the private AP-MT (failed
# four consecutive rounds, ~40 min after its checks had gone green).
#
# `actions: read` is the THIRD, separate scope gap in this same call — found
# after checks: read was already live everywhere. `gh pr checks` always
# embeds checkSuite{workflowRun{...}} in its GraphQL query regardless of the
# requested --json fields (gh CLI v2.97.0, api/query_builder.go), and that
# edge is an Actions-resource read that checks: read does not grant. Missing
# it on a private caller is again a hard, deterministic GraphQL 403 —
# `Resource not accessible by integration (...checkSuite.workflowRun)` — on
# every read, so all three attempts fail and the merge-attempt refuses. Live
# case: fredericowu/agents-platform-multitenant
# PR #9, CI green for hours, gate refused to merge anyway. Checks: read alone
# was not enough because it only covers the Checks API's own name/state/
# conclusion fields, not the edge back to the Actions run that produced the
# check suite.
#
# Per consumer repo, once:
#   - secrets: AW_CODEREVIEW_V1_KEY (workspace-bound, scoped to
#     code-reviewer-sonnet), AW_DEVTEAM_MERGE_TOKEN, AW_DEVTEAM_EVENT_SECRET
#   - labels: devteam:awaiting-fixes (#FBCA04), devteam:needs-human (#B60205),
#     provenance-exempt (#0E8A16) — human-applied only, see `provenance-gate`
#       gh label create devteam:awaiting-fixes --color FBCA04 --repo <owner/repo> \
#         --description "Round 1 found something; the coder is addressing it"
#       gh label create devteam:needs-human --color B60205 --repo <owner/repo> \
#         --description "Round 2 still blocking; a human must decide"
#       gh label create provenance-exempt --color 0E8A16 --repo <owner/repo> \
#         --description "Human-applied: skips provenance-gate. Never apply this yourself."
#   - optional variable AW_REVIEW_TRUSTED_AUTHORS (comma-separated logins).
#     Unset falls back to `fredericowu` in the gate's own code.
#       gh variable set AW_REVIEW_TRUSTED_AUTHORS --body "fredericowu,other" \
#         --repo <owner/repo>
#
# No `--enable-auto-merge` repo setting is needed: this file never calls
# `gh pr merge --auto` (see the merge step's own comment for why).
