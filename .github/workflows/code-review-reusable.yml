name: Code Review (reusable)

# The canonical single-review PR review -> merge loop, as a `workflow_call`
# reusable workflow. Deep PR review by the Dev Team's pipeline reviewer agent
# (`code-reviewer-pipeline` by default), published as the commit status
# `devteam/code-review` on the PR's head SHA.
# ADVISORY BY DESIGN: no single automated reviewer is the authority, and this
# is never promoted to a required check on its own.
#
# ── PROVENANCE ────────────────────────────────────────────────────────────
# Extracted verbatim-in-behaviour from fredericowu/agents-platform-multitenant's
# merged `.github/workflows/code-review.yml` (commit `2aab9cd5`), which was
# itself copy-adapted from tekflox/aw-app-template's original. Three copies of
# the same ~975-line file existed by the third consumer; this is the
# convergence point, and the two older copies became thin callers of it.
#
# Semantics are UNCHANGED from `2aab9cd5`. Only the three axes of real
# variance between those copies became inputs:
#
#   `ci_check_name`  (required) the repo's own CI check that must be present
#                    AND passing before a merge: `coverage` on aw-app-template,
#                    `pytest` on AP-MT, `unit` on aw-workspace core.
#   `runs_on`        (optional) a JSON-encoded `runs-on` value. Default
#                    `"ubuntu-latest"`; AP-MT passes `["self-hosted","aw-baremetal"]`
#                    because its own CI and deploy already live on that runner.
#   `dispatch_url` / `event_url`
#                    (optional) the Agents Platform base this loop talks to.
#                    Defaults to the production deployment; separate inputs so a
#                    staging AP-MT could be reviewed by production, or vice
#                    versa, without forking this file.
#   `agent_slug`     (optional, default `code-reviewer-pipeline`) which Agents
#                    Platform agent gets dispatched for the review. Model-agnostic
#                    and flow-detached so CI-dispatched reviews stay off the
#                    `software-engineering` Agents Flow's reprompt/escalation
#                    contract and the underlying model can be changed in AP-MT
#                    without editing this workflow. Callers can still override
#                    it (e.g. `code-reviewer-sonnet`).
#                    purely so a CI-dispatched review (no Kanban card, no
#                    caller session) stops sharing a slug with a node on the
#                    `software-engineering` Agents Flow. Before the split,
#                    every GitHub-CI review was ALSO subject to that flow's
#                    reprompt/escalation contract, because
#                    `_agents_flow_context` keys purely on agent identity —
#                    which is how run `8137817bf28841ee8a3643d2a769f12c` got
#                    reprompted and escalated to a sysadmin page for a review
#                    that had already completed cleanly. `agent_slug` lets a
#                    caller repoint at the flow-detached twin without forking
#                    this file; every other caller is unaffected by the
#                    default.
#
# Everything else is deliberately NOT parameterized. The label names, the
# status context, the round state machine, the fail-closed severity
# rule, the HMAC scheme — varying any of those between repos is how the
# three copies drifted in the first place.
#
# ── PINNING: EXACT TAGS ONLY ──────────────────────────────────────────────
# Callers MUST pin an exact, immutable tag (`@v1.0.0`), never `@master` and
# never a moving major alias (`@v1`). This is not style. `app-release.yml` in
# this estate is referenced via a moving `@master` ref from ~45 app repos, and
# a single fail-loud edit there turned the entire marketplace red at once. A
# tag is never retagged here; a change ships as a new tag and each caller is
# bumped deliberately, with the oldest/most-exercised consumer
# (tekflox/aw-app-template) used as the canary.
#
# ── SECRETS: DECLARED, AND PASSED EXPLICITLY ──────────────────────────────
# All three are declared under `on.workflow_call.secrets:` below as
# `required: false`, and every caller passes them BY NAME.
#
# `secrets: inherit` was tried first and is NOT sufficient, for a reason that
# fails silently rather than loudly. GitHub's rule: "Workflows that call
# reusable workflows in the same organization or enterprise can use the
# `inherit` keyword" — `inherit` does not cross an ACCOUNT boundary. This
# repo is owned by `fredericowu`; `tekflox/aw-app-template` is one of the
# callers. Measured live on 2026-11-04 (aw-app-template PR #16): the caller
# passed `secrets: inherit`, `AW_CODEREVIEW_V1_KEY` IS set on that repo, and
# it still arrived here as an EMPTY STRING. Meanwhile the same-owner caller
# (`fredericowu/aw-workspace`) inherited it fine — which is exactly the shape
# of bug that looks like "the secret is missing" and sends you to the wrong
# repo. Declaring them and passing by name works regardless of who owns what.
#
# Each secret is still read with an explicit "unset" branch, because an
# optional, unpassed secret yields an EMPTY STRING here, never an error — and
# that guard is what turned the failure above into a one-line CI error naming
# the repo instead of a confusing downstream 401:
#
#   `AW_CODEREVIEW_V1_KEY`     the reviewer dispatch; MUST be a
#                              WORKSPACE-BOUND Agents Platform ApiKey (an
#                              unbound key gives an opaque 500 at the `/v1`
#                              door), scoped to `code-reviewer-sonnet`.
#   `AW_DEVTEAM_MERGE_TOKEN`   the merge PAT. See the merge step: falling back
#                              to GITHUB_TOKEN is REFUSED, loudly.
#   `AW_DEVTEAM_EVENT_SECRET`  the HMAC key the platform's
#                              `/api/github/devteam-review-event` verifies.
#   `GITHUB_TOKEN`             always present in a reusable workflow; used for
#                              every read, every comment, every status, every
#                              label. Never for the merge.
#
# ── CONCURRENCY LIVES IN THE CALLER ───────────────────────────────────────
# Workflow-level `concurrency` is deliberately absent here: a reusable
# workflow's `concurrency` would key on THIS file's identity, while what
# actually needs serializing is "reviews of caller-repo PR #N". Each caller
# declares its own `concurrency: code-review-<pr#>` with
# `cancel-in-progress: false`.
#
# ── THE PR LIFECYCLE: ONE REVIEW, THEN CLEARED ────────────────────────────
# There is exactly one lifecycle (no opt-in, no second version; the
# deprecated `lifecycle` input is accepted and ignored). Review 1 is the ONLY
# review that can block. Round memory lives ON THE PR as labels, read LIVE via
# `gh api` (never from the event payload, whose `issue_comment` form carries a
# stale label snapshot):
#
#   `devteam:reviewed`   written by the label step once review 1 COMPLETED
#                        (any verdict) and its status was published. Counted
#                        from a bot-authored `labeled` timeline event, so a
#                        hand-added label is not memory.
#   `devteam:fix-cycle`  legacy spelling of the same memory (PRs in flight at
#                        rollout); read, never written.
#   `review-count:N`     the per-PR paid-dispatch ceiling counter
#                        (`max_reviews`), nothing else.
#   `devteam:awaiting-fixes`  never written; a stray one is dropped on push.
#   `devteam:needs-human`     never written or read; a stray one on an old PR
#                        is deleted by the gate. Human-needed state lives on
#                        the Kanban card / `ask_human`, not on the PR.
#
#   (not reviewed)    -> round 1: all lenses. A finding at or above
#                        `block_severity` (a missing/unknown severity always
#                        blocks) turns the `code-review` job red, withholds
#                        merge eligibility and POSTs `findings` (wakes the
#                        coder). Otherwise merge eligibility is written.
#   (reviewed) + push -> `bypass`: NOT re-reviewed; cleared to merge once CI
#                        is green (`devteam/merge-eligible` written by the
#                        gate itself).
#   (reviewed) + `/aw-review` or `/aw-improve` -> `informational`: advisory,
#                        never grants or removes eligibility.
#
# Why labels and not commit counts or status history: `/aw-review` can be
# invoked any number of times, workflow runs get cancelled and re-run.
# Labels encode STATE; counts and history encode the past and break on
# exactly those re-runs.
#
# Each caller repo must have both reviewer/merge secrets; see the "Caller
# checklist" comment at the bottom of this file.
#
# ── THE MERGE IS EVENT-DRIVEN, NOT POLLED (v1.3.0) ────────────────────────
# Through v1.2.1 the merge waited for the caller's CI by polling `gh pr
# checks` in a 20-minute loop inside the review job. That shape produced two
# distinct production bugs on its own (a masking empty-read on AP-MT PR #7, a
# missing `actions: read` on PR #9), burned a 20-minute window on every PR
# whose CI finished after the verdict, and capped the whole loop at 20
# minutes: a repo whose suite is slower than that could never merge at all.
#
# It is replaced by a commit status plus a real event:
#
#   1. The review job writes `devteam/merge-eligible` (state=success) on the
#      PR head SHA at the exact moment it computes `eligible=true`, and never
#      otherwise. That is the single place eligibility is decided — round
#      rule, `blocks_merge` rule, draft rule, all unchanged.
#   2. A `merge-attempt` job verifies that clearance and a successful review
#      came from the same review attempt. It has two entry points:
#        (a) same run, `needs: [gate, code-review]` — today's happy path,
#            where CI was already green before the verdict landed;
#        (b) a `workflow_run: types: [completed]` event on the CALLER's own
#            CI workflow, forwarded by the caller — the case the poll
#            existed for. CI finishing an hour after the verdict now merges
#            an hour after the verdict, instead of never.
#
# A commit status and not a label, because eligibility is a property of a
# SHA. A label is PR-scoped and survives the push that invalidates the review
# that set it, so a label would hand a brand-new, unreviewed head the
# eligibility its predecessor earned. The per-SHA status also IS the
# head-moved guard: the job re-reads the PR's live head before merging, and a
# head that moved simply has no status on it.
#
# What this costs, stated plainly so nobody rediscovers it as a bug:
#   - No poll means no self-healing window. A dropped `workflow_run`
#     delivery, or a merge-attempt that fails mechanically, is not retried by
#     anything — a human (or the coder) runs `/aw-review`, or pushes.
#   - Every completion of the named CI workflow on ANY branch spawns a
#     few-second merge-attempt job, which exits neutral when no open PR owns
#     that SHA. On a self-hosted caller that is real (small) runner noise.
#   - RENAMING THE CALLER'S CI WORKFLOW SILENTLY KILLS THE EVENT PATH. The
#     caller names it as a literal string in `on: workflow_run: workflows:`.
#     Nothing fails; merges just stop happening on the slow-CI path and
#     degrade to manual `/aw-review`. It never merges red — the merge-attempt
#     still reads the checks itself.
#
# ── ONE TRAP, IF YOU ARE EDITING A CALLER'S OWN code-review.yml IN A PR ───
# `pull_request` runs the caller's PR copy (review 1 sees your
# edits live). `issue_comment` (`/aw-review`) and `workflow_run` BOTH always
# run the caller's DEFAULT BRANCH copy. A PR that modifies the caller's
# `code-review.yml` therefore cannot exercise its own comment path or its own
# workflow_run path — verify those on the NEXT PR after merge rather than
# burning time "debugging" them. (A PR that only bumps the `@vX.Y.Z` pin here
# is exactly that case, and so is the PR that first ADDS the `workflow_run`
# trigger: the event cannot fire for a trigger definition that is not yet on
# the default branch, which is why the v1.3.0 canary took two PRs.)

on:
  workflow_call:
    inputs:
      ci_check_name:
        description: >-
          The caller repo's own CI check name that must be PRESENT and PASSING
          on the PR head SHA before this loop will merge. Present-and-passing,
          not merely not-failing: "absent" must never read as "fine", or
          deleting the CI job would silently re-open the merge window.
        required: true
        type: string
      runs_on:
        description: >-
          JSON-encoded `runs-on` value, consumed as
          `fromJSON(inputs.runs_on)`. A JSON string ("ubuntu-latest") or a
          JSON array (["self-hosted","aw-baremetal"]) both work.
        required: false
        type: string
        default: '"ubuntu-latest"'
      dispatch_url:
        description: >-
          Agents Platform base URL for the reviewer dispatch
          (POST <base>/v1/chat/completions).
        required: false
        type: string
        default: 'https://agents-platform.aw.tekflox.com'
      event_url:
        description: >-
          Agents Platform base URL for the round-outcome event
          (POST <base>/api/github/devteam-review-event).
        required: false
        type: string
        default: 'https://agents-platform.aw.tekflox.com'
      agent_slug:
        description: >-
          Agents Platform agent slug to dispatch for the review when
          `workflow_slug` is empty, and displayed in the PR review comment
          banner. Default is `code-reviewer-pipeline`.
        required: false
        type: string
        default: 'code-reviewer-pipeline'
      workflow_slug:
        description: >-
          Agents Platform workflow slug to dispatch for the review
          (`model: "workflow/<workflow_slug>"`). Default is
          `code-review-pipeline`; set to `""` to dispatch
          `agent/<agent_slug>` directly instead.
        required: false
        type: string
        default: 'code-review-pipeline'
      max_reviews:
        description: >-
          Per-PR ceiling on paid review dispatches (v1.13.0). Identity-free:
          counted from the PR timeline's `labeled` events by
          `github-actions[bot]` for `review-count:N` labels (and the legacy
          `devteam:review-N`, still counted), so removing a
          label, force-pushing or re-commenting never resets it. Past the
          ceiling the gate refuses EVERY trigger, `/aw-review` included, and
          says so on the PR (`devteam/review-cap` status, one comment, one
          `escalate` event). `0` disables the ceiling.
        required: false
        type: number
        default: 3
      max_errored_reviews:
        description: >-
          Cap on CONSECUTIVE review attempts that produced no verdict
          (reviewer errored, invalid verdict, dispatch failure). An errored
          attempt is refunded (it never counts toward `max_reviews`), so this
          is the separate bound that stops a broken reviewer from looping
          forever: once this many errored attempts in a row stand on the PR
          the gate refuses, says so, and a human decides. A completed review
          resets the streak. `0` disables the bound.
        required: false
        type: number
        default: 3
      lifecycle:
        description: >-
          DEPRECATED AND IGNORED. There is exactly one PR lifecycle and it is
          always on; this input is declared only so callers that still pass
          `lifecycle: v2` (or any value) are not rejected with an
          invalid-input error. It never changes behaviour; delete it from
          your caller whenever convenient.
        required: false
        type: string
        default: ''
      block_severity:
        description: >-
          Lowest severity that blocks on review 1
          (`low`, `medium`, `high`, `critical`). A finding with a missing or
          unknown severity ALWAYS blocks (fail closed).
        required: false
        type: string
        default: 'medium'
    secrets:
      # All `required: false`, deliberately. A caller missing one gets a
      # precise, fail-loud error from the step that needs it, naming the repo
      # and the secret — which is strictly more useful than GitHub refusing
      # the whole workflow call with a generic validation error before any of
      # our own diagnostics can run. See the SECRETS note in this file's
      # header for why these are declared at all rather than inherited.
      AW_CODEREVIEW_V1_KEY:
        description: >-
          Agents Platform ApiKey for the reviewer dispatch. MUST be
          WORKSPACE-BOUND and scoped to `code-reviewer-pipeline` (or whichever
          `agent_slug` is configured) — an unbound key gives an opaque 500 at
          the /v1 door, not a 401.
        required: false
      AW_DEVTEAM_MERGE_TOKEN:
        description: >-
          PAT with contents:write + pull-requests:write on the caller repo,
          used ONLY for the squash-merge. Never GITHUB_TOKEN: pushes it
          authors do not trigger downstream workflows.
        required: false
      AW_DEVTEAM_EVENT_SECRET:
        description: >-
          HMAC key the platform's /api/github/devteam-review-event verifies.
        required: false

# Declared here AND on the caller's calling job. For a reusable workflow the
# effective GITHUB_TOKEN permissions are the INTERSECTION of the two, so both
# sides state the same set: this file documents what the loop actually needs,
# and the caller's copy is what lifts a repo whose default workflow
# permissions are read-only.
#
# BOTH SIDES. That is not a stylistic preference, it is the whole mechanism,
# and v1.1.1 got it wrong by updating only the callers. Once a `permissions:`
# key names ANY scope, every scope it does not name is forced to `none`
# (GitHub docs, `permissions`: "If you specify the access for any of these
# permissions, all of those that are not specified are set to `none`"). So an
# omission here is not "inherit from the caller", it is an explicit `none`,
# and it silently caps every caller to zero no matter what they grant. A
# caller-side grant alone buys nothing.
#
# `checks: read` is the one that made this concrete. v1.1.1 added it to all
# three callers and to the checklist below, and left this block untouched —
# so the private-repo bug it was cut to fix was still fully live, now with a
# better error message instead of a fix. Caught in review on
# aw-app-template#17; fixed in v1.1.2, and guarded by a test
# (`test_the_reusable_requests_every_scope_the_caller_checklist_demands`) so
# the two lists cannot drift apart again.
permissions:
  contents: read
  pull-requests: write
  issues: write
  statuses: write
  # Required for `gh pr checks` in the merge-attempt job to see check-runs at
  # all on a PRIVATE caller. See the long note in the CALLER CHECKLIST below.
  checks: read
  # SEPARATE from checks: read, and additionally required. gh CLI's `gh pr
  # checks` always builds a GraphQL query that embeds
  # checkSuite{workflowRun{workflow{name}}} inside the CheckRun fragment, no
  # matter which --json fields you ask for (gh v2.97.0, api/query_builder.go).
  # Resolving that checkSuite -> workflowRun edge is an Actions-resource read,
  # not a Checks-API read, so checks: read alone does not cover it. On a
  # PRIVATE caller, missing this is a deterministic
  # "Resource not accessible by integration (...checkSuite.workflowRun)"
  # GraphQL error on every read — not transient, so no number of retries can
  # ever succeed. See the long note in the CALLER CHECKLIST below.
  actions: read

jobs:
  # Same two-entry-path shape as the original (fork check on both paths,
  # first-token command parse, comment body via env never interpolated into
  # the shell): an author allowlist, narrower than the fork check and layered
  # on top of it, not instead of it.
  #
  # `github.repository`, `github.event.*` and the `vars` context all resolve
  # against the CALLER repository inside a reusable workflow, which is why the
  # trusted-author gate needs no input: `vars.AW_REVIEW_TRUSTED_AUTHORS` is
  # read from whichever repo is calling.
  gate:
    if: >-
      github.event.sender.type != 'Bot' &&
      github.event.action != 'closed' &&
      (
        (
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        ) ||
        (
          github.event_name == 'issue_comment' &&
          github.event.issue.pull_request != null &&
          contains(
            fromJSON('["OWNER","MEMBER","COLLABORATOR"]'),
            github.event.comment.author_association
          )
        )
      )
    runs-on: ${{ fromJSON(inputs.runs_on) }}
    outputs:
      allowed: ${{ steps.decide.outputs.allowed }}
      sha: ${{ steps.decide.outputs.sha }}
      base: ${{ steps.decide.outputs.base }}
      pr_number: ${{ steps.decide.outputs.pr_number }}
      mode: ${{ steps.decide.outputs.mode }}
      round: ${{ steps.decide.outputs.round }}
      is_draft: ${{ steps.decide.outputs.is_draft }}
      bypass: ${{ steps.decide.outputs.bypass }}
      charged: ${{ steps.decide.outputs.charged }}
      slot: ${{ steps.decide.outputs.slot }}
      charge: ${{ steps.decide.outputs.charge }}
    # Same-head dedupe, part 1: two triggers for ONE head (opened + a quick
    # synchronize, a comment racing a push) must not both pass the gate at the
    # same instant. The caller's own group is keyed per PR but a caller can
    # key it differently (or not at all), so the gate serialises itself per
    # PR here (NOT per head: a comment event has no head sha in its context
    # and would get a different key than the PR event it races); part 2 (the `devteam/code-review` pending check in
    # Decide) is what makes the second one refuse.
    concurrency:
      group: code-review-gate-${{ github.repository }}-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: false
    steps:
      # DECIDE. Comments live HERE, not
      # in the script: GitHub rejects a `run:` over 21,000 characters as a
      # workflow-file error, and this script is close to that cap.
      #  * Round memory: "review 1 completed" = a `labeled` timeline event by
      #    github-actions[bot] for `devteam:reviewed` (written by "Set round
      #    labels" on any completed round-1 verdict) or the legacy
      #    `devteam:fix-cycle` (PRs in flight at rollout). A hand-added label is
      #    not counted. An unreadable timeline fails CLOSED (red, re-runnable).
      #  * Not reviewed -> round 1. Reviewed + pull_request event -> `bypass`.
      #    Reviewed + /aw-review -> `informational` (advisory; never grants or
      #    removes eligibility).
      #  * Bypass runs after the trusted-author check (forks never pass the job
      #    `if`) and writes devteam/code-review + devteam/merge-eligible with ONE
      #    shared target_url, which is what merge-attempt's same-attempt check
      #    needs. A draft gets no clearance; ready_for_review re-enters here.
      - name: Decide
        id: decide
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Via env, never interpolated into the script body — a comment
          # body is attacker-controlled text.
          BODY: ${{ github.event.comment.body }}
          # Comma-separated GitHub logins, set on the CALLER repo with
          # `gh variable set` (no commit) — see this file's trailing caller
          # checklist. Unset resolves to `fredericowu` HERE, in code, never
          # to "nobody" or "everyone" (the
          # allowlist-unset-ships-green-and-invisible failure mode is
          # documented in the KB).
          TRUSTED_AUTHORS: ${{ vars.AW_REVIEW_TRUSTED_AUTHORS }}
          MAX_REVIEWS: ${{ inputs.max_reviews }}
          MAX_ERRORED_REVIEWS: ${{ inputs.max_errored_reviews }}
          # Only used to avoid CHARGING the ceiling for a run whose reviewer
          # job will fail on a missing dispatch key before any request is sent.
          HAS_KEY: ${{ secrets.AW_CODEREVIEW_V1_KEY != '' }}
        run: |
          set -euo pipefail
          allowlist="${TRUSTED_AUTHORS:-fredericowu}"

          is_trusted() {
            local login="$1" entry
            IFS=',' read -ra arr <<< "$allowlist"
            for entry in "${arr[@]}"; do
              entry="$(echo "$entry" | xargs)"
              [ "$entry" = "$login" ] && return 0
            done
            return 1
          }

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            pr_number="${{ github.event.pull_request.number }}"
            sha="${{ github.event.pull_request.head.sha }}"
            base="${{ github.event.pull_request.base.ref }}"
            author="${{ github.event.pull_request.user.login }}"
            is_draft="${{ github.event.pull_request.draft }}"
            mode=review
          else
            # Same first-whitespace-token matching, and the same reason:
            # startsWith('/aw-review') would also match "/aw-reviewing this
            # later", spending a run on a sentence. /aw-improve is the
            # lighter-weight sibling command -- same gate, same judge, just a
            # narrower focus (see the aw-agent-code-reviewer skill's "PR
            # deep-review entry path" for what `mode` changes).
            cmd="$(printf '%s' "$BODY" | head -n 1 | tr -d '\r' | awk '{print $1}')"
            case "$cmd" in
              /aw-review) mode=review ;;
              /aw-improve) mode=improve ;;
              *)
                echo "Not a review command: '$cmd'"
                echo "allowed=false" >> "$GITHUB_OUTPUT"
                exit 0
                ;;
            esac

            pr="$(gh api "repos/${{ github.repository }}/pulls/${{ github.event.issue.number }}")"
            head_repo="$(printf '%s' "$pr" | jq -r '.head.repo.full_name // ""')"
            if [ "$head_repo" != "${{ github.repository }}" ]; then
              {
                echo "### Code review skipped: \`$cmd\` on a fork PR"
                echo
                echo "This pull request's head is \`${head_repo:-a deleted fork}\`, not"
                echo "\`${{ github.repository }}\`. An \`issue_comment\` run has access to"
                echo "this repository's secrets regardless of where the PR came from, so"
                echo "running the credentialed reviewer here would send it over a diff"
                echo "this repository does not control. Declined deliberately."
              } >> "$GITHUB_STEP_SUMMARY"
              echo "allowed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            pr_number="${{ github.event.issue.number }}"
            sha="$(printf '%s' "$pr" | jq -r .head.sha)"
            base="$(printf '%s' "$pr" | jq -r .base.ref)"
            author="$(printf '%s' "$pr" | jq -r .user.login)"
            is_draft="$(printf '%s' "$pr" | jq -r '.draft')"
          fi

          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "base=$base" >> "$GITHUB_OUTPUT"

          # ---- round, from the PR's LIVE labels ----
          # `gh api`, never `github.event.*.labels`: an issue_comment payload
          # carries the label set as it was when the comment was written, so a
          # label this very loop added on the previous round can be missing
          # from it. Reading it live is the difference between a round-2 pass
          # and silently re-running round 1 forever.
          #
          # FAILS LOUDLY, with retries; never falls back to an empty label set.
          labels=""
          for attempt in 1 2 3; do
            if labels="$(gh api "repos/${{ github.repository }}/issues/$pr_number/labels" \
                           --paginate --jq '.[].name')"; then
              break
            fi
            echo "label fetch attempt $attempt failed"
            labels="__FETCH_FAILED__"
            sleep $(( attempt * 3 ))
          done
          if [ "$labels" = "__FETCH_FAILED__" ]; then
            echo "::error::could not read PR #$pr_number's labels after 3 attempts. \
            Refusing to guess the review round: defaulting to round 1 would reset a PR \
            that was already reviewed. Re-run this workflow once the \
            GitHub API is answering again."
            exit 1
          fi
          has_label() { printf '%s\n' "$labels" | grep -Fxq "$1"; }

          # Round memory (see the DECIDE note above this step).
          reviewed=false
          if [ "$mode" != "improve" ]; then
            seen=""
            for attempt in 1 2 3; do
              if seen="$(gh api --paginate "repos/${{ github.repository }}/issues/$pr_number/timeline?per_page=100" \
                           --jq '.[] | select(.event=="labeled" and .actor.login=="github-actions[bot]" and ((.label.name // "") | IN("devteam:reviewed","devteam:fix-cycle"))) | .label.name' \
                           | wc -l | tr -d ' ')"; then
                break
              fi
              seen="__FAILED__"
              sleep $(( attempt * 3 ))
            done
            if [ "$seen" = "__FAILED__" ] || [ -z "$seen" ]; then
              echo "::error::could not read PR #$pr_number's timeline; re-run"
              exit 1
            fi
            [ "$seen" -gt 0 ] && reviewed=true
          fi

          if [ "$mode" = "improve" ]; then
            # /aw-improve is a suggestion re-run, not a review round. It must
            # not consume round 1, must not set a label, and must not merge.
            round=informational
          elif [ "$reviewed" != "true" ]; then
            round=1
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            round=bypass
          else
            round=informational
          fi
          echo "round=$round" >> "$GITHUB_OUTPUT"
          # Draft state gates the MERGE, not the review: reviewing a WIP draft
          # early is the point, un-drafting and merging it is not. See the
          # eligibility step and the merge job's own live re-check.
          echo "is_draft=${is_draft:-false}" >> "$GITHUB_OUTPUT"
          echo "round=$round is_draft=${is_draft:-false} (labels: $(printf '%s' "$labels" | tr '\n' ' '))"

          # ---- a stray `devteam:needs-human` is ignored and deleted ----
          # The gate neither writes nor reads that label any more (human-needed
          # state lives on the Kanban card). One left on an old PR is removed.
          if has_label "devteam:needs-human"; then
            gh api -X DELETE "repos/${{ github.repository }}/issues/$pr_number/labels/devteam%3Aneeds-human" --silent \
              && echo "removed stray devteam:needs-human" \
              || echo "::warning::could not remove stray devteam:needs-human (API call failed or label already absent)"
          fi

          # ---- a push means the coder paid its debt: drop awaiting-fixes ----
          # After the round is computed and BEFORE every refusal exit below, so a refused
          # push (ceiling, untrusted author, reused verdict) never keeps a
          # label that says the coder owes a push. A failed delete is a
          # warning, never a failure (a fork PR token is read-only).
          if [ "${{ github.event.action }}" = "synchronize" ] \
             && has_label "devteam:awaiting-fixes"; then
            gh api -X DELETE "repos/${{ github.repository }}/issues/$pr_number/labels/devteam%3Aawaiting-fixes" --silent \
              && echo "dropped devteam:awaiting-fixes on synchronize" \
              || echo "::warning::could not drop devteam:awaiting-fixes (API call failed or label already absent)"
          fi

          label_api="repos/${{ github.repository }}/issues/$pr_number/labels"

          if ! is_trusted "$author"; then
            {
              echo "### Deep review skipped: \`$author\` is not a trusted author"
              echo
              echo "\`AW_REVIEW_TRUSTED_AUTHORS\` is \`$allowlist\`. This narrows"
              echo "same-repo pushes to reviewers worth the credentialed run's"
              echo "budget."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "allowed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Bypass (see the DECIDE note above this step).
          if [ "$round" = "bypass" ]; then
            if [ "$is_draft" = "true" ]; then
              echo "PR #$pr_number is a draft - no clearance written; ready_for_review will write it."
              echo "allowed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if ! n="$(gh api --paginate "repos/${{ github.repository }}/commits/$sha/statuses" \
                --jq '.[]|select(.context=="devteam/code-review" and (.description|contains("[rk r=1 ")))|1'|wc -l)" || [ "$n" != 0 ]; then
              echo "allowed=false" >> "$GITHUB_OUTPUT"; exit 0
            fi
            attempt_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}"
            gh api -X POST "repos/${{ github.repository }}/statuses/$sha" \
              -f state=success -f context=devteam/code-review \
              -f "description=not re-reviewed: review 1 done [rk r=bypass m=review]" \
              -f "target_url=$attempt_url" --silent
            gh api -X POST "repos/${{ github.repository }}/statuses/$sha" \
              -f state=success -f context=devteam/merge-eligible \
              -f "description=review 1 done: cleared to merge once CI is green" \
              -f "target_url=$attempt_url" --silent
            echo "review 1 already completed - cleared $sha to merge on green CI without a new review"
            {
              echo "allowed=false"
              echo "bypass=true"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # ---- (2) reuse the verdict for an unchanged (sha, round, mode) ----
          # A finished, NOT merge-eligible verdict is stamped on the sha's
          # `devteam/code-review` status as `[rk r=<round> m=<mode>]`. If the
          # latest status on this sha is that stamp for this same round and
          # mode, a second dispatch would reproduce the same review for
          # another judge run of budget, so it is skipped and the standing
          # verdict stays. Never reused: anything that is not a completed
          # success (failure, error, pending), any sha holding a
          # `devteam/merge-eligible` success (a retry there must reach the
          # merge job), and any lookup failure — all fall through to a fresh
          # review, so this can only ever save a run, never clear a PR.
          #
          # The match is on the latest COMPLETED stamp, so an `/aw-improve`,
          # cancelled or errored run cannot reopen it. A new verdict needs a
          # new head.
          if statuses="$(gh api "repos/${{ github.repository }}/commits/$sha/statuses?per_page=100" 2>/dev/null)"; then
            latest="$(printf '%s' "$statuses" | jq -r \
              '[.[] | select(.context=="devteam/code-review")][0] | "\(.state)|\(.description)"' 2>/dev/null || true)"
            eligible_seen="$(printf '%s' "$statuses" | jq -r \
              '[.[] | select(.context=="devteam/merge-eligible" and .state=="success")] | length' 2>/dev/null || echo 1)"
            if [ "$eligible_seen" = "0" ] && [ "${latest%%|*}" = "success" ] \
               && printf '%s' "$latest" | grep -Fq "[rk r=$round m=$mode]"; then
              echo "verdict reused: sha $sha already has a completed review for round=$round mode=$mode — not dispatching again."
              [ "$round$mode" = 1review ] && { gh api -X POST "$label_api" -f "labels[]=devteam:reviewed" --silent || true; }  # lost-response label restore
              echo "allowed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          # ---- (2b) same-head dedupe: a review of this head is already in flight ----
          # The gate (see its `concurrency`) writes the `pending` status for the
          # head it admitted, so a second trigger for the SAME head (opened +
          # synchronize, a comment racing a push) finds it here and does not
          # pay for a second review. Only a FRESH pending counts (30 min, past
          # the review job's own 25-minute ceiling), so a pending left by a
          # dead run never blocks a head for good. Free refusal: before the budget.
          ctx_chk=devteam/code-review
          [ "$round" = informational ] && ctx_chk=devteam/code-review-advisory
          inflight="$(printf '%s' "${statuses:-}" | jq -r --arg c "$ctx_chk" --argjson now "$(date +%s)" \
            '[.[] | select(.context==$c)][0] | select(.state=="pending") | (.updated_at // .created_at | fromdateiso8601) | select($now - . < 1800) | "1"' 2>/dev/null || true)"
          if [ "$inflight" = "1" ]; then
            echo "a review of $sha is already in flight (fresh pending $ctx_chk) — not dispatching a duplicate."
            echo "allowed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # ---- (3) per-PR review ceiling (v1.13.0) ----
          # The caps above bound ONE escalated stretch and are label state,
          # which anyone (a coder running `/aw-review`, a hand edit) can
          # reset: PR #15 on tekflox/aw-app-git got 7 paid reviews in 18
          # minutes that way. This is the identity-free hard stop. Every
          # dispatch that reaches this point spends one unit of a per-PR
          # budget (`max_reviews`, default 3), recorded as a visible `review-count:N`
          # label (legacy `devteam:review-N` stamps still count, so a PR that
          # was part-way through its budget before the rename keeps its count)
          # label this job adds. The COUNT is read from the PR timeline's
          # `labeled` events authored by github-actions[bot] — an event log
          # nobody can edit — so removing the labels or force-pushing resets
          # nothing, and a label a human hand-adds is not counted.
          #
          # It sits AFTER the free refusals (untrusted author, reused
          # verdict) so only a dispatch that would really spend budget
          # spends a unit, and it refuses `/aw-review` from anyone.
          #
          # Failure policy matches the caps above: a failed timeline READ or
          # label WRITE fails OPEN ("review it") with a loud warning, because
          # the ceiling exists to save budget, never to leave a push
          # unreviewed; the refusal itself is made visible by the
          # `Report review ceiling` step, never silent.
          # A review attempt that produced NO verdict (reviewer errored, invalid
          # verdict, dispatch failure) is recorded by the `Refund` step in the
          # review job: a `review-error:<run id>-<attempt>` label (one bot-authored
          # `labeled` event per errored run, charged or not) and, when a unit
          # was charged, a `review-refund:N` label; the budget used is
          # charged - refunded. A completed review adds `review-ok`, which
          # resets the consecutive-errors streak (error events since the last
          # `review-ok`), bounded by `max_errored_reviews` independently of
          # `max_reviews` (otherwise a broken reviewer would loop).
          max_reviews="${MAX_REVIEWS:-3}"
          case "$max_reviews" in ''|*[!0-9]*) max_reviews=3 ;; esac
          max_errored="${MAX_ERRORED_REVIEWS:-3}"
          case "$max_errored" in ''|*[!0-9]*) max_errored=3 ;; esac
          if [ "$max_reviews" -gt 0 ] || [ "$max_errored" -gt 0 ]; then
            names=""
            for attempt in 1 2 3; do
              if names="$(gh api --paginate "repos/${{ github.repository }}/issues/$pr_number/timeline?per_page=100" \
                           --jq '.[] | select(.event=="labeled" and .actor.login=="github-actions[bot]" and ((.label.name // "") | test("^((devteam:review-|review-count:|review-error:)[0-9]+(-[0-9]+)?|review-refund:[0-9]+(:[0-9]+(-[0-9]+)?)?|review-ok)$"))) | .label.name')"; then
                break
              fi
              names="__FAILED__"
              sleep $(( attempt * 3 ))
            done
            used=""
            streak=0
            if [ "$names" != "__FAILED__" ]; then
              charged_n="$(printf '%s\n' "$names" | grep -Ec '^(devteam:review-|review-count:)[0-9]+$' || true)"
              refunded_n="$(printf '%s\n' "$names" | grep -Ec '^review-refund:[0-9]+(:[0-9]+(-[0-9]+)?)?$' || true)"
              used=$(( ${charged_n:-0} - ${refunded_n:-0} ))
              [ "$used" -lt 0 ] && used=0
              while IFS= read -r n; do
                case "$n" in
                  review-error:*) streak=$(( streak + 1 )) ;;
                  review-ok) streak=0 ;;
                esac
              done <<< "$names"
            fi
            cap_kind=""
            if [ -z "$used" ]; then
              echo "::warning::could not read PR #$pr_number's timeline; review ceiling not enforced on this dispatch"
            elif [ "$max_errored" -gt 0 ] && [ "$streak" -ge "$max_errored" ]; then
              echo "reviewer errored $streak times in a row on PR #$pr_number (max_errored_reviews=$max_errored) — refusing."
              cap_kind=errors
              used="$streak"
              max_reviews="$max_errored"
            elif [ "$max_reviews" -gt 0 ] && [ "$used" -ge "$max_reviews" ]; then
              echo "review ceiling reached: $used of $max_reviews reviews already dispatched on PR #$pr_number — refusing."
              cap_kind=budget
            fi
            if [ -n "$cap_kind" ]; then
              # Announced once per PR. The `review-exhausted` label is the
              # "already announced" marker and is stamped by the report step
              # only AFTER the status and comment were delivered, so a
              # transient failure there is retried by the next refused run.
              first=true
              if has_label "devteam:review-exhausted"; then first=false; fi
              # Escalation delivery is tracked apart from the announcement:
              # `review-escalated` is stamped by the nudge job once the human question was asked.
              escalated=false
              if has_label "devteam:review-escalated"; then escalated=true; fi
              {
                echo "allowed=false"
                echo "capped=true"
                echo "cap_kind=$cap_kind"
                echo "first_cap=$first"
                echo "escalated=$escalated"
                echo "review_count=$used"
                echo "max_reviews=$max_reviews"
              } >> "$GITHUB_OUTPUT"
              exit 0
            elif [ -n "$used" ] && [ "$max_reviews" -gt 0 ]; then
              if [ "${HAS_KEY:-true}" != "true" ]; then
                # The reviewer job fails loudly on the missing key before any
                # request is sent: nothing is spent, so nothing is charged.
                echo "::warning::AW_CODEREVIEW_V1_KEY is not set; not charging the review ceiling for a dispatch that cannot start"
              else
                next_label="review-count:$(( used + 1 ))"
                # DELETE first: re-adding a label that is already present emits
                # NO `labeled` event, which would leave the count short (a
                # pre-seeded label must not be able to dodge the ceiling).
                gh api -X DELETE "$label_api/review-count%3A$(( used + 1 ))" --silent 2>/dev/null || true
                if gh api -X POST "$label_api" -f "labels[]=$next_label" --silent; then
                  # Read by the Refund step if this attempt produces no verdict.
                  {
                    echo "charged=true"
                    echo "slot=$(( used + 1 ))"
                    # Unique per gate execution: a full rerun (same run id, new
                    # attempt) re-charges, a failed-jobs rerun reuses this.
                    echo "charge=${GITHUB_RUN_ID:-0}-${GITHUB_RUN_ATTEMPT:-1}"
                  } >> "$GITHUB_OUTPUT"
                else
                  echo "::warning::could not stamp $next_label; reviewing anyway"
                fi
                echo "review $(( used + 1 )) of $max_reviews on PR #$pr_number"
              fi
            fi
          fi
          # Same-head dedupe, part 2 (see the gate's `concurrency`): claim the
          # head by writing the in-flight `pending` status HERE, before the
          # review job exists, so a second trigger for the same head sees it.
          # (Done after the ceiling so a refused head is never marked.)
          echo "allowed=true" >> "$GITHUB_OUTPUT"
          ctx=devteam/code-review
          [ "$round" = informational ] && ctx=devteam/code-review-advisory
          gh api -X POST "repos/${{ github.repository }}/statuses/$sha" \
            -f state=pending -f context="$ctx" \
            -f description="Dev Team deep review in progress" \
            -f "target_url=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}" \
            --silent || echo "::warning::could not write the in-flight status; a concurrent trigger for this head may duplicate"

      - name: Report review ceiling
        id: ceiling
        if: always() && steps.decide.outputs.capped == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AW_DEVTEAM_EVENT_SECRET: ${{ secrets.AW_DEVTEAM_EVENT_SECRET }}
          EVENT_URL: ${{ inputs.event_url }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.decide.outputs.pr_number }}
          HEAD_SHA: ${{ steps.decide.outputs.sha }}
          ROUND: ${{ steps.decide.outputs.round }}
          USED: ${{ steps.decide.outputs.review_count }}
          MAX: ${{ steps.decide.outputs.max_reviews }}
          FIRST: ${{ steps.decide.outputs.first_cap }}
          CAP_KIND: ${{ steps.decide.outputs.cap_kind }}
          ESCALATED: ${{ steps.decide.outputs.escalated }}
          PR_URL: ${{ github.server_url }}/${{ github.repository }}/pull/${{ steps.decide.outputs.pr_number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          # Visible on the head that was refused: a skipped review otherwise
          # leaves the PREVIOUS commit's green on display (the stale-green
          # hazard v1.10.0 closed). Context `devteam/review-cap` is advisory
          # (merge-attempt's ADVISORY set) and is never written on a head
          # that was reviewed.
          gh api -X POST "repos/$REPO/statuses/$HEAD_SHA" \
            -f state=failure \
            -f context=devteam/review-cap \
            -f description="$([ "${CAP_KIND:-budget}" = errors ] && echo "Reviewer errored $USED times in a row: new review skipped" || echo "Review ceiling reached ($USED/$MAX): new review skipped")" \
            -f target_url="$RUN_URL" --silent
          echo "devteam/review-cap -> failure on ${HEAD_SHA:0:7}"
          if [ "$FIRST" = "true" ]; then
          if [ "${CAP_KIND:-budget}" = errors ]; then
            body="**Review skipped: the reviewer errored $USED times in a row** (limit $MAX, \`max_errored_reviews\`).

          Errored attempts are not charged to the paid-review budget, but retrying a reviewer that keeps failing would loop forever, so no further automatic review will run on this PR until a human decides (fix the reviewer, merge, or close). Each later head gets a failing \`devteam/review-cap\` status instead of a review."
          else
            body="**Review ceiling reached** ($USED of $MAX paid reviews used on this PR).

          No further automatic review will run on this PR, and \`/aw-review\` will not run one either: the budget is counted from the PR timeline, so removing labels or re-pushing does not reset it. Each later head gets a failing \`devteam/review-cap\` status instead of a review. A human decides what happens next (merge, close, or raise \`max_reviews\` in this repo's \`code-review.yml\`)."
          fi
          gh api -X POST "repos/$REPO/issues/$PR_NUMBER/comments" -f body="$body" --silent
          # Marker stamped only now that status + comment are delivered.
          gh api -X POST "repos/$REPO/issues/$PR_NUMBER/labels" -f "labels[]=devteam:review-exhausted" --silent \
            || echo "::warning::could not stamp devteam:review-exhausted; the announcement may repeat"
          else
            echo "ceiling already announced on this PR — status only"
          fi
          # Escalation delivery is retried on every refused run until the
          # webhook answers 2xx (retrying buys no paid review).
          if [ "${ESCALATED:-false}" = "true" ]; then
            echo "escalation already delivered — nothing more to send"
            exit 0
          fi
          if [ -z "${AW_DEVTEAM_EVENT_SECRET:-}" ]; then
            echo "::warning::AW_DEVTEAM_EVENT_SECRET is not set — no escalate event sent."
            exit 0
          fi
          python3 - <<'PYEOF'
          import hashlib, hmac, json, os, subprocess
          TMP = os.environ["RUNNER_TEMP"]
          def _pr_labels():
              """Live PR label names, best effort: the platform links a PR to
              its coder run from the aw-run:<id> label, so GitHub is only
              asked here, by the workflow's own token."""
              try:
                  r = subprocess.run(
                      ["gh", "api", f"repos/{os.environ['REPO']}/issues/{os.environ['PR_NUMBER']}/labels",
                       "--paginate", "--jq", ".[].name"], capture_output=True, text=True, timeout=30)
                  return [x for x in r.stdout.splitlines() if x] if r.returncode == 0 else []
              except Exception:
                  return []

          _labels = _pr_labels()
          _run_label = next((x for x in _labels if x.startswith("aw-run:")), "")
          payload = {
              "labels": _labels,
              "run_id": _run_label[len("aw-run:"):],
              "v": 1, "event": "escalate", "repo": os.environ["REPO"],
              "pr_number": int(os.environ["PR_NUMBER"]),
              "pr_url": os.environ["PR_URL"], "head_sha": os.environ["HEAD_SHA"],
              "round": os.environ["ROUND"] or "1",
              "nudge_follows": False,  # no nudge job follows: the platform must escalate itself
              "reason": "review_budget_exhausted",
              "counts": {}, "findings": [], "blocking": [],
              "missing_blocks_merge": 0,
          }
          raw = json.dumps(payload).encode()
          event_path = os.path.join(TMP, "devteam_cap_event.json")
          response_path = os.path.join(TMP, "devteam_cap_event_response.json")
          with open(event_path, "wb") as fh:
              fh.write(raw)
          sig = hmac.new(os.environ["AW_DEVTEAM_EVENT_SECRET"].encode(), raw, hashlib.sha256).hexdigest()
          run = subprocess.run([
              "curl", "-sS", "--max-time", "60", "-o", response_path, "-w", "%{http_code}",
              "-X", "POST", os.environ["EVENT_URL"].rstrip("/") + "/api/github/devteam-review-event",
              "-H", "Content-Type: application/json",
              "-H", f"X-Hub-Signature-256: sha256={sig}",
              "--data-binary", f"@{event_path}",
          ], capture_output=True, text=True)
          code = run.stdout.strip()
          body = open(response_path).read()[:500] if os.path.exists(response_path) else run.stderr.strip()
          print(f"escalate(review_budget_exhausted) -> HTTP {code or 'none'}: {body}")
          # This delivery only STORES the event (AP-MT answers 200 stored:true,
          # acted:false); the human escalation is the platform nudge's ASK. So
          # `devteam:review-escalated` is NOT stamped here: the `nudge` job
          # stamps it once the platform confirms the question was asked. A
          # 2xx with a non-zero curl exit is an incomplete transfer (e.g. 18).
          if run.returncode != 0 or not code.startswith("2"):
              print(f"::warning::devteam-review-event escalate not stored (HTTP {code or 'none'}, curl exit {run.returncode}); will retry on the next refused run")
          PYEOF

  code-review:
    # `provenance-gate` is a needs ONLY so the aw-run/aw-card/aw-agent labels
    # exist before the findings event below reads them (the platform links the
    # PR to its coder run from `aw-run:<id>`; in parallel the label landed
    # after the event and the wake was refused "aw-run label: absent").
    # `!cancelled()` instead of the default success() so a FAILED or SKIPPED
    # provenance-gate (no AW-Run-Id trailer, a human PR) never blocks the review.
    needs: [gate, provenance-gate]
    if: ${{ !cancelled() && needs.gate.outputs.allowed == 'true' }}
    runs-on: ${{ fromJSON(inputs.runs_on) }}
    outputs:
      # Read by `merge-attempt`'s same-run entry point, purely to decide
      # whether spawning that job is worth a runner at all. It is NOT the
      # authority: the job checks the latest review and clearance statuses
      # on the PR's live head before merging.
      eligible: ${{ steps.findings.outputs.eligible }}
    # Hard ceiling on a dead/stalled judge — paired with the server-side 900s
    # runner timeout on the dispatch call below and the always()-finalize
    # step, so `devteam/code-review` can never stay `pending` forever.
    #
    # 25, down from 45 in v1.2.1. The 45 was (dispatch 15) + (the old
    # ci_gate's own 20-minute poll) + headroom, and the two budgets had to
    # NEST rather than overlap — at 20/20 the job died before the gate could
    # print its own "still waiting" diagnostic, which is how AP-MT PR #6 lost
    # a passing round 2 to a bare `The operation was canceled`. The poll is
    # gone, so the only long thing left in this job is the dispatch and its
    # 900s = 15 min server-side ceiling; 25 leaves 10 minutes for everything
    # else (posting N inline comments on a big review is the slow part) and
    # no longer holds a runner for 45.
    timeout-minutes: 25
    steps:
      - name: Mark code review pending
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X POST "repos/${{ github.repository }}/statuses/${{ needs.gate.outputs.sha }}" \
            -f state=pending \
            -f context=${{ needs.gate.outputs.round == 'informational' && 'devteam/code-review-advisory' || 'devteam/code-review' }} \
            -f description="Dev Team deep review in progress" \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}" \
            --silent

      # Agent-scoped Agents Platform ApiKey, workspace-bound, scoped to
      # `code-reviewer-sonnet` alone — minted and set as a secret on each
      # caller repo already (not re-minted here). A key that is NOT
      # workspace-bound gives an opaque 500 at the `/v1` door, not a 401.
      #
      # `curl --max-time 960` outlives the server-side 900s runner ceiling on
      # purpose, so a slow-but-alive run gets its own answer back rather than
      # this step timing out first and masking it as a dispatch failure.
      #
      # The message body is plain coordinates, no [SYSTEM] framing and no
      # anti-refusal wording: the platform's own /v1 door injects this text as
      # a USER turn, and anti-refusal boilerplate has caused refusals here
      # before. Everything tunable about the review itself (lenses, budget,
      # output schema, comment-placement rule, bot-identity banner) lives in
      # the aw-agent-code-reviewer skill's "PR deep-review entry path"
      # section, not here.
      - name: Dispatch Code Reviewer
        id: dispatch
        env:
          AW_CODEREVIEW_V1_KEY: ${{ secrets.AW_CODEREVIEW_V1_KEY }}
          DISPATCH_URL: ${{ inputs.dispatch_url }}
          AGENT_SLUG: ${{ inputs.agent_slug }}
          WORKFLOW_SLUG: ${{ inputs.workflow_slug }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ needs.gate.outputs.pr_number }}
          HEAD_SHA: ${{ needs.gate.outputs.sha }}
          BASE_REF: ${{ needs.gate.outputs.base }}
          MODE: ${{ needs.gate.outputs.mode }}
          ROUND: ${{ needs.gate.outputs.round }}
        run: |
          set -euo pipefail
          if [ -z "${AW_CODEREVIEW_V1_KEY:-}" ]; then
            target="${WORKFLOW_SLUG:-$AGENT_SLUG}"
            echo "::error::AW_CODEREVIEW_V1_KEY is not set on ${REPO}. Either the \
            secret is missing or the caller did not pass \`secrets: inherit\`. It must \
            be a WORKSPACE-BOUND Agents Platform ApiKey scoped to ${target}."
            exit 1
          fi
          payload="$(jq -n \
            --arg repo "$REPO" --arg pr "$PR_NUMBER" \
            --arg sha "$HEAD_SHA" --arg base "$BASE_REF" --arg mode "$MODE" \
            --arg round "$ROUND" --arg agent_slug "$AGENT_SLUG" \
            --arg workflow_slug "$WORKFLOW_SLUG" \
            '{
              model: (if $workflow_slug != "" then ("workflow/" + $workflow_slug) else ("agent/" + $agent_slug) end),
              messages: [{role: "user", content: (
                "PR deep review. Repo: " + $repo + ". PR #" + $pr +
                ". Head SHA: " + $sha + ". Base ref: " + $base +
                ". Round: " + $round + ". " +
                (if $mode == "improve" then
                  "Triggered via /aw-improve: focus this run specifically " +
                  "on producing improvement suggestions for the current " +
                  "diff (the normal `suggestion` output field), not a full " +
                  "lens sweep. Do not spin up the dependency/CVE research " +
                  "lens unless the diff genuinely needs it (e.g. a new or " +
                  "bumped dependency) -- this is about code-level " +
                  "improvement, not research. "
                else "" end) +
                "Follow the aw-agent-code-reviewer skill'\''s " +
                "\"PR deep-review entry path\" section for the full " +
                "contract (lenses, budget, output JSON schema, comment " +
                "placement). Your final message must be only the JSON " +
                "object described there."
              )}]
            }')"
          # Retry ONLY transient failures: HTTP 502/503/504 (the platform is
          # mid-deploy or its edge lost the upstream) and a curl transport
          # failure (connection refused/reset, DNS, timeout). Any other
          # status, 4xx included, is a real answer and fails at once. One try
          # plus four retries, backing off 15s/30s/60s/90s (195s of waiting;
          # the job's 25-minute ceiling still bounds the worst case). A dispatch that
          # never succeeds exits non-zero, so the `findings` step is skipped
          # and `Publish code-review status` writes `failure` -- never
          # success, never `devteam/merge-eligible`.
          delays=(15 30 60 90)
          max_tries=5
          attempt=1
          empty_retries=0
          while :; do
            rc=0
            http_code="$(curl -sS --max-time 960 -o "$RUNNER_TEMP/dispatch_response.json" \
              -w '%{http_code}' \
              -X POST "${DISPATCH_URL%/}/v1/chat/completions" \
              -H "Authorization: Bearer $AW_CODEREVIEW_V1_KEY" \
              -H "Content-Type: application/json" \
              --data-binary "$payload")" || rc=$?
            # curl still prints %{http_code} when the transfer dies part-way
            # (exit 18, 56...), so a status that WAS received is classified
            # first: a 4xx is a real answer and must never be retried into a
            # later 200. Only a missing/000 status, a 502/503/504, or a 2xx
            # whose body was cut off count as transient.
            if [ "$rc" -ne 0 ]; then
              echo "dispatch attempt $attempt/$max_tries: curl exit $rc (HTTP ${http_code:-none})"
              case "$http_code" in
                4[0-9][0-9]) ;;
                502|503|504) ;;
                ''|000|2[0-9][0-9]) http_code=curl-failure ;;
                *) ;;
              esac
            else
              echo "dispatch attempt $attempt/$max_tries: HTTP $http_code"
              # A complete 2xx whose run SUCCEEDED but produced no final
              # message has nothing to judge; that is a flake of the run, not
              # a verdict. Re-dispatch it ONCE (each try is a full review, so
              # not up to max_tries); a second empty reply fails explicitly
              # here rather than as a JSON decoder error in the next step.
              # A failed run (`error` / non-success `aw_status`) is left to
              # the findings step, which rejects it -- never retried.
              case "$http_code" in
                2[0-9][0-9])
                  if jq -e '(has("error") | not)
                      and (if has("aw_status") then .aw_status == "success" else true end)
                      and ((.choices[0].message.content // "") | tostring | test("\\S") | not)' \
                      "$RUNNER_TEMP/dispatch_response.json" >/dev/null 2>&1; then
                    echo "::warning::the reviewer returned an empty message"
                    if [ "$empty_retries" -ge 1 ]; then
                      http_code=empty-reviewer-message
                      break
                    fi
                    empty_retries=$((empty_retries + 1))
                    http_code=empty-reviewer-message
                  elif jq -e '(.aw_status // "success") != "success"
                      and (((.choices[0].message.content // "") | fromjson? // {}) as $c
                           | [($c.error // empty), (($c.errors // {}) | .[]?)]
                             | map(tostring) as $e
                           | ($e | any(test("upstream unreachable|connection refused")))
                             and ($e | all(test("no activity for") | not)))' \
                      "$RUNNER_TEMP/dispatch_response.json" >/dev/null 2>&1; then
                    # The platform answers 200 + aw_status=error when the
                    # runner's own upstream is down (e.g. its core was
                    # restarting). That answers in seconds and is the same
                    # transient as a 502, so retry it on the same backoff. A
                    # "no activity for 600s" death is NOT matched: it has
                    # already burned ~10 min and a retry would breach the
                    # job's 25-minute ceiling.
                    echo "::warning::the runner upstream was unreachable"
                    http_code=runner-unreachable
                  fi ;;
              esac
            fi
            case "$http_code" in
              502|503|504|curl-failure|empty-reviewer-message|runner-unreachable) ;;
              *) break ;;
            esac
            if [ "$attempt" -ge "$max_tries" ]; then
              break
            fi
            delay="${delays[$((attempt - 1))]}"
            echo "::warning::transient dispatch failure ($http_code); retrying in ${delay}s"
            sleep "$delay"
            attempt=$((attempt + 1))
          done
          cat "$RUNNER_TEMP/dispatch_response.json" 2>/dev/null || true
          case "$http_code" in
            ''|*[!0-9]*)
              echo "::error::dispatch failed after $attempt attempt(s): $http_code"
              exit 1 ;;
          esac
          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            echo "::error::dispatch failed with HTTP $http_code after $attempt attempt(s)"
            exit 1
          fi

      # The judge never calls `gh` to post its own review: its session's `gh`
      # is the SAME shared personal credential every Dev Team agent
      # reads/writes the repo with, so a comment posted through it would
      # render as Frederico's own GitHub account. This step parses the
      # judge's returned JSON and posts every comment itself, under
      # `secrets.GITHUB_TOKEN` (renders as `github-actions[bot]`), with a
      # distinct banner.
      - name: Post findings and prepare the status description
        id: findings
        if: always() && steps.dispatch.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ needs.gate.outputs.pr_number }}
          HEAD_SHA: ${{ needs.gate.outputs.sha }}
          ROUND: ${{ needs.gate.outputs.round }}
          IS_DRAFT: ${{ needs.gate.outputs.is_draft }}
          BLOCK_SEVERITY: ${{ inputs.block_severity }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
          AGENT_SLUG: ${{ inputs.agent_slug }}
        run: |
          set -euo pipefail
          python3 <<'PYEOF'
          import json
          import os
          import re
          import subprocess
          import sys

          # RUNNER_TEMP, not a hardcoded /tmp path: a self-hosted runner
          # can process more than one job's /tmp at once (two PRs reviewed
          # around the same time, or this job racing the caller's test/deploy
          # runs on the same host) -- a bare /tmp/devteam_*.json name is
          # shared host state two concurrent jobs can clobber. RUNNER_TEMP is
          # unique per job even on a self-hosted runner.
          TMP = os.environ["RUNNER_TEMP"]

          def _reject(why, content=""):
              print(str(content)[:1500], file=sys.stderr)
              sys.exit(f"::error::invalid review verdict: {why}")

          def _no_duplicate_keys(pairs):
              # json.loads keeps the LAST of two equal keys, so
              # {"blocks_merge": true, "blocks_merge": false} would read as
              # false. Reject instead of letting the last one win.
              keys = [k for k, _ in pairs]
              dupes = sorted({k for k in keys if keys.count(k) > 1})
              if dupes:
                  raise ValueError(f"duplicate JSON key(s) {dupes}")
              return dict(pairs)

          raw = json.load(open(os.path.join(TMP, "dispatch_response.json")))
          # A 2xx is not proof the run SUCCEEDED: the /v1 door used to return a
          # failed run's text unchanged inside a 200. AP-MT adds a top-level
          # `aw_status` ("success" or the executor's non-success status). If
          # present it must be exactly "success"; an absent field is accepted
          # so this keeps working against a door that predates the field. Any
          # OpenAI-style top-level `error` object is a failure too.
          if "error" in raw:
              _reject("the response carries an error object", raw["error"])
          if "aw_status" in raw and raw["aw_status"] != "success":
              _reject(f"the run did not succeed (aw_status={raw['aw_status']!r})")
          content = raw["choices"][0]["message"]["content"]

          # Strip a markdown fence by matching the OPENING fence's own
          # backtick run against the CLOSING one, not a naive text[3:-3]
          # slice -- a fence can open with 4+ backticks. re.search, not
          # re.match: the judge routinely prefixes the fence with a sentence
          # of prose. With no fence, see the candidate scan below.
          # More than ONE fence is rejected outright: taking the first and
          # ignoring the rest let a clean fenced verdict hide a second one.
          #
          # The body must then be ONE COMPLETE JSON value that is a top-level
          # object. Never a naive first-`{` / last-`}` trim on its own: that
          # made `[{"findings":[],"counts":{}}]` (an array) or two
          # concatenated objects parse as an eligible empty verdict.
          body = content
          fences = list(re.finditer(r"(`{3,})[^\n]*\n(.*?)\n\1`*", content, re.S))
          if len(fences) > 1:
              _reject(f"{len(fences)} fenced blocks; expected exactly one verdict", content)
          if not content.strip():
              # Nothing to judge: the run "succeeded" without a final message.
              # The Dispatch step already re-dispatched once for this; say so
              # plainly instead of a JSON decoder's "line 1 column 1".
              _reject("the reviewer returned an empty message (re-run the review)")
          if fences:
              body = fences[0].group(2)
          else:
              # No fence: the /v1 door hands back the judge's whole turn, so
              # the verdict usually arrives after narration ("I'll use the
              # skill ... Both fixes passed ...\n\n{json}" -- PR #46's two
              # failing runs). Prose can carry braces of its own (`{key}`,
              # `config{}`), so a first-`{`..last-`}` slice is not enough.
              # Instead, scan for every COMPLETE JSON value starting at a `{`
              # or `[` and require exactly ONE: two objects (two verdicts, or
              # a verdict plus a stray `{"x": 1}`) stay rejected, as does an
              # array-wrapped verdict (it is the one candidate and is not an
              # object). Empty `{}` / `[]` and lists of scalars are prose,
              # never a verdict, so they don't count. Duplicate keys are
              # caught by the strict re-parse below, not by this scan.
              dec = json.JSONDecoder()
              cands, i = [], 0
              while (m := re.compile(r"[\[{]").search(content, i)):
                  try:
                      val, end = dec.raw_decode(content, m.start())
                  except ValueError:
                      i = m.start() + 1
                      continue
                  if (isinstance(val, dict) and val) or (
                          isinstance(val, list)
                          and any(isinstance(x, (dict, list)) for x in val)):
                      cands.append(content[m.start():end])
                  i = end
              if len(cands) > 1:
                  _reject(f"{len(cands)} JSON values in the message; expected exactly one verdict", content)
              if cands:
                  body = cands[0]

          try:
              data = json.loads(body.strip(), object_pairs_hook=_no_duplicate_keys)
          except ValueError as exc:
              _reject(f"not one complete JSON value ({exc})", content)
          if (not isinstance(data, dict)
                  or not isinstance(data.get("findings"), list)
                  or not isinstance(data.get("counts"), dict)):
              _reject("expected a top-level object with a findings array and a counts object", content)
          findings = data["findings"]
          counts = data["counts"]
          if not all(isinstance(f, dict) for f in findings):
              _reject("every finding must be an object")

          # `counts` must AGREE with `findings`: for every severity, the
          # count is a non-negative integer (not a bool) equal to the number
          # of findings of that severity. `{"findings": [], "counts":
          # {"high": 1}}` otherwise passed as an eligible round-1 verdict.
          tally = {}
          for f in findings:
              sev = str(f.get("severity", "info")).lower()
              tally[sev] = tally.get(sev, 0) + 1
          for k, v in counts.items():
              if k != k.strip().lower():
                  _reject(f"count key {k!r} is not a canonical lowercase severity")
              if isinstance(v, bool) or not isinstance(v, int) or v < 0:
                  _reject(f"count for {k!r} is not a non-negative integer")
          declared = {k: v for k, v in counts.items() if v}
          if declared != tally:
              _reject(f"counts {declared} contradict findings {tally}")

          repo = os.environ["REPO"]
          pr = os.environ["PR_NUMBER"]
          sha = os.environ["HEAD_SHA"]
          agent_slug = os.environ["AGENT_SLUG"]
          banner = (
              "\U0001F50E **Dev Team Code Review** — automated deep "
              f"review by `{agent_slug}`."
          )

          for f in findings:
              sev = str(f.get("severity", "info")).upper()
              conf = f.get("confidence", "possible")
              klass = f.get("class", "diff_local")
              text = f"{banner}\n\n**[{sev}/{conf}/{klass}]** {f.get('title', '')}\n\n{f.get('body', '')}"
              evidence = f.get("evidence")
              if evidence:
                  text += f"\n\n_Evidence: {evidence}_"

              path, line = f.get("file"), f.get("line")
              # `suggestion` is the raw replacement text for lines
              # line_start..line, nothing else -- only meaningful anchored to
              # a real hunk, so it's ignored on a cross-cutting finding (no
              # path/line). Wrapped in a ```suggestion fence, this renders as
              # GitHub's native one-click-applicable diff.
              suggestion = f.get("suggestion")
              if suggestion and path and line:
                  # Same reasoning as the judge-response fence match above:
                  # don't hardcode a 3-backtick fence -- if `suggestion`
                  # itself contains a ``` run, a fixed fence breaks. Open/close
                  # with one more backtick than the longest run found inside
                  # the text, floor 3.
                  longest_run = max((len(m) for m in re.findall(r"`+", suggestion)), default=0)
                  sugg_fence = "`" * max(longest_run + 1, 3)
                  text += f"\n\n{sugg_fence}suggestion\n{suggestion}\n{sugg_fence}"

              if path and line:
                  # Line-anchored finding -> inline review comment on that hunk.
                  cmd = [
                      "gh", "api", f"repos/{repo}/pulls/{pr}/comments",
                      "-f", f"body={text}", "-f", f"commit_id={sha}",
                      "-f", f"path={path}", "-F", f"line={int(line)}",
                      "-f", "side=RIGHT",
                  ]
                  line_start = f.get("line_start")
                  # GitHub's REST API requires start_line < line strictly --
                  # a reversed/equal range from the judge 422s. Drop to a
                  # single-line suggestion at `line` rather than send one.
                  if line_start and int(line_start) < int(line):
                      cmd += ["-F", f"start_line={int(line_start)}",
                              "-f", "start_side=RIGHT"]
              else:
                  # Cross-cutting finding -> a normal top-level PR comment,
                  # never force-fit onto a line it isn't really about.
                  cmd = ["gh", "api", f"repos/{repo}/issues/{pr}/comments",
                         "-f", f"body={text}"]

              result = subprocess.run(cmd, capture_output=True, text=True)
              if result.returncode != 0:
                  # An inline anchor 422s when that line isn't part of the
                  # diff (stale hunk, renamed file) -- fall back to a
                  # top-level comment rather than silently losing the finding.
                  print(f"::warning::inline comment failed, falling back to "
                        f"top-level: {result.stderr[:300]}")
                  fallback_text = text + f"\n\n_(anchored at {path}:{line} originally)_"
                  subprocess.run(
                      ["gh", "api", f"repos/{repo}/issues/{pr}/comments",
                       "-f", f"body={fallback_text}"],
                      check=True,
                  )

          parts = [f"{v} {k}" for k, v in counts.items() if v]
          desc = ("; ".join(parts) or "no findings")[:140]

          # ---- merge eligibility, and the digest the platform event carries ----
          #
          # Review 1 is the only review that can block: eligible iff no
          # finding is at or above `block_severity`.
          round_ = os.environ.get("ROUND", "1")

          def _digest(items):
              out = []
              for f in items:
                  out.append({"title": (f.get("title") or "")[:300],
                              "severity": f.get("severity"),
                              "file": f.get("file"),
                              "line": f.get("line"),
                              "blocks_merge": f.get("blocks_merge")})
              return out

          blocking = []

          if round_ == "1":
              # Review 1 blocks on `block_severity` and above.
              # FAIL CLOSED: a missing or unknown severity counts as blocking.
              order = ["info", "low", "medium", "high", "critical"]
              floor = os.environ.get("BLOCK_SEVERITY", "medium").strip().lower()
              floor_ix = order.index(floor) if floor in order else order.index("medium")
              def _blocks(f):
                  sev = str(f.get("severity") or "").strip().lower()
                  return sev not in order or order.index(sev) >= floor_ix
              blocking = [f for f in findings if _blocks(f)]
              eligible = not blocking
          else:
              # informational (/aw-improve suggestion runs): never eligible,
              # by definition — it is not a review round at all.
              eligible = False

          # A DRAFT PR is never merge-eligible, whatever the review said.
          if eligible and os.environ.get("IS_DRAFT", "").lower() == "true":
              eligible = False
              print("::notice::PR is a DRAFT — review complete, merge withheld. "
                    "Mark it ready for review to re-run round 1 and merge.")

          with open(os.path.join(TMP, "devteam_findings.json"), "w") as fh:
              json.dump(_digest(findings), fh)
          with open(os.path.join(TMP, "devteam_blocking.json"), "w") as fh:
              json.dump(_digest(blocking), fh)
          with open(os.path.join(TMP, "devteam_counts.json"), "w") as fh:
              json.dump(counts, fh)

          with open(os.environ["GITHUB_OUTPUT"], "a") as gh_out:
              gh_out.write(f"desc={desc}\n")
              gh_out.write(f"findings_count={len(findings)}\n")
              gh_out.write(f"blocking_count={len(blocking)}\n")
              gh_out.write(f"eligible={'true' if eligible else 'false'}\n")
          print(f"round={round_} findings={len(findings)} blocking={len(blocking)} "
                f"eligible={eligible}")

          # ---- publish eligibility AS A COMMIT STATUS ON THIS SHA ----
          #
          # This is the hand-off to `merge-attempt`, and the whole reason the
          # merge no longer needs a poll: the verdict is now durable, pinned
          # to a SHA, and readable by a job in a LATER workflow run that
          # shares no state with this one.
          #
          # WRITTEN ONLY WHEN ELIGIBLE, never as a `failure`/`pending`
          # counterpart. Three reasons, all load-bearing:
          #   - `merge-attempt` treats "no success status on this SHA" as
          #     "not cleared". An old clearance only applies if its attempt
          #     URL matches the latest successful devteam/code-review.
          #   - this context must never look like a failing check on a PR
          #     that is simply mid-fix-cycle, which is the normal state of
          #     every round-1 PR with findings.
          #   - it must not become a blocking check if anyone ever turns on
          #     branch protection — it is in the gate's own ADVISORY set for
          #     the same reason.
          #
          # A new push gets a new SHA with no status, so eligibility can
          # never be inherited by an unreviewed head. That property is the
          # reason this is a status and not a label.
          if eligible:
              subprocess.run(
                  ["gh", "api", "-X", "POST", f"repos/{repo}/statuses/{sha}",
                   "-f", "state=success",
                   "-f", "context=devteam/merge-eligible",
                   "-f", f"description=round {round_}: cleared to merge once CI is green",
                   "-f", f"target_url={os.environ.get('RUN_URL', '')}",
                   "--silent"],
                  check=True,
              )
              print(f"devteam/merge-eligible -> success on {sha[:7]}")
          PYEOF

      # always(), same reason as the gate's own publish step: a status left on
      # `pending` forever is indistinguishable from a queue backlog. A job
      # killed by `timeout-minutes` above still reaches this step.
      - name: Publish code-review status
        id: publish
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISPATCH_OUTCOME: ${{ steps.dispatch.outcome }}
          FINDINGS_OUTCOME: ${{ steps.findings.outcome }}
          DESC: ${{ steps.findings.outputs.desc }}
          ROUND: ${{ needs.gate.outputs.round }}
          MODE: ${{ needs.gate.outputs.mode }}
        run: |
          set -euo pipefail
          if [ "$DISPATCH_OUTCOME" = "success" ] && [ "$FINDINGS_OUTCOME" = "success" ]; then
            state=success
            # Reuse stamp (see the gate): 140 is GitHub's description cap.
            stamp=" [rk r=${ROUND} m=${MODE}]"
            description="$(printf '%s' "${DESC:-review complete}" | cut -c1-$((140 - ${#stamp})))$stamp"
          elif [ "$DISPATCH_OUTCOME" = "cancelled" ] || [ "$FINDINGS_OUTCOME" = "cancelled" ]; then
            state=error
            description="code review cancelled"
          else
            state=failure
            description="code review failed or timed out - see run log"
          fi
          # An informational run (/aw-review or /aw-improve on a reviewed head) is
          # advisory: it must NOT replace the attempt URL on `devteam/code-review`,
          # which `merge-attempt` matches against `devteam/merge-eligible`.
          context=devteam/code-review
          [ "${ROUND:-}" = informational ] && context=devteam/code-review-advisory
          gh api -X POST "repos/${{ github.repository }}/statuses/${{ needs.gate.outputs.sha }}" \
            -f state="$state" \
            -f context="$context" \
            -f description="$description" \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}" \
            --silent
          echo "$context -> $state ($description)"

      # ---- a review that produced NO verdict is not a paid review ----
      # `findings` succeeds only for a parsed, accepted verdict. Anything else
      # (dispatch failed, the platform answered 200 + aw_status=error such as
      # "400 temperature unsupported", an invalid verdict) spent nothing the
      # budget should remember: the gate charged `review-count:N` up front, so
      # this adds `review-refund:N` (one more bot `labeled` event; the gate
      # counts charged - refunded). Consecutive errors stay bounded by the
      # gate's `max_errored_reviews`. A completed review adds `review-ok`,
      # which resets that streak. Neither step may fail the job.
      - name: Refund the review budget on an errored review, or reset the error streak
        id: refund
        if: always() && needs.gate.outputs.allowed == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FINDINGS_OUTCOME: ${{ steps.findings.outcome }}
          CHARGED: ${{ needs.gate.outputs.charged }}
          SLOT: ${{ needs.gate.outputs.slot }}
          CHARGE: ${{ needs.gate.outputs.charge }}
          PR_NUMBER: ${{ needs.gate.outputs.pr_number }}
        run: |
          set -uo pipefail
          label_api="repos/${{ github.repository }}/issues/$PR_NUMBER/labels"
          if [ "$FINDINGS_OUTCOME" = "success" ]; then
            gh api -X DELETE "$label_api/review-ok" --silent 2>/dev/null || true
            gh api -X POST "$label_api" -f "labels[]=review-ok" --silent \
              || echo "::warning::could not stamp review-ok; the error streak was not reset"
            echo "review produced a verdict — error streak reset"
            exit 0
          fi
          echo "errored=true" >> "$GITHUB_OUTPUT"
          # One error event per workflow RUN, charged or not: it is what the gate's
          # consecutive-error bound counts, so it works with max_reviews=0 and for a
          # dispatch that never charged (missing key). It also makes the refund
          # idempotent: "Re-run failed jobs" reuses the gate's `charged`/`slot`
          # outputs, so a second failure of the same run must not refund again.
          # Keyed to the gate's charge id (run id + attempt), so every full rerun
          # advances the streak; a failed-jobs rerun reuses it and stays one event.
          attempt_id="${CHARGE:-${{ github.run_id }}-${{ github.run_attempt }}}"
          err_label="review-error:$attempt_id"
          read_ok=true
          seen=""
          if ! seen="$(gh api --paginate "repos/${{ github.repository }}/issues/$PR_NUMBER/timeline?per_page=100" \
                        --jq '.[] | select(.event=="labeled" and .actor.login=="github-actions[bot]") | .label.name')"; then
            read_ok=false
            echo "::warning::could not read the PR timeline; recording the error but not refunding"
          fi
          # The error marker and the refund are two independent writes: a replay
          # (rerun, or a transient failure of either write) completes whichever
          # one is missing, each exactly once.
          if [ "$read_ok" = true ] && printf '%s\n' "$seen" | grep -qxF "$err_label"; then
            echo "this run's error is already recorded — not recording again"
          else
            # DELETE first: re-adding a present label emits no `labeled` event.
            gh api -X DELETE "$label_api/review-error%3A$attempt_id" --silent 2>/dev/null || true
            if ! gh api -X POST "$label_api" -f "labels[]=$err_label" --silent; then
              # No marker means "refund not done" to a replay, so do not refund
              # now: a refund without its marker could be repeated.
              echo "::warning::could not stamp $err_label; the error streak was not advanced and no refund was made"
              exit 0
            fi
          fi
          if [ "$read_ok" != true ]; then
            exit 0
          fi
          if [ "$CHARGED" != "true" ] || [ -z "${SLOT:-}" ]; then
            echo "no budget unit was charged for this attempt — nothing to refund"
            exit 0
          fi
          # Slot numbers are reused (the next charge after a refund takes the
          # refunded number), so a bare `review-refund:$SLOT` cannot be
          # attributed to one charged run: another run may refund the same slot
          # in between. The refund label therefore carries the run id
          # (`review-refund:<slot>:<run id>-<attempt>`, the gate's `charge` output); the gate counts it like the
          # legacy `review-refund:<slot>`.
          refund_label="review-refund:$SLOT:${CHARGE:-${{ github.run_id }}}"
          if printf '%s\n' "$seen" | grep -qxF "$refund_label"; then
            echo "budget unit $SLOT is already refunded for this run — not refunding again"
            exit 0
          fi
          gh api -X DELETE "$label_api/review-refund%3A$SLOT%3A${CHARGE:-${{ github.run_id }}}" --silent 2>/dev/null || true
          if gh api -X POST "$label_api" -f "labels[]=$refund_label" --silent; then
            echo "review produced no verdict — refunded budget unit $SLOT ($refund_label)"
          else
            echo "::warning::could not stamp $refund_label; this errored attempt still counts"
          fi

      # An errored review leaves the PR with no review coming. Tell a human on
      # the PR (once per head) and wake the opener coder through the
      # platform's existing `devteam-pr-nudge` door, as a `review_error`
      # trigger (the red-check wake's sibling: once per head, same wake cap,
      # active-chain and pending-question gates, all decided by the
      # platform). A `/aw-improve` run is advisory and never wakes anyone.
      # MUST NEVER FAIL A PR: continue-on-error, best effort.
      - name: Tell the PR and wake the opener coder on an errored review
        id: review_error
        if: always() && needs.gate.outputs.allowed == 'true' && steps.refund.outputs.errored == 'true' && needs.gate.outputs.round != 'informational'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AW_DEVTEAM_EVENT_SECRET: ${{ secrets.AW_DEVTEAM_EVENT_SECRET }}
          EVENT_URL: ${{ inputs.event_url }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ needs.gate.outputs.pr_number }}
          HEAD_SHA: ${{ needs.gate.outputs.sha }}
          DISPATCH_OUTCOME: ${{ steps.dispatch.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
        run: |
          python3 <<'PYEOF'
          import hashlib, hmac, json, os, subprocess, sys, time

          REPO, PR, SHA = os.environ["REPO"], os.environ["PR_NUMBER"], os.environ["HEAD_SHA"]
          RUN_URL = os.environ["RUN_URL"]
          TMP = os.environ.get("RUNNER_TEMP", "/tmp")

          def warn(msg):
              print(f"::warning::review-error-wake: {msg}")

          def gh(*args):
              try:
                  return subprocess.run(["gh", *args], capture_output=True, text=True, timeout=60)
              except subprocess.TimeoutExpired:
                  return None

          def error_text():
              """What the reviewer run said went wrong, bounded. Untrusted text."""
              try:
                  raw = json.load(open(os.path.join(TMP, "dispatch_response.json")))
              except (OSError, ValueError):
                  return f"the review dispatch failed (step outcome: {os.environ.get('DISPATCH_OUTCOME') or 'unknown'}); see the run log"
              if not isinstance(raw, dict):
                  return "the review dispatch returned an unreadable response"
              parts = []
              if raw.get("aw_status") not in (None, "success"):
                  parts.append(f"aw_status={raw['aw_status']}")
              if raw.get("error"):
                  parts.append(json.dumps(raw["error"])[:600])
              try:
                  content = raw["choices"][0]["message"]["content"]
                  if content:
                      parts.append(str(content)[:900])
              except (KeyError, IndexError, TypeError):
                  pass
              return " | ".join(parts) or "the reviewer returned no verdict (no error text); see the run log"

          def main():
              text = error_text()
              marker = f"<!-- review-error:{SHA} -->"
              # Once per head on the PR: a retry on the same head must not stack comments.
              r = gh("api", f"repos/{REPO}/issues/{PR}/comments", "--paginate", "--jq", ".[].body")
              seen = r is not None and r.returncode == 0 and marker in r.stdout
              if not seen:
                  body = (f"{marker}\n**The automatic review of `{SHA[:7]}` errored and produced no verdict.** "
                          f"It does not count toward the review budget. [Run log]({RUN_URL})\n\n"
                          f"```\n{text.replace('```', '~~~')[:1200]}\n```\n"
                          "A push or `/aw-review` triggers a new attempt; "
                          "repeated errors stop automatic review and ask a human.")
                  c = gh("api", "-X", "POST", f"repos/{REPO}/issues/{PR}/comments", "-f", f"body={body}", "--silent")
                  if c is None or c.returncode != 0:
                      warn("could not post the PR comment")
              else:
                  print("this head already carries the review-error comment")

              secret = os.environ.get("AW_DEVTEAM_EVENT_SECRET", "")
              if not secret:
                  warn("AW_DEVTEAM_EVENT_SECRET is not set; coder not woken")
                  return
              lr = gh("api", f"repos/{REPO}/issues/{PR}/labels", "--paginate", "--jq", ".[].name")
              if lr is None or lr.returncode != 0:
                  warn("could not read the PR's labels; coder not woken")
                  return
              labels = [x for x in lr.stdout.split("\n") if x]
              run_label = next((x for x in labels if x.startswith("aw-run:")), "")
              if not run_label and not any(x.startswith("aw-card:") for x in labels):
                  print("skip wake: not an agent PR (no aw-run:/aw-card: label), opener unknown")
                  return
              vr = gh("pr", "view", PR, "--repo", REPO, "--json",
                      "state,mergeable,mergeStateStatus,isDraft,statusCheckRollup,headRefOid,url")
              try:
                  view = json.loads(vr.stdout) if vr is not None and vr.returncode == 0 else None
              except ValueError:
                  view = None
              if view is None:
                  warn("could not read the PR; coder not woken")
                  return
              if view.get("state") != "OPEN" or view.get("headRefOid") != SHA:
                  print("skip wake: PR is not open or its head moved since this review")
                  return
              payload = {
                  "v": 1,
                  "trigger": {"kind": "review_error", "actor": "github-actions",
                              "actor_type": "Bot", "label": ""},
                  "repo": REPO, "pr_number": int(PR),
                  "pr_url": view.get("url") or f"https://github.com/{REPO}/pull/{PR}",
                  "head_sha": SHA, "labels": labels,
                  "run_id": run_label[len("aw-run:"):],
                  "view": view, "needs_human_actor": None, "dry_run": False,
                  "review_error": {"text": text, "run_url": RUN_URL},
              }
              raw = json.dumps(payload).encode()
              event_path = os.path.join(TMP, "devteam_review_error.json")
              response_path = os.path.join(TMP, "devteam_review_error_response.json")
              with open(event_path, "wb") as fh:
                  fh.write(raw)
              sig = hmac.new(secret.encode(), raw, hashlib.sha256).hexdigest()
              url = os.environ["EVENT_URL"].rstrip("/") + "/api/github/devteam-pr-nudge"
              code = ""
              for attempt in (1, 2, 3):
                  try:
                      if os.path.exists(response_path):
                          os.remove(response_path)
                      code = subprocess.run([
                          "curl", "-sS", "--max-time", "60", "-o", response_path,
                          "-w", "%{http_code}", "-X", "POST", url,
                          "-H", "Content-Type: application/json",
                          "-H", f"X-Hub-Signature-256: sha256={sig}",
                          "--data-binary", f"@{event_path}",
                      ], capture_output=True, text=True, check=True).stdout.strip()
                  except (subprocess.CalledProcessError, OSError) as exc:
                      code = ""
                      print(f"attempt {attempt}: transport error: {exc}")
                  if code and not code.startswith("5"):
                      break
                  if attempt < 3:
                      time.sleep(attempt * 3 * float(os.environ.get("NUDGE_SLEEP_SCALE", "1")))
              try:
                  body = open(response_path).read()
              except OSError:
                  body = ""
              print(f"review_error -> HTTP {code or 'none'}: {body[:600]}")
              if not code.startswith("2"):
                  warn(f"platform answered HTTP {code or 'none'}; coder not woken")

          try:
              main()
          except Exception as exc:  # never fail a PR
              warn(f"unexpected error: {exc!r}")
          sys.exit(0)
          PYEOF

      # ---- the round memory's write to the PR ----
      # Writes `devteam:reviewed` once review 1 COMPLETED (any verdict) and its
      # status was actually published: the bypass gate clears a later head by
      # reading that status, so a label without it would let a replay of the
      # same SHA skip a blocked review. Nothing else is written: no
      # awaiting-fixes / needs-human. The label POST auto-creates a missing
      # label.
      - name: Set round labels
        id: labels
        # always(): the round state must not be lost because an EARLIER step
        # (the status publish, which is itself always()) hiccuped. The real
        # guard is findings.outcome — without a parsed review there is nothing
        # to label.
        if: >-
          always() && steps.findings.outcome == 'success' &&
          needs.gate.outputs.round == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ROUND: ${{ needs.gate.outputs.round }}
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
        run: |
          set -euo pipefail
          add_label() {
            gh api -X POST \
              "repos/${{ github.repository }}/issues/${{ needs.gate.outputs.pr_number }}/labels" \
              -f "labels[]=$1" --silent
            echo "labelled: $1"
          }
          if [ "${PUBLISH_OUTCOME:-success}" = "success" ]; then
            add_label "devteam:reviewed"
          else
            echo "::warning::round-1 status publish ${PUBLISH_OUTCOME}; not writing devteam:reviewed so the next run reviews again"
          fi

      # ---- tell the platform what this round decided ----
      # LAST, and after the findings are already on the PR: the woken coder
      # must never arrive at a PR with nothing on it. `findings` wakes the
      # coder that opened the PR (resolved server-side from its run_id);
      # `escalate` does not wake anyone and moves the Kanban card to
      # need_human with a sysadmin Telegram ping. `cleared` (v1.5.0) also
      # wakes no one — it exists purely so an eligible round leaves a durable
      # row behind (the close-gate design, card
      # merge-gate-close-loop-backlog-cards): the `merged-event` job looks
      # this row up by head_sha when the PR actually closes, to file Backlog
      # cards for whatever non-blocking leftovers the merged head carried.
      #
      # The endpoint is idempotent on (repo, pr_number, head_sha, round,
      # event), so a re-run of this job is safe. This step is best-effort by
      # design (`continue-on-error`): a platform hiccup must not redden a PR
      # whose review and merge both went fine.
      - name: Report round outcome to the platform
        id: event
        if: >-
          always() && steps.findings.outcome == 'success' &&
          needs.gate.outputs.round == '1'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AW_DEVTEAM_EVENT_SECRET: ${{ secrets.AW_DEVTEAM_EVENT_SECRET }}
          EVENT_URL: ${{ inputs.event_url }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ needs.gate.outputs.pr_number }}
          HEAD_SHA: ${{ needs.gate.outputs.sha }}
          ROUND: ${{ needs.gate.outputs.round }}
          BLOCKING_COUNT: ${{ steps.findings.outputs.blocking_count }}
          ELIGIBLE: ${{ steps.findings.outputs.eligible }}
          PR_URL: ${{ github.server_url }}/${{ github.repository }}/pull/${{ needs.gate.outputs.pr_number }}
        run: |
          set -euo pipefail
          if [ -z "${AW_DEVTEAM_EVENT_SECRET:-}" ]; then
            echo "::warning::AW_DEVTEAM_EVENT_SECRET is not set — the coder cannot be woken."
            exit 0
          fi
          # Review 1 is the only round and only a BLOCKING finding wakes the
          # coder (`findings`); anything else is `cleared` (carrying the
          # LOW/INFO digest: stored, no wake).
          if [ "${BLOCKING_COUNT:-0}" -gt 0 ]; then
            event=findings
          else
            event=cleared
          fi
          python3 - "$event" <<'PYEOF'
          import hashlib, hmac, json, os, subprocess, sys

          # See the "Post findings" step's own comment: RUNNER_TEMP, not a
          # bare /tmp name, is what keeps two concurrent jobs on a
          # self-hosted runner from clobbering each other's findings files.
          TMP = os.environ["RUNNER_TEMP"]

          event = sys.argv[1]
          base = os.environ["EVENT_URL"].rstrip("/")
          def _pr_labels():
              """Live PR label names, best effort: the platform links a PR to
              its coder run from the aw-run:<id> label, so GitHub is only
              asked here, by the workflow's own token."""
              try:
                  r = subprocess.run(
                      ["gh", "api", f"repos/{os.environ['REPO']}/issues/{os.environ['PR_NUMBER']}/labels",
                       "--paginate", "--jq", ".[].name"], capture_output=True, text=True, timeout=30)
                  return [x for x in r.stdout.splitlines() if x] if r.returncode == 0 else []
              except Exception:
                  return []

          # Bounded retry on an unresolved link: `provenance-gate` is ordered
          # before this job, but a label write can still lag. 4 reads, 10s
          # apart (<= 30s). A PR that never gets an aw-run label (human PR)
          # pays that 30s once and then proceeds with an empty run_id, as before.
          import time
          for _attempt in range(4):
              _labels = _pr_labels()
              # Only `findings` resolves a coder link; `cleared` is stored as-is.
              if event != "findings" or any(x.startswith("aw-run:") for x in _labels):
                  break
              if _attempt < 3:
                  print(f"aw-run label absent (read {_attempt + 1}/4); retrying in 10s")
                  time.sleep(10)
          _run_label = next((x for x in _labels if x.startswith("aw-run:")), "")
          payload = {
              "labels": _labels,
              "run_id": _run_label[len("aw-run:"):],
              "v": 1,
              "event": event,
              "repo": os.environ["REPO"],
              "pr_number": int(os.environ["PR_NUMBER"]),
              "pr_url": os.environ["PR_URL"],
              "head_sha": os.environ["HEAD_SHA"],
              "round": os.environ["ROUND"],
              "counts": json.load(open(os.path.join(TMP, "devteam_counts.json"))),
              "findings": json.load(open(os.path.join(TMP, "devteam_findings.json"))),
              "blocking": json.load(open(os.path.join(TMP, "devteam_blocking.json"))),
              "missing_blocks_merge": 0,
              # There is no nudge job: the platform must wake directly.
              "nudge_follows": False,
          }
          event_path = os.path.join(TMP, "devteam_event.json")
          response_path = os.path.join(TMP, "devteam_event_response.json")

          import time
          def _unresolved(code, body):
              """True when AP-MT accepted the call but could not link the PR to a coder run."""
              if not str(code).startswith("2"):
                  return False
              try:
                  d = json.loads(body)
              except Exception:
                  return False
              return (isinstance(d, dict) and d.get("acted") is False
                      and (d.get("reason") == "no PR->coder link for this URL"
                           or "unresolved" in json.dumps(d.get("link_resolution", "")).lower()))

          def _post(raw_bytes):
              with open(event_path, "wb") as fh:
                  fh.write(raw_bytes)
              sig = hmac.new(os.environ["AW_DEVTEAM_EVENT_SECRET"].encode(),
                             raw_bytes, hashlib.sha256).hexdigest()
              code = subprocess.run([
                  "curl", "-sS", "--max-time", "60", "-o", response_path,
                  "-w", "%{http_code}",
                  "-X", "POST",
                  f"{base}/api/github/devteam-review-event",
                  "-H", "Content-Type: application/json",
                  "-H", f"X-Hub-Signature-256: sha256={sig}",
                  "--data-binary", f"@{event_path}",
              ], capture_output=True, text=True, check=True).stdout.strip()
              return code, open(response_path).read()

          # Sign the EXACT bytes that get posted (see _post). Up to 2 retries,
          # 5s apart, only on acted:false + unresolved link, labels re-read.
          for _try in range(3):
              code, body = _post(json.dumps(payload).encode())
              print(f"{event} -> HTTP {code}: {body[:800]}")
              if _try < 2 and _unresolved(code, body):
                  print(f"link unresolved; re-reading labels and retrying ({_try + 1}/2)")
                  time.sleep(5)
                  _labels = _pr_labels()
                  _run_label = next((x for x in _labels if x.startswith("aw-run:")), "")
                  payload["labels"] = _labels
                  payload["run_id"] = _run_label[len("aw-run:"):]
                  continue
              break
          if not code.startswith("2"):
              print(f"::warning::devteam-review-event {event} returned HTTP {code}")
              sys.exit(1)
          PYEOF

      # LAST step of the job, after the statuses, the round
      # label and the event are all written. The job goes red; the
      # `devteam/code-review` STATUS stays a success ("a verdict exists"), so
      # the gate's reuse check never re-dispatches a paid review on this sha.
      - name: Fail the job on a blocking review 1
        if: >-
          always() &&
          needs.gate.outputs.round == '1' &&
          steps.findings.outcome == 'success' &&
          steps.findings.outputs.blocking_count != '0'
        run: |
          echo "::error::review 1 found ${{ steps.findings.outputs.blocking_count }} finding(s) at or above '${{ inputs.block_severity }}'. Fix them and push: the next push merges on green CI without a second deep review."
          exit 1

  # ---------------------------------------------------------------------------
  # PROVENANCE: every Dev Team PR must carry which agent run created it,
  # enforced at a layer no coder can forget or skip (Architect design on
  # Kanban card 40f5bf3b-9510-8174-be1c-c69bdc2676ba). A `prepare-commit-msg`
  # hook stamps an `AW-Run-Id` trailer on every commit a runner container
  # makes (separate card, agents-platform-runners repo); this job is the
  # unskippable half. It fails the PR unless at least one commit actually
  # carries one, and on success records the ids durably on the PR itself —
  # a multi-commit squash-merge can drop commit bodies depending on repo
  # settings, so the merge commit message is NOT relied on.
  #
  # Gated like `code-review` is — `needs.gate.outputs.allowed == 'true'` —
  # same precondition: a fork PR or an untrusted author never reaches
  # either job.
  #
  # Modelled on `devteam/merge-eligible`, not on raw check-run pass/fail:
  # this job's own name is in `merge-attempt`'s ADVISORY set below (like
  # every other job this file defines), so a transient failure here doesn't
  # get re-litigated through the generic "any non-advisory check failing
  # blocks" scan that exists for the CALLER's own CI. The actual gate is the
  # explicit `devteam/provenance` commit status, written ONLY on success and
  # read LIVE by `merge-attempt` — durable across workflow runs, which a
  # `needs.<job>.outputs` read is not (entry point (b) below shares no job
  # graph with the run that set it).
  # ---------------------------------------------------------------------------
  provenance-gate:
    needs: gate
    if: needs.gate.outputs.allowed == 'true' || needs.gate.outputs.bypass == 'true'
    runs-on: ${{ fromJSON(inputs.runs_on) }}
    timeout-minutes: 10
    steps:
      - name: Check for a stamped AW-Run-Id trailer and record it on the PR
        id: provenance
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ needs.gate.outputs.pr_number }}
          HEAD_SHA: ${{ needs.gate.outputs.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 <<'PYEOF'
          import json, os, re, subprocess, sys

          REPO = os.environ["REPO"]
          PR_NUMBER = os.environ["PR_NUMBER"]
          SHA = os.environ["HEAD_SHA"]

          def api(path, *, paginate=False):
              cmd = ["gh", "api", path]
              if paginate:
                  cmd.append("--paginate")
              out = subprocess.run(cmd, capture_output=True, text=True, timeout=60)
              if out.returncode != 0:
                  print(f"::error::gh api {path} failed: {out.stderr[:300]}")
                  sys.exit(1)
              if not paginate:
                  return json.loads(out.stdout or "null")
              # `gh api --paginate` prints one JSON array per page, back to
              # back (`[..][..]`) — decode them one by one and concatenate.
              dec, text, i, merged = json.JSONDecoder(), out.stdout, 0, []
              while True:
                  while i < len(text) and text[i].isspace():
                      i += 1
                  if i >= len(text):
                      return merged
                  page, i = dec.raw_decode(text, i)
                  merged.extend(page if isinstance(page, list) else [page])

          def publish_cleared(description):
              subprocess.run(
                  ["gh", "api", "-X", "POST", f"repos/{REPO}/statuses/{SHA}",
                   "-f", "state=success",
                   "-f", "context=devteam/provenance",
                   "-f", f"description={description}",
                   "-f", f"target_url={os.environ.get('RUN_URL', '')}",
                   "--silent"],
                  check=True,
              )
              print(f"devteam/provenance -> success on {SHA[:7]} ({description})")

          # ---- the escape hatch, checked FIRST ----
          # Every PR in this rollout shares the `fredericowu` author identity
          # (agent and human both push as the same GitHub user), so an
          # author allowlist cannot tell a human PR from an agent one — a
          # label a human applies by hand is the only exemption that cannot
          # be spoofed by the thing it is meant to catch. Agent contracts
          # forbid applying this label themselves; the threat model here is
          # omission (a coder that forgot/lost the hook), not an adversarial
          # agent faking its way past review.
          labels = api(f"repos/{REPO}/issues/{PR_NUMBER}/labels", paginate=True)
          if any(l.get("name") == "provenance-exempt" for l in (labels or [])):
              publish_cleared("provenance-exempt label applied by a human")
              sys.exit(0)

          # ---- zero commits: nothing to check, and nothing to merge either ----
          # A draft/empty PR has no commit to carry a trailer yet. Failing it
          # here would just be a red check on a PR that was never mergeable
          # from this state anyway (the draft guard in merge-attempt already
          # withholds it) — `devteam/provenance` is simply never published,
          # the same "absence is the negative, not an error" shape as
          # `devteam/merge-eligible`.
          commits = api(f"repos/{REPO}/pulls/{PR_NUMBER}/commits", paginate=True)
          if not commits:
              print(f"PR #{PR_NUMBER} has zero commits — nothing to check")
              sys.exit(0)

          TRAILER_RE = re.compile(r"^AW-Run-Id:\s*([0-9a-f]{32})\s*$", re.MULTILINE)
          SESSION_RE = re.compile(r"^AW-Session-Id:\s*(\S+)\s*$", re.MULTILINE)
          CARD_RE = re.compile(r"^AW-Card:\s*(\S+)\s*$", re.MULTILINE)
          AGENT_RE = re.compile(r"^AW-Agent-Slug:\s*([A-Za-z0-9._-]+)\s*$", re.MULTILINE)
          # Enrichment only: dashed or bare UUID, normalised to 32 hex.
          PARENT_RE = re.compile(
              r"^AW-Parent-Run-Id:\s*([0-9a-fA-F]{8}-?[0-9a-fA-F]{4}-?[0-9a-fA-F]{4}-?[0-9a-fA-F]{4}-?[0-9a-fA-F]{12})\s*$",
              re.MULTILINE)

          def first_match(regex, message):
              m = regex.search(message)
              return m.group(1) if m else None

          # Newest commit first: the provenance footer should reflect this
          # PR's most recent work, so a later push's trailer wins over an
          # earlier one even if both happen to carry one.
          found = None
          for commit in reversed(commits):
              message = (commit.get("commit") or {}).get("message") or ""
              run_id = first_match(TRAILER_RE, message)
              if run_id:
                  found = {
                      "run_id": run_id,
                      "session_id": first_match(SESSION_RE, message) or "",
                      "card_id": first_match(CARD_RE, message) or "",
                      "agent_slug": first_match(AGENT_RE, message) or "",
                      "parent_run_id": (first_match(PARENT_RE, message) or "").replace("-", "").lower(),
                      "commit_sha": commit.get("sha", "")[:7],
                  }
                  break

          if found is None:
              print(f"::warning::no commit on PR #{PR_NUMBER} carries a well-formed "
                    f"AW-Run-Id trailer ({len(commits)} commit(s) checked). Skipping "
                    f"provenance metadata without blocking.")
              publish_cleared("no AW-Run-Id trailer found (warning)")
              sys.exit(0)

          print(f"provenance OK: AW-Run-Id {found['run_id']} on {found['commit_sha']} "
                f"(session={found['session_id'] or '-'} card={found['card_id'] or '-'})")
          with open(os.environ["GITHUB_OUTPUT"], "a") as gh_out:
              for k, v in found.items():
                  gh_out.write(f"{k}={v}\n")
          publish_cleared(f"AW-Run-Id {found['run_id'][:12]}… verified")
          PYEOF

      - name: Record the provenance footer on the PR body
        if: steps.provenance.outputs.run_id != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ needs.gate.outputs.pr_number }}
          RUN_ID: ${{ steps.provenance.outputs.run_id }}
          SESSION_ID: ${{ steps.provenance.outputs.session_id }}
          CARD_ID: ${{ steps.provenance.outputs.card_id }}
          AGENT_SLUG: ${{ steps.provenance.outputs.agent_slug }}
          PARENT_RUN_ID: ${{ steps.provenance.outputs.parent_run_id }}
        run: |
          set -euo pipefail
          python3 <<'PYEOF'
          import json, os, re, subprocess, sys

          REPO = os.environ["REPO"]
          PR_NUMBER = os.environ["PR_NUMBER"]
          # Markers, not a fixed byte range: idempotent on every round (round
          # 1, round 2, a later /aw-review) rather than appending a new
          # footer each time. This is the durable record a squash-merge can
          # drop the commit body of — see the header note on this job.
          START = "<!-- devteam:provenance:start -->"
          END = "<!-- devteam:provenance:end -->"

          lines = [f"**Run:** `{os.environ['RUN_ID']}`"]
          if os.environ.get("SESSION_ID"):
              lines.append(f"**Session:** `{os.environ['SESSION_ID']}`")
          if os.environ.get("CARD_ID"):
              lines.append(f"**Card:** `{os.environ['CARD_ID']}`")
          if os.environ.get("AGENT_SLUG"):
              lines.append(f"**Agent:** `{os.environ['AGENT_SLUG']}`")
          if os.environ.get("PARENT_RUN_ID"):
              lines.append(f"**Parent run:** `{os.environ['PARENT_RUN_ID']}`")
          footer = (
              f"{START}\n---\n\U0001F9FE **Provenance** — this PR carries the "
              f"agent run that created it, stamped by a `prepare-commit-msg` "
              f"hook (survives a squash-merge that drops commit bodies).\n\n"
              + "\n".join(lines) + f"\n{END}"
          )

          def gh(*args):
              out = subprocess.run(["gh", *args], capture_output=True, text=True, timeout=60)
              if out.returncode != 0:
                  print(f"::error::gh {' '.join(args)} failed: {out.stderr[:300]}")
                  sys.exit(1)
              return out.stdout

          # ---- PR body: idempotent replace between markers ----
          pr = json.loads(gh("api", f"repos/{REPO}/pulls/{PR_NUMBER}"))
          body = pr.get("body") or ""
          if START in body and END in body:
              body = re.sub(re.escape(START) + r".*?" + re.escape(END), footer,
                             body, flags=re.S)
          else:
              body = body.rstrip() + "\n\n" + footer
          gh("api", "-X", "PATCH", f"repos/{REPO}/pulls/{PR_NUMBER}", "-f", f"body={body}")
          print("provenance footer recorded on the PR body")
          PYEOF

      # ---- enrichment, not a gate: apply the resolved ids as PR labels ----
      # Pure trailer-to-label mapping, no network dependency beyond GitHub's
      # own API — agent_slug is self-stamped by the same hook as run_id/
      # card_id (agents-platform-runners' prepare-commit-msg), so there is no
      # AP-MT lookup here (that shape was designed and explicitly superseded —
      # see Architect card 4165bf3b-9510-8138-b764-ea10a9f79e9c). `needs:
      # [gate, code-review, provenance-gate]` on `merge-attempt` below means a
      # red step here would block real merges over pure enrichment, so this
      # step is structured to never surface a non-zero exit: every failure
      # mode (missing trailer, a GitHub API hiccup, a label that already
      # exists) becomes a `::warning::` and the script always finishes with
      # `sys.exit(0)`. `continue-on-error` is additional belt-and-braces for
      # a failure mode even that can't anticipate (e.g. python3 itself
      # missing on the runner image).
      - name: Apply provenance labels
        # `!cancelled()`: a failed footer PATCH above must not skip the labels
        # the review's findings event depends on.
        if: ${{ !cancelled() && steps.provenance.outputs.run_id != '' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ needs.gate.outputs.pr_number }}
          RUN_ID: ${{ steps.provenance.outputs.run_id }}
          CARD_ID: ${{ steps.provenance.outputs.card_id }}
          AGENT_SLUG: ${{ steps.provenance.outputs.agent_slug }}
        run: |
          python3 <<'PYEOF'
          import json, os, re, subprocess, sys, urllib.parse

          def main():
              REPO = os.environ["REPO"]
              PR_NUMBER = os.environ["PR_NUMBER"]

              # Data-driven: {label prefix: (value, color, description)}. A
              # future `aw-plan` entry is one line here, not a redesign.
              # The trailer carries the run id as 32 bare hex chars, but AP-MT
              # looks runs up in the dashed 8-4-4-4-12 form, so a bare label
              # resolves to "run not found". Normalise exactly-32-hex values;
              # leave already-dashed and non-hex values untouched.
              run_id = os.environ.get("RUN_ID", "")
              if re.fullmatch(r"[0-9a-fA-F]{32}", run_id):
                  run_id = (f"{run_id[:8]}-{run_id[8:12]}-{run_id[12:16]}-"
                            f"{run_id[16:20]}-{run_id[20:]}")

              LABELS = {
                  "aw-run": (run_id, "0e8a16",
                             "Dev Team provenance: the agent run that created this PR"),
                  "aw-card": (os.environ.get("CARD_ID", "").replace("-", ""), "1d76db",
                              "Dev Team provenance: the Kanban card this PR implements"),
                  "aw-agent": (os.environ.get("AGENT_SLUG", ""), "5319e7",
                               "Dev Team provenance: the agent slug that created this PR"),
              }

              def gh(*args):
                  return subprocess.run(["gh", *args], capture_output=True, text=True, timeout=30)

              existing = gh("api", f"repos/{REPO}/issues/{PR_NUMBER}/labels", "--paginate")
              existing_names = []
              if existing.returncode == 0:
                  try:
                      existing_names = [l.get("name", "") for l in json.loads(existing.stdout or "[]")]
                  except json.JSONDecodeError:
                      print(f"::warning::could not parse existing PR labels: {existing.stdout[:200]}")
              else:
                  print(f"::warning::could not list PR #{PR_NUMBER} labels: {existing.stderr[:200]}")

              for prefix, (value, color, description) in LABELS.items():
                  if not value:
                      continue
                  label_name = f"{prefix}:{value}"
                  if len(label_name) > 50:
                      print(f"::warning::skipping {prefix} label — {label_name!r} exceeds "
                            f"GitHub's 50-char label-name limit")
                      continue

                  stale_names = [n for n in existing_names
                                 if n.startswith(f"{prefix}:") and n != label_name]

                  def drop_stale():
                      # Replace-by-prefix: drop any stale same-prefix label whose
                      # value changed (the colon needs URL-encoding in the path).
                      # Only ever called once the replacement is confirmed on the
                      # PR, so a failed add never leaves the PR with neither.
                      for stale in stale_names:
                          encoded = urllib.parse.quote(stale, safe="")
                          d = gh("api", "-X", "DELETE",
                                 f"repos/{REPO}/issues/{PR_NUMBER}/labels/{encoded}")
                          if d.returncode != 0:
                              print(f"::warning::could not remove stale label {stale!r}: "
                                    f"{d.stderr[:200]}")

                  if label_name in existing_names:
                      drop_stale()
                      continue  # already applied, only stale ones to clear

                  # Ensure the label exists on the repo — create-on-demand,
                  # treating "already exists" (422) as success.
                  create = gh("api", "-X", "POST", f"repos/{REPO}/labels",
                               "-f", f"name={label_name}", "-f", f"color={color}",
                               "-f", f"description={description}")
                  if create.returncode != 0 and "already_exists" not in create.stderr:
                      print(f"::warning::could not ensure label {label_name!r} exists on "
                            f"{REPO}: {create.stderr[:200]}")

                  add = gh("api", f"repos/{REPO}/issues/{PR_NUMBER}/labels",
                            "-f", f"labels[]={label_name}")
                  if add.returncode != 0:
                      print(f"::warning::could not apply label {label_name!r} to PR "
                            f"#{PR_NUMBER}: {add.stderr[:200]}")
                  else:
                      print(f"applied label {label_name!r}")
                      drop_stale()

          try:
              main()
          except Exception as e:
              print(f"::warning::provenance label step failed unexpectedly: {e!r}")
          sys.exit(0)
          PYEOF

  # ---------------------------------------------------------------------------
  # THE MERGE. One script, two entry points, no polling.
  #
  #   (a) same run — `needs: [gate, code-review]`, taken when the review just
  #       computed eligible=true. The common case: CI was already green
  #       before the verdict landed, so this merges immediately.
  #   (b) `workflow_run` — the caller forwards a `completed` event from its
  #       OWN CI workflow, and this job runs with no gate and no review in
  #       front of it. This is the case the 20-minute poll existed for, and
  #       the reason it can be deleted: the real event arrives whenever CI
  #       actually finishes, at 3 minutes or at 3 hours.
  #
  # `always()` is REQUIRED, not defensive. On entry point (b) BOTH `needs`
  # are skipped (the gate's own `if` admits only pull_request/issue_comment),
  # and a job whose needs were skipped is itself skipped unless the condition
  # is `always()`/`!cancelled()`. The explicit event test then carries the
  # whole decision — which is why it is written out rather than relying on
  # the needs' outcome.
  #
  # `needs.code-review.outputs.eligible` on the same-run arm is an
  # optimisation, not the authority: it decides whether this job is worth a
  # runner. The script reads the latest review and clearance statuses on
  # the PR's current head before merging.
  # ---------------------------------------------------------------------------
  merge-attempt:
    # `provenance-gate` added so entry point (a) WAITS for it to post its own
    # check-run before the live `gh pr checks` read below — without this, a
    # same-run merge attempt can race it and see its own job as "pending",
    # which is the identical self-referential trap `merge-attempt`'s own name
    # is in ADVISORY to avoid (see that set's comment). It does not change
    # whether a provenance failure BLOCKS the merge — that is the explicit
    # `devteam/provenance` status read below, for the same reason
    # `devteam/merge-eligible` is a status and not a `needs` check: entry
    # point (b) shares no job graph with the run that set it.
    needs: [gate, code-review, provenance-gate]
    if: >-
      always() &&
      (
        github.event_name == 'workflow_run' ||
        needs.code-review.outputs.eligible == 'true' ||
        needs.gate.outputs.bypass == 'true'
      )
    runs-on: ${{ fromJSON(inputs.runs_on) }}
    outputs:
      # The PR this job resolved (empty when none); on workflow_run the gate
      # is skipped and has no PR number.
      pr_number: ${{ steps.merge.outputs.pr_number }}
    # Nothing here waits on anything: a handful of bounded API reads and one
    # merge call. 10 is already generous; if this job is running long it is
    # stuck, not busy.
    timeout-minutes: 10
    steps:
      - name: Attempt the merge
        id: merge
        env:
          # Every READ uses GITHUB_TOKEN. The merge itself does NOT — see the
          # MERGE_TOKEN note in the script.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MERGE_TOKEN: ${{ secrets.AW_DEVTEAM_MERGE_TOKEN }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          CI_CHECK_NAME: ${{ inputs.ci_check_name }}
          # Entry point (a). Empty on a workflow_run run, where both needs
          # are skipped.
          PR_NUMBER: ${{ needs.gate.outputs.pr_number }}
          HEAD_SHA: ${{ needs.gate.outputs.sha }}
          # Entry point (b).
          WORKFLOW_RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          WORKFLOW_RUN_NAME: ${{ github.event.workflow_run.name }}
          WORKFLOW_RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          set -euo pipefail
          python3 <<'PYEOF'
          import json, os, subprocess, sys, time

          REPO = os.environ["REPO"]
          EVENT_NAME = os.environ["EVENT_NAME"]

          # The findings step writes eligibility only for cleared heads.
          # The finalizer records the outcome of every review attempt.
          ELIGIBLE_CONTEXT = "devteam/merge-eligible"
          REVIEW_CONTEXT = "devteam/code-review"

          # Same shape, written by `provenance-gate` only when a commit on
          # this SHA carries a well-formed `AW-Run-Id` trailer (or a human
          # applied `provenance-exempt`). Read live rather than through
          # `needs.provenance-gate` for the same reason eligibility is: entry
          # point (b) below shares no job graph with the run that set it.
          PROVENANCE_CONTEXT = "devteam/provenance"

          # Pinned BY NAME to the caller's own CI job, via the required
          # `ci_check_name` input (`coverage` on aw-app-template, `pytest` on
          # AP-MT, `unit` on aw-workspace core, `Validate compose config` on
          # aw-stack). Present AND passing is required — "absent" must not
          # read as "fine", or deleting the CI job would silently re-open
          # this merge window.
          REQUIRED = {c for c in [os.environ["CI_CHECK_NAME"].strip()] if c}

          # Our own review surfaces are advisory by standing rule and must
          # not gate the merge. Names are listed even for repos that don't
          # have the corresponding workflow — an absent check name simply
          # never appears in `gh pr checks` output, so it costs nothing.
          #
          # `devteam/merge-eligible` is in here for the same reason
          # `devteam/code-review` is: it is this loop's own surface, it is
          # advisory by standing rule, and it must never be something the
          # merge waits on.
          #
          # `merge-attempt` is THIS JOB. It is `pending` while this very code
          # runs, so without the entry the single read below would always see
          # a pending check and this job would decline to merge, every time,
          # forever. The old polling gate had the identical hazard with
          # `code-review`; this is the same trap one job over.
          #
          # `CodeRabbit` is the literal check name the CodeRabbit GitHub App
          # publishes (verified against tekflox/aw-app-template PRs #13-15).
          # It is a THIRD-PARTY SaaS reviewer and advisory by the same
          # standing rule as our own — and it must be here, not merely
          # harmless: it sits `pending` for as long as CodeRabbit is
          # reviewing, which without this entry would stall every merge on
          # such a repo. Only aw-app-template has it installed today; the
          # other callers pay nothing for the entry.
          # `devteam/provenance` / `provenance-gate` are here for the exact
          # same reason `devteam/merge-eligible` / `code-review` are: this
          # file's own jobs never gate the merge through their raw
          # check-run pass/fail, only through an explicit status it writes
          # on success. See `PROVENANCE_CONTEXT` below.
          ADVISORY = {"devteam/ai-review", "devteam/code-review",
                      "devteam/merge-eligible", "devteam/provenance",
                      "devteam/review-cap", "devteam/code-review-advisory",
                      "ai-review", "code-review", "merge-eligible",
                      "provenance-gate", "gate", "fork-notice",
                      "merged-event", "merge-attempt", "CodeRabbit",
                      "nudge", "devteam-nudge"}

          # As a REUSABLE workflow, this file's jobs are reported to `gh pr
          # checks` as "<caller job id> / <job id>" — e.g. "review /
          # code-review". A flat exact-name match would not recognise any of
          # them. So each row is matched on its full name AND on the segment
          # after the last "/", and the caller's job name is irrelevant
          # either way.
          def tail(name):
              return (name or "").rsplit("/", 1)[-1].strip()

          def is_advisory(name):
              return name in ADVISORY or tail(name) in ADVISORY

          def neutral(msg):
              """There is nothing to merge, and that is not a failure.

              Entry point (b) fires on EVERY completion of the caller's CI
              workflow, on every branch — most of which have no open PR, no
              eligibility status, or CI still running elsewhere. Those must
              exit 0: a red run on an unrelated branch's CI completion is
              noise that trains people to ignore this workflow, and the
              signal that a merge did not happen is the PR still being open.
              """
              print(f"::notice::{msg}")
              sys.exit(0)

          def api(path):
              """`gh api <path>` -> parsed JSON, or None on an unreadable call.

              Bounded, for the same reason the merge gate's `gh pr checks`
              call is: an unbounded `gh` that hangs blocks the step while
              printing nothing at all, which is invisible until the job
              timeout kills it (AP-MT PR #6 sat in exactly that state for
              17m53s). A bounded call turns a hang into a readable failure.
              """
              try:
                  out = subprocess.run(["gh", "api", path],
                                       capture_output=True, text=True, timeout=60)
              except subprocess.TimeoutExpired:
                  print(f"::warning::gh api {path} did not return within 60s")
                  return None
              if out.returncode != 0:
                  print(f"::warning::gh api {path} failed: {out.stderr[:300]}")
                  return None
              try:
                  return json.loads(out.stdout or "null")
              except json.JSONDecodeError:
                  print(f"::warning::could not parse gh api {path}: {out.stdout[:200]}")
                  return None

          # ---- 1. which PR is this event about ----
          if EVENT_NAME == "workflow_run":
              event_sha = os.environ.get("WORKFLOW_RUN_HEAD_SHA") or ""
              print(f"workflow_run: {os.environ.get('WORKFLOW_RUN_NAME')} "
                    f"-> {os.environ.get('WORKFLOW_RUN_CONCLUSION')} on {event_sha[:7]}")
              if not event_sha:
                  neutral("workflow_run event carried no head_sha")
              # `commits/{sha}/pulls`, NOT `github.event.workflow_run
              # .pull_requests[]`. That array is documented as populated only
              # when the head and base are in the SAME repository, and in
              # practice it comes back empty for exactly the runs we care
              # about. Resolving the PR from the SHA is one extra API call
              # and is simply correct.
              pulls = api(f"repos/{REPO}/commits/{event_sha}/pulls")
              if pulls is None:
                  print(f"::error::could not resolve a PR from {event_sha}")
                  sys.exit(1)
              open_pulls = [p for p in pulls if p.get("state") == "open"]
              if not open_pulls:
                  neutral(f"no open PR has {event_sha[:7]} as its head — "
                          f"nothing to merge (a push to the default branch, or an "
                          f"already-merged PR, lands here and is expected)")
              pr_number = open_pulls[0]["number"]
          else:
              pr_number = os.environ.get("PR_NUMBER") or ""
              event_sha = os.environ.get("HEAD_SHA") or ""
              if not pr_number or not event_sha:
                  print("::error::same-run entry point reached with no PR number "
                        "or head SHA from the gate")
                  sys.exit(1)

          if os.environ.get("GITHUB_OUTPUT"):
              with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
                  fh.write(f"pr_number={pr_number}\n")

          # ---- 2. is this PR still a thing we may merge, RIGHT NOW ----
          # Every one of these is re-read live rather than taken from the
          # event payload or from the gate's snapshot. On entry point (b) the
          # payload is about a CI run, not a PR, and on entry point (a) the
          # snapshot can be 20 minutes old — the author can close, draft or
          # push to the PR during the review, and those are precisely the
          # moments they most mean "do not merge this".
          pr = api(f"repos/{REPO}/pulls/{pr_number}")
          if pr is None:
              print(f"::error::could not read PR #{pr_number}; refusing to merge")
              sys.exit(1)

          if pr.get("merged"):
              print(f"#{pr_number} is already merged — nothing to do")
              sys.exit(0)
          if pr.get("state") != "open":
              neutral(f"#{pr_number} is {pr.get('state')} — not merging")

          # Fork guard, on BOTH entry points. The gate has its own for the
          # review; this one is independent because entry point (b) never
          # passes through the gate at all, and a `workflow_run` run executes
          # with the caller's full secrets regardless of where the PR came
          # from.
          head_repo = ((pr.get("head") or {}).get("repo") or {}).get("full_name")
          if head_repo != REPO:
              neutral(f"#{pr_number}'s head is {head_repo or 'a deleted fork'}, "
                      f"not {REPO} — declining to merge a fork PR")

          if pr.get("draft"):
              neutral(f"#{pr_number} is a draft — not merging. Mark it ready for "
                      f"review to re-run round 1.")

          live_sha = ((pr.get("head") or {}).get("sha")) or ""
          if live_sha != event_sha:
              # NEW IN v1.3.0, and it closes a race the polling version had
              # wide open: the old gate merged "the PR", not "the SHA the
              # review passed". A push landing between the verdict and the
              # merge therefore shipped an unreviewed head under a review
              # that never saw it.
              neutral(f"#{pr_number}'s head moved to {live_sha[:7]} since "
                      f"{event_sha[:7]} was cleared — not merging. The new head "
                      f"gets its own review.")

          # ---- 3. eligibility, read live from the commit status ----
          combined = api(f"repos/{REPO}/commits/{live_sha}/status")
          if combined is None:
              print(f"::error::could not read commit statuses on {live_sha[:7]}; "
                    f"refusing to merge")
              sys.exit(1)
          statuses = combined.get("statuses") or []
          eligibility = next((s for s in statuses if s.get("context") == ELIGIBLE_CONTEXT), {})
          if eligibility.get("state") != "success":
              neutral(f"{ELIGIBLE_CONTEXT} is not success on {live_sha[:7]} — the "
                      f"review has not cleared this head for merge")

          # The same SHA can be reviewed more than once. The latest review
          # attempt must have finished successfully and issued this clearance.
          review = next((s for s in statuses if s.get("context") == REVIEW_CONTEXT), {})
          attempt_url = review.get("target_url")
          if (review.get("state") != "success" or not attempt_url
                  or attempt_url != eligibility.get("target_url")):
              neutral(f"the latest code review attempt has not cleared {live_sha[:7]} for merge")

          provenance_cleared = any(s.get("context") == PROVENANCE_CONTEXT
                                    and s.get("state") == "success"
                                    for s in statuses)
          if not provenance_cleared:
              neutral(f"{PROVENANCE_CONTEXT} is not success on {live_sha[:7]} — no "
                      f"commit on this PR carries a verified AW-Run-Id trailer (or "
                      f"the provenance-exempt label) — not merging")

          # ---- 4. the caller's own CI: ONE bounded read, no loop ----
          def checks():
              # `timeout=` is not optional. Without it a hung `gh` blocks
              # this step forever, printing NOTHING. AP-MT PR #6's round 2
              # sat in exactly this call for 17m53s and emitted not one line
              # between `##[endgroup]` and `The operation was canceled`. A
              # bounded call turns that into a retryable failed read, which
              # the `rows is None` branch already knows how to handle.
              try:
                  out = subprocess.run(
                      ["gh", "pr", "checks", str(pr_number), "--repo", REPO,
                       "--json", "name,state,bucket"],
                      capture_output=True, text=True, timeout=60)
              except subprocess.TimeoutExpired:
                  print("::warning::gh pr checks did not return within 60s; "
                        "treating as a failed read and retrying")
                  return None
              # `gh pr checks` exits non-zero when anything is failing or
              # pending, so returncode is not an error signal here — only
              # unparseable output is. But empty stdout WITH stderr content
              # is a real command failure (bad flag, auth, transient API
              # error) — `out.stdout or "[]"` used to treat that identically
              # to "found zero checks", which silently turned a real error
              # into "required check did not pass" on AP-MT PR #7 (confirmed
              # live: 4 straight /aw-review retries, same instant empty
              # result, even ~40 min after pytest had actually gone green).
              #
              # The underlying cause there was a MISSING `checks: read` on
              # the caller's token: `gh pr checks` reads check-runs through
              # the Checks API, and on a PRIVATE repo that read is refused
              # without it — deterministically, not flakily. `actions: read`
              # is a second, separate scope the same call needs (AP-MT PR
              # #9). A public repo's rollup is readable without either, which
              # is why the same code merged fine on the public
              # aw-app-template and failed every single round on the private
              # AP-MT. See the caller checklist at the bottom of this file:
              # both scopes are REQUIRED, on both sides.
              stdout = out.stdout.strip()
              if not stdout:
                  if out.stderr.strip():
                      print(f"::warning::gh pr checks produced no output; stderr: "
                            f"{out.stderr[:300]}")
                      return None
                  return []
              try:
                  return json.loads(stdout)
              except json.JSONDecodeError:
                  print(f"::warning::could not parse gh pr checks output: "
                        f"{out.stdout[:200]} {out.stderr[:200]}")
                  return None

          # Retries cover a FAILED READ (a transient API error, a hung call)
          # — never "CI is still running". Waiting out a pending check is
          # what the 20-minute loop did and what this release exists to
          # delete: a pending check means the CI-completion event has not
          # arrived yet, and that event is the retry.
          rows = None
          for attempt in (1, 2, 3):
              rows = checks()
              if rows is not None:
                  break
              print(f"checks read attempt {attempt} failed")
              if attempt < 3:
                  time.sleep(attempt * 5)
          if rows is None:
              print(f"::error::could not read #{pr_number}'s checks after 3 "
                    f"attempts; refusing to merge")
              sys.exit(1)

          relevant = [r for r in rows if not is_advisory(r.get("name"))]
          pending = [r for r in relevant if r.get("bucket") == "pending"]
          failed = [r for r in relevant if r.get("bucket") in ("fail", "cancel")]
          # Both forms, so `ci_check_name` can name a plain job (`unit`) or,
          # in a caller whose CI is itself reusable, the tail of a
          # "parent / child" name.
          passed = set()
          for r in relevant:
              if r.get("bucket") == "pass":
                  passed.add(r["name"])
                  passed.add(tail(r["name"]))

          if failed:
              # exit 0, deliberately. CI being red is already reported by
              # CI — reddening this job too would just put a second failing
              # check on the PR saying the same thing, and on entry point (b)
              # it would do so on every single failed CI run in the repo. The
              # merge simply does not happen; a later green re-run fires its
              # own workflow_run and this job re-attempts.
              neutral("not merging — CI is not green on this head SHA: "
                      + ", ".join(f"{r['name']}={r.get('state')}" for r in failed))
          if pending:
              neutral("not merging yet — still running: "
                      + ", ".join(r["name"] for r in pending)
                      + ". The CI-completion event will re-attempt this.")

          missing = REQUIRED - passed
          if missing:
              # A warning rather than an error, and still no merge. "Absent"
              # must never read as "fine" — that rule is why `ci_check_name`
              # is required-and-passing rather than not-failing — but the
              # common way to get here is benign (CI has not started on this
              # SHA yet, so nothing is pending AND nothing has passed), and
              # failing the job for it would redden PRs for a race. The
              # genuinely broken case — a CI job that was renamed or deleted
              # — surfaces as a PR that stays open with this warning on it,
              # and `/aw-review` is the recovery path.
              print(f"::warning::not merging — required check(s) {sorted(missing)} "
                    f"have not reported a pass on {live_sha[:7]}. Saw: "
                    f"{sorted((r['name'], r.get('bucket')) for r in relevant)}")
              sys.exit(0)

          print("CI is green: " + ", ".join(sorted(passed)))

          # ---- 5. merge ----
          # `AW_DEVTEAM_MERGE_TOKEN`, a PAT with contents:write +
          # pull-requests:write on the caller repo. NOT `GITHUB_TOKEN`:
          # pushes created by GITHUB_TOKEN do not trigger downstream
          # workflows, so a GITHUB_TOKEN-authored merge push would land and
          # every `on: push` / `on: workflow_run` workflow in the caller repo
          # would silently never fire — a release cut, a deploy, an image
          # build, going dark with a green PR to point at.
          #
          # Plain `gh pr merge --squash`, no `--auto`: `--auto` only pauses
          # for checks that BRANCH PROTECTION marks required, and none of
          # these repos has branch protection (direct push to master is kept
          # deliberately as the break-glass path — if a bad merge breaks this
          # very loop, the fix must not depend on the loop it would be
          # fixing). Everything above is therefore not belt-and-suspenders:
          # it is the ONLY gate between a red test suite and a squash-merge.
          merge_token = os.environ.get("MERGE_TOKEN") or ""
          if not merge_token:
              print("::error::AW_DEVTEAM_MERGE_TOKEN is not set on this repository "
                    "(or the caller did not pass it BY NAME — `secrets: inherit` "
                    "does not cross an account boundary). Refusing to fall back to "
                    "GITHUB_TOKEN: its merge push would not trigger this repo's own "
                    "push-/workflow_run-triggered workflows, so the deploy or "
                    "release that normally follows a merge would silently stop "
                    "happening.")
              sys.exit(1)

          out = subprocess.run(
              ["gh", "pr", "merge", str(pr_number), "--repo", REPO,
               "--squash", "--delete-branch"],
              capture_output=True, text=True, timeout=180,
              env={**os.environ, "GH_TOKEN": merge_token})
          if out.returncode == 0:
              print(f"squash-merged #{pr_number} ({live_sha[:7]}) via "
                    f"AW_DEVTEAM_MERGE_TOKEN")
              sys.exit(0)

          # ALREADY MERGED IS A SUCCESS. Both entry points can fire for the
          # same head SHA — a CI run completing at the same moment the review
          # posts its verdict reaches this code twice — and whichever loses
          # that race must not redden a PR that merged perfectly well.
          after = api(f"repos/{REPO}/pulls/{pr_number}")
          if "merge already in progress" in (out.stderr or "").lower():
              # Benign race (both entry points fired): re-read; merged or
              # merging is success, the other attempt owns the merge.
              print(f"#{pr_number}: merge already in progress (other entry point) - treating as success")
              sys.exit(0)
          if after and after.get("merged"):
              print(f"#{pr_number} was already merged (the other entry point, or "
                    f"a human, got there first) — treating as success")
              sys.exit(0)
          print(f"::error::gh pr merge failed: {out.stderr[:500]}")
          sys.exit(1)
          PYEOF

      # -----------------------------------------------------------------------
      # A red required check on an agent PR wakes the coder that opened it.
      #
      # Without this a PR whose review PASSED but whose CI went red sat idle:
      # `merge-attempt` correctly declines to merge ("CI is not green") and
      # exits neutral, and nothing tells the author (AP-MT PR #187: eslint
      # `lint` red, no one woken). This step is a SEPARATE step on purpose:
      # it reads no merge state, changes no merge decision, posts no review
      # event and never `/aw-review`s. It only reports "CI went red on this
      # head" to the platform's existing `devteam-pr-nudge` door as a
      # `ci_done` trigger, plus the failing check name(s), job URL and a log
      # tail. The platform's decide()/ledger own the rest: once per head SHA,
      # the shared per-head wake cap, the active-chain and pending-question
      # gates. Unknown coder (no aw-run:/aw-card: label) = nothing is sent.
      #
      # Reach: only workflow_run completions the caller already forwards to
      # this workflow (its `on: workflow_run: workflows:` list). A required
      # check in a workflow the caller does not list is not seen here.
      #
      # MUST NEVER FAIL A PR: `continue-on-error`, every path exits 0.
      # NEVER CHECKS OUT OR EXECUTES PR CONTENT; fork PRs are skipped.
      # -----------------------------------------------------------------------
      - name: Wake the opener coder on a red check
        if: >-
          always() &&
          github.event_name == 'workflow_run' &&
          (github.event.workflow_run.conclusion == 'failure' ||
           github.event.workflow_run.conclusion == 'timed_out')
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AW_DEVTEAM_EVENT_SECRET: ${{ secrets.AW_DEVTEAM_EVENT_SECRET }}
          REPO: ${{ github.repository }}
          EVENT_URL: ${{ inputs.event_url }}
          WORKFLOW_RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          WORKFLOW_RUN_NAME: ${{ github.event.workflow_run.name }}
        run: |
          python3 <<'PYEOF'
          import hashlib, hmac, json, os, re, subprocess, sys, time

          REPO = os.environ["REPO"]
          SHA = os.environ.get("WORKFLOW_RUN_HEAD_SHA", "")
          LOG_LINES, LOG_CHARS = 60, 3000

          # This loop's own surfaces never count as "the coder's CI is red".
          ADVISORY = {"devteam/ai-review", "devteam/code-review",
                      "devteam/merge-eligible", "devteam/provenance",
                      "devteam/review-cap", "devteam/code-review-advisory",
                      "ai-review", "code-review", "merge-eligible",
                      "provenance-gate", "gate", "fork-notice",
                      "merged-event", "merge-attempt", "CodeRabbit",
                      "nudge", "devteam-nudge"}

          def tail(name):
              return (name or "").rsplit("/", 1)[-1].strip()

          def is_advisory(name):
              return name in ADVISORY or tail(name) in ADVISORY

          def warn(msg):
              print(f"::warning::ci-red-nudge: {msg}")

          def gh(*args, timeout=60):
              try:
                  return subprocess.run(["gh", *args], capture_output=True, text=True,
                                        timeout=timeout)
              except subprocess.TimeoutExpired:
                  return None

          def gh_json(*args):
              r = gh(*args)
              if r is None or r.returncode != 0:
                  return None
              try:
                  return json.loads(r.stdout or "null")
              except ValueError:
                  return None

          def main():
              if not SHA:
                  print("skip: workflow_run carried no head_sha")
                  return
              pulls = gh_json("api", f"repos/{REPO}/commits/{SHA}/pulls")
              mine = [p for p in (pulls or [])
                      if p.get("state") == "open"
                      and (p.get("head") or {}).get("sha") == SHA
                      and ((p.get("head") or {}).get("repo") or {}).get("full_name") == REPO]
              if not mine:
                  print(f"skip: no open same-repo PR has {SHA[:7]} as its head")
                  return
              pr = str(mine[0]["number"])

              r = gh("api", f"repos/{REPO}/issues/{pr}/labels", "--paginate", "--jq", ".[].name")
              if r is None or r.returncode != 0:
                  warn(f"could not read PR #{pr}'s labels; no nudge sent")
                  return
              labels = [x for x in r.stdout.split("\n") if x]
              run_label = next((x for x in labels if x.startswith("aw-run:")), "")
              if not run_label and not any(x.startswith("aw-card:") for x in labels):
                  print("skip: not an agent PR (no aw-run:/aw-card: label), opener unknown")
                  return

              # `gh pr checks` exits non-zero (8) when any check is failing,
              # which is exactly the case here: the exit code is not an error
              # signal, only unparseable/empty stdout is.
              cr = gh("pr", "checks", pr, "--repo", REPO, "--json", "name,state,bucket,link")
              try:
                  rows = json.loads(cr.stdout) if cr is not None and cr.stdout.strip() else None
              except ValueError:
                  rows = None
              if rows is None:
                  warn(f"could not read PR #{pr}'s checks; no nudge sent")
                  return
              failed = [c for c in rows
                        if c.get("bucket") == "fail" and not is_advisory(c.get("name"))]
              if not failed:
                  print("skip: no non-advisory check is failing on this head")
                  return

              log_tail = ""
              m = re.search(r"/job/(\d+)", failed[0].get("link") or "")
              if m:
                  lr = gh("run", "view", "--job", m.group(1), "--repo", REPO, "--log-failed",
                          timeout=90)
                  if lr is not None and lr.returncode == 0:
                      text = re.sub(r"\x1b\[[0-9;]*[A-Za-z]", "", lr.stdout)
                      log_tail = "\n".join(text.splitlines()[-LOG_LINES:])[-LOG_CHARS:]

              view = gh_json("pr", "view", pr, "--repo", REPO, "--json",
                             "state,mergeable,mergeStateStatus,isDraft,statusCheckRollup,"
                             "headRefOid,url")
              if view is None:
                  warn(f"could not read PR #{pr}; no nudge sent")
                  return
              if view.get("state") != "OPEN" or view.get("headRefOid") != SHA:
                  print("skip: PR is not open or its head moved since this CI run")
                  return

              secret = os.environ.get("AW_DEVTEAM_EVENT_SECRET", "")
              if not secret:
                  warn("AW_DEVTEAM_EVENT_SECRET is not set; no nudge sent")
                  return

              payload = {
                  "v": 1,
                  "trigger": {"kind": "ci_done", "actor": "github-actions",
                              "actor_type": "Bot", "label": ""},
                  "repo": REPO,
                  "pr_number": int(pr),
                  "pr_url": view.get("url") or f"https://github.com/{REPO}/pull/{pr}",
                  "head_sha": SHA,
                  "labels": labels,
                  "run_id": run_label[len("aw-run:"):],
                  "view": view,
                  "needs_human_actor": None,
                  "dry_run": False,
                  "ci_failure": {
                      "checks": [{"name": c.get("name") or "", "url": c.get("link") or ""}
                                 for c in failed[:5]],
                      "log_tail": log_tail,
                  },
              }
              # Sign the exact bytes that are posted; the secret never hits argv.
              tmp = os.environ.get("RUNNER_TEMP", "/tmp")
              raw = json.dumps(payload).encode()
              event_path = os.path.join(tmp, "devteam_ci_red.json")
              response_path = os.path.join(tmp, "devteam_ci_red_response.json")
              with open(event_path, "wb") as fh:
                  fh.write(raw)
              sig = hmac.new(secret.encode(), raw, hashlib.sha256).hexdigest()
              url = os.environ["EVENT_URL"].rstrip("/") + "/api/github/devteam-pr-nudge"
              code = ""
              for attempt in (1, 2, 3):
                  try:
                      if os.path.exists(response_path):
                          os.remove(response_path)
                      code = subprocess.run([
                          "curl", "-sS", "--max-time", "60", "-o", response_path,
                          "-w", "%{http_code}", "-X", "POST", url,
                          "-H", "Content-Type: application/json",
                          "-H", f"X-Hub-Signature-256: sha256={sig}",
                          "--data-binary", f"@{event_path}",
                      ], capture_output=True, text=True, check=True).stdout.strip()
                  except (subprocess.CalledProcessError, OSError) as exc:
                      code = ""
                      print(f"attempt {attempt}: transport error: {exc}")
                  if code and not code.startswith("5"):
                      break
                  if attempt < 3:
                      time.sleep(attempt * 3 * float(os.environ.get("NUDGE_SLEEP_SCALE", "1")))
              try:
                  body = open(response_path).read()
              except OSError:
                  body = ""
              print(f"ci_done -> HTTP {code or 'none'}: {body[:600]}")
              if not code.startswith("2"):
                  warn(f"platform answered HTTP {code or 'none'}; coder not woken")

          try:
              main()
          except Exception as exc:  # never fail a PR
              warn(f"unexpected error: {exc!r}")
          sys.exit(0)
          PYEOF

  # ---------------------------------------------------------------------------
  # The merged half of the loop, on the real close event.
  #
  # Keying this off `pull_request: closed` + `merged == true` covers a human
  # merging the PR by hand too, which is the case that leaves a shared tree
  # stale.
  #
  # No gate, no dispatch, no reviewer: this job only reports. It runs under the
  # same fork check as the gate, so a closed fork PR cannot reach it.
  #
  # Callers must include `closed` in their `pull_request` types for this to
  # fire at all; the gate job above excludes `closed` explicitly so a close
  # never dispatches a review.
  # ---------------------------------------------------------------------------
  merged-event:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ fromJSON(inputs.runs_on) }}
    steps:
      - name: Report the merge to the platform
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AW_DEVTEAM_EVENT_SECRET: ${{ secrets.AW_DEVTEAM_EVENT_SECRET }}
          EVENT_URL: ${{ inputs.event_url }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          # The squash commit, not the PR head: it is what landed on master,
          # and it makes this delivery's idempotency key unique per merge.
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          # The review happens against the HEAD sha, never the merge commit —
          # a review-digest row keyed on merge_commit_sha can therefore never
          # be found by the server's leftover lookup. Added alongside the old
          # field rather than replacing it, since existing callers may still
          # read `head_sha`.
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          if [ -z "${AW_DEVTEAM_EVENT_SECRET:-}" ]; then
            echo "::warning::AW_DEVTEAM_EVENT_SECRET is not set — the coder will not be \
            woken to sync the shared tree."
            exit 0
          fi
          # Which round we finished on, for the record only — read live, same
          # reason as the gate. Does NOT `exit 1` on a failed fetch (unlike
          # the gate's): guessing there only fills in a human-readable number
          # in the wake prompt, and failing this job instead would mean the
          # coder is never woken to sync the shared tree — strictly worse
          # than an unknown round number.
          labels="__FETCH_FAILED__"
          for attempt in 1 2; do
            if labels="$(gh api "repos/$REPO/issues/$PR_NUMBER/labels" --paginate --jq '.[].name')"; then
              break
            fi
            echo "::warning::label fetch attempt $attempt failed"
            labels="__FETCH_FAILED__"
            sleep 3
          done
          if [ "$labels" = "__FETCH_FAILED__" ]; then
            echo "::warning::could not read PR #$PR_NUMBER's labels — reporting round=unknown \
            rather than guessing. The merge itself is unaffected."
            round=unknown
          elif printf '%s\n' "$labels" | grep -Eq '^devteam:(awaiting-fixes|fix-cycle)$'; then
            # Same derivation as the gate: awaiting-fixes is dropped on push,
            # so the durable devteam:fix-cycle also means past round 1.
            round=2
          else
            round=1
          fi
          ROUND="$round" python3 <<'PYEOF'
          import hashlib, hmac, json, os, re, subprocess, sys

          # Same RUNNER_TEMP reasoning as the findings/escalate event block.
          TMP = os.environ["RUNNER_TEMP"]

          def _unchecked_items(body):
              """Literal `- [ ]` (unchecked) checklist lines out of a PR body.

              HTML comments are stripped FIRST, so a template's commented-out
              boilerplate checklist is never picked up. Bounded to 50 items of
              300 chars each — truncate, never error, on a pathological body.
              """
              body = re.sub(r"<!--.*?-->", "", body or "", flags=re.DOTALL)
              items = []
              for line in body.splitlines():
                  m = re.match(r"^\s*-\s*\[\s*\]\s*(.+)$", line)
                  if m:
                      items.append(m.group(1).strip()[:300])
              return items[:50]

          base = os.environ["EVENT_URL"].rstrip("/")
          def _pr_labels():
              """Live PR label names, best effort: the platform links a PR to
              its coder run from the aw-run:<id> label, so GitHub is only
              asked here, by the workflow's own token."""
              try:
                  r = subprocess.run(
                      ["gh", "api", f"repos/{os.environ['REPO']}/issues/{os.environ['PR_NUMBER']}/labels",
                       "--paginate", "--jq", ".[].name"], capture_output=True, text=True, timeout=30)
                  return [x for x in r.stdout.splitlines() if x] if r.returncode == 0 else []
              except Exception:
                  return []

          event_path = os.path.join(TMP, "devteam_event.json")
          response_path = os.path.join(TMP, "devteam_event_response.json")

          import time
          def _unresolved(code, body):
              """True when AP-MT accepted the call but could not link the PR to a coder run."""
              if not str(code).startswith("2"):
                  return False
              try:
                  d = json.loads(body)
              except Exception:
                  return False
              return (isinstance(d, dict) and d.get("acted") is False
                      and (d.get("reason") == "no PR->coder link for this URL"
                           or "unresolved" in json.dumps(d.get("link_resolution", "")).lower()))

          def _post(raw_bytes):
              with open(event_path, "wb") as fh:
                  fh.write(raw_bytes)
              sig = hmac.new(os.environ["AW_DEVTEAM_EVENT_SECRET"].encode(),
                             raw_bytes, hashlib.sha256).hexdigest()
              code = subprocess.run([
                  "curl", "-sS", "--max-time", "60", "-o", response_path,
                  "-w", "%{http_code}",
                  "-X", "POST",
                  f"{base}/api/github/devteam-review-event",
                  "-H", "Content-Type: application/json",
                  "-H", f"X-Hub-Signature-256: sha256={sig}",
                  "--data-binary", f"@{event_path}",
              ], capture_output=True, text=True, check=True).stdout.strip()
              return code, open(response_path).read()

          def _build():
              _labels = _pr_labels()
              _run_label = next((x for x in _labels if x.startswith("aw-run:")), "")
              return {
                  "labels": _labels,
                  "run_id": _run_label[len("aw-run:"):],
                  "v": 1,
                  "event": "merged",
                  "repo": os.environ["REPO"],
                  "pr_number": int(os.environ["PR_NUMBER"]),
                  "pr_url": os.environ["PR_URL"],
                  "head_sha": os.environ["MERGE_SHA"],
                  "pr_head_sha": os.environ["PR_HEAD_SHA"],
                  "unchecked_items": _unchecked_items(os.environ.get("PR_BODY", "")),
                  "round": os.environ["ROUND"],
                  "counts": {},
              }

          # Up to 2 retries, 5s apart, only on acted:false + unresolved link;
          # labels are re-read for every attempt.
          for _try in range(3):
              code, body = _post(json.dumps(_build()).encode())
              print(f"merged -> HTTP {code}: {body[:800]}")
              if _try < 2 and _unresolved(code, body):
                  print(f"link unresolved; re-reading labels and retrying ({_try + 1}/2)")
                  time.sleep(5)
                  continue
              break
          if not code.startswith("2"):
              print(f"::warning::devteam-review-event merged returned HTTP {code}")
              sys.exit(1)
          PYEOF

# ── CALLER CHECKLIST ──────────────────────────────────────────────────────
# TRIGGER SURFACE, REQUIRED as of v1.3.0 — the caller's `on:` block:
#
#     on:
#       pull_request:
#         types: [opened, reopened, ready_for_review, synchronize, closed]
#       issue_comment:
#         types: [created]
#       workflow_run:
#         workflows: ["<THE CALLER'S OWN CI WORKFLOW `name:`>"]
#         types: [completed]
#
#     concurrency:
#       group: code-review-${{ github.event.pull_request.number
#                || github.event.issue.number
#                || github.event.workflow_run.head_branch }}
#       cancel-in-progress: false
#
# Three things about that block, each of which has a way of going wrong
# silently:
#
#   `synchronize` is what lets a push to an already-reviewed PR be cleared
#   (the `bypass` round) without a second deep review; without it a fix push
#   would need a `/aw-review` comment to get its merge clearance.
#
#   `workflow_run.workflows:` takes the CI workflow's `name:` — the human
#   string at the top of that file, NOT its filename and NOT its job id.
#   ("Test" on aw-app-template / AP-MT / aw-workspace, "CI" on aw-stack.)
#   Get it wrong, or rename the CI workflow later, and nothing fails: the
#   event simply never fires, and merges whose CI finishes after the review
#   verdict stop happening until someone comments `/aw-review`. Check it with
#   `gh api repos/<owner>/<repo>/actions/workflows --jq '.workflows[].name'`.
#
#   The `|| github.event.workflow_run.head_branch` arm of the concurrency
#   group is not cosmetic. A workflow_run event has neither
#   `pull_request.number` nor `issue.number`, so without it EVERY
#   workflow_run-triggered run in the repo collapses into the single group
#   `code-review-`, and with `cancel-in-progress: false` they queue behind
#   each other one at a time.
#
# AND NOTE: `workflow_run` only ever fires for a trigger definition that is
# already on the DEFAULT BRANCH. The PR that adds this block cannot exercise
# the path the block enables. Land it, then prove it on the next PR.
#
# In the caller's `uses:` job, REQUIRED — all six:
#     permissions:
#       contents: read
#       pull-requests: write
#       issues: write
#       statuses: write
#       checks: read        # <- omitting this breaks PRIVATE repos only
#       actions: read       # <- omitting this ALSO breaks PRIVATE repos only
#
# A caller grant is NECESSARY BUT NOT SUFFICIENT: the effective token is the
# intersection of the caller's block and THIS FILE's own top-level
# `permissions:`, and an unlisted scope there means `none`, not "inherit". So
# a scope has to appear in BOTH. Keep the two lists identical — the test
# `test_the_reusable_requests_every_scope_the_caller_checklist_demands`
# parses this checklist and that block and fails if they diverge, because
# v1.1.1 shipped exactly that divergence and capped every caller to zero.
#
# `checks: read` is not optional and its absence is invisible on a public
# repo. The merge gate reads the PR's checks with `gh pr checks`, which goes
# through the Checks API; on a private repo that read is REFUSED without
# `checks: read` and returns an empty list — deterministically, every round,
# with no error surfaced to the step. The gate then reports
# `required check(s) ['<ci_check_name>'] did not report a pass ... Saw: []`
# and never merges, which reads exactly like a CI failure and sends you to
# look at the wrong workflow. A public repo's rollup is readable without it,
# so the identical caller works there — the two live cases were the public
# tekflox/aw-app-template (merged first try) and the private AP-MT (failed
# four consecutive rounds, ~40 min after its checks had gone green).
#
# `actions: read` is the THIRD, separate scope gap in this same call — found
# after checks: read was already live everywhere. `gh pr checks` always
# embeds checkSuite{workflowRun{...}} in its GraphQL query regardless of the
# requested --json fields (gh CLI v2.97.0, api/query_builder.go), and that
# edge is an Actions-resource read that checks: read does not grant. Missing
# it on a private caller is again a hard, deterministic GraphQL 403 —
# `Resource not accessible by integration (...checkSuite.workflowRun)` — on
# every read, so all three attempts fail and the merge-attempt refuses. Live
# case: fredericowu/agents-platform-multitenant
# PR #9, CI green for hours, gate refused to merge anyway. Checks: read alone
# was not enough because it only covers the Checks API's own name/state/
# conclusion fields, not the edge back to the Actions run that produced the
# check suite.
#
# Per consumer repo, once:
#   - secrets: AW_CODEREVIEW_V1_KEY (workspace-bound, scoped to
#     code-reviewer-sonnet — or to whatever `agent_slug` the caller passes,
#     see the PROVENANCE note above), AW_DEVTEAM_MERGE_TOKEN,
#     AW_DEVTEAM_EVENT_SECRET
#   - labels: `devteam:reviewed` and `review-count:N` are auto-created on first
#     use. provenance-exempt (#0E8A16) — human-applied only, see `provenance-gate`
#       gh label create provenance-exempt --color 0E8A16 --repo <owner/repo> \
#         --description "Human-applied: skips provenance-gate. Never apply this yourself."
#   - optional variable AW_REVIEW_TRUSTED_AUTHORS (comma-separated logins).
#     Unset falls back to `fredericowu` in the gate's own code.
#       gh variable set AW_REVIEW_TRUSTED_AUTHORS --body "fredericowu,other" \
#         --repo <owner/repo>
#
# No `--enable-auto-merge` repo setting is needed: this file never calls
# `gh pr merge --auto` (see the merge step's own comment for why).
