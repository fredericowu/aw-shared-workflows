name: Devteam Nudge (reusable)

# Posts the PR's LIVE state to the Agents Platform after an event, so the
# platform (pr_nudge.decide) can wake the coder, ask a human, wait or do
# nothing. Event-driven counterpart of the 3h github-maintenance tick; the
# tick stays as the safety-net sweep.
#
# One entry point:
#   - a per-repo `devteam-nudge.yml` caller on `pull_request: labeled` for the
#     human `devteam:awaiting-fixes` label (trigger_kind: label). See README.
#
# NEVER CHECKS OUT OR EXECUTES PR CONTENT. The label caller runs on
# `pull_request_target` and holds a secret; the only things read are the
# GitHub API and the event context.
#
# CONTAINS NO DECISION LOGIC. The raw `gh pr view` JSON goes to the platform,
# which derives CI/mergeability facts itself. Do not add "if green then ..." here.
#
# MUST NEVER FAIL A PR. A red job would attach a failing check to the PR head,
# which the platform's CI read would then see as red. Every path exits 0: the
# step is `continue-on-error`, the script catches everything, and an unset
# secret or a 404 (platform not yet deployed) is a warning.

on:
  workflow_call:
    inputs:
      pr_number:
        description: Pull request number.
        required: true
        type: string
      trigger_kind:
        description: >-
          One of review_done, push_unreviewed, ci_done, comment, label.
        required: true
        type: string
      trigger_label:
        description: >-
          For trigger_kind=label: the label that was added. Only
          devteam:awaiting-fixes, still live, is acted on.
        required: false
        type: string
        default: ''
      event_url:
        description: >-
          Agents Platform base URL
          (POST <base>/api/github/devteam-pr-nudge).
        required: false
        type: string
        default: 'https://agents-platform.aw.tekflox.com'
      runs_on:
        description: >-
          JSON-encoded `runs-on` value, consumed as `fromJSON(inputs.runs_on)`.
        required: false
        type: string
        default: '"ubuntu-latest"'
      dry_run:
        description: Ask the platform to decide without waking anyone.
        required: false
        type: boolean
        default: false
    secrets:
      AW_DEVTEAM_EVENT_SECRET:
        required: false

permissions:
  contents: read
  pull-requests: write
  issues: write
  checks: read
  statuses: read
  # `gh pr view --json statusCheckRollup` resolves checkSuite->workflowRun,
  # an Actions-resource read (see the note in code-review-reusable.yml).
  actions: read

jobs:
  devteam-nudge:
    runs-on: ${{ fromJSON(inputs.runs_on) }}
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - name: Post the PR state to the platform
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AW_DEVTEAM_EVENT_SECRET: ${{ secrets.AW_DEVTEAM_EVENT_SECRET }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pr_number }}
          TRIGGER_KIND: ${{ inputs.trigger_kind }}
          TRIGGER_LABEL: ${{ inputs.trigger_label }}
          EVENT_URL: ${{ inputs.event_url }}
          DRY_RUN: ${{ inputs.dry_run }}
          ACTOR: ${{ github.event.sender.login }}
          ACTOR_TYPE: ${{ github.event.sender.type }}
        run: |
          python3 <<'PYEOF'
          import hashlib, hmac, json, os, subprocess, sys, time

          def warn(msg):
              print(f"::warning::devteam-nudge: {msg}")

          def sleep(seconds):
              time.sleep(seconds * float(os.environ.get("NUDGE_SLEEP_SCALE", "1")))

          def gh(*args):
              return subprocess.run(["gh", *args], capture_output=True, text=True)

          def summary(text):
              print(text)
              path = os.environ.get("GITHUB_STEP_SUMMARY")
              if path:
                  with open(path, "a") as fh:
                      fh.write(text + "\n")

          def main():
              repo = os.environ["REPO"]
              pr = os.environ.get("PR_NUMBER", "").strip()
              kind = os.environ["TRIGGER_KIND"]
              label = os.environ.get("TRIGGER_LABEL", "")
              if not pr:
                  print("skip: no PR number")
                  return

              # Live labels: same 3-attempt read as the gate. Never guess an
              # empty set; give up quietly instead.
              labels = None
              for attempt in (1, 2, 3):
                  r = gh("api", f"repos/{repo}/issues/{pr}/labels", "--paginate",
                         "--jq", ".[].name")
                  if r.returncode == 0:
                      labels = [x for x in r.stdout.split("\n") if x]
                      break
                  print(f"label fetch attempt {attempt} failed")
                  sleep(attempt * 3)
              if labels is None:
                  warn(f"could not read PR #{pr}'s labels; no nudge sent")
                  return

              # Raw PR view. mergeable is UNKNOWN for a few seconds after a
              # push, so re-read (3 tries, 5 s apart) while it is.
              view = None
              fields = ("state,mergeable,mergeStateStatus,isDraft,"
                        "statusCheckRollup,headRefOid,url")
              for attempt in (1, 2, 3):
                  r = gh("pr", "view", pr, "--repo", repo, "--json", fields)
                  if r.returncode == 0:
                      try:
                          view = json.loads(r.stdout)
                      except ValueError:
                          view = None
                  if view is not None and view.get("mergeable") != "UNKNOWN":
                      break
                  if attempt < 3:
                      sleep(5)
              if view is None:
                  warn(f"could not read PR #{pr}; no nudge sent")
                  return

              if view.get("state") != "OPEN":
                  print(f"skip: PR #{pr} is {view.get('state')}")
                  return
              run_label = next((x for x in labels if x.startswith("aw-run:")), "")
              if not run_label and not any(x.startswith("aw-card:") for x in labels):
                  print("skip: not an agent PR (no aw-run:/aw-card: label)")
                  return
              if kind == "label" and not (
                      label == "devteam:awaiting-fixes" and label in labels):
                  print(f"skip: label {label!r} is not a live devteam:awaiting-fixes")
                  return

              secret = os.environ.get("AW_DEVTEAM_EVENT_SECRET", "")
              if not secret:
                  warn("AW_DEVTEAM_EVENT_SECRET is not set; no nudge sent")
                  return

              payload = {
                  "v": 1,
                  "trigger": {
                      "kind": kind,
                      "actor": os.environ.get("ACTOR", ""),
                      "actor_type": os.environ.get("ACTOR_TYPE", ""),
                      "label": label,
                  },
                  "repo": repo,
                  "pr_number": int(pr),
                  "pr_url": view.get("url") or f"https://github.com/{repo}/pull/{pr}",
                  "head_sha": view.get("headRefOid") or "",
                  "labels": labels,
                  "run_id": run_label[len("aw-run:"):],
                  "view": view,
                  "needs_human_actor": None,  # label retired; key kept for payload shape
                  "dry_run": os.environ.get("DRY_RUN", "false").lower() == "true",
              }

              # Sign the EXACT bytes that get posted: build once, write once,
              # sign the file's contents, send the file. Signed in python so
              # the secret never appears in a process argv.
              tmp = os.environ.get("RUNNER_TEMP", "/tmp")
              raw = json.dumps(payload).encode()
              event_path = os.path.join(tmp, "devteam_nudge.json")
              response_path = os.path.join(tmp, "devteam_nudge_response.json")
              with open(event_path, "wb") as fh:
                  fh.write(raw)
              sig = hmac.new(secret.encode(), raw, hashlib.sha256).hexdigest()
              url = os.environ["EVENT_URL"].rstrip("/") + "/api/github/devteam-pr-nudge"
              code, body = "", ""
              for attempt in (1, 2, 3):
                  try:
                      if os.path.exists(response_path):
                          os.remove(response_path)
                      code = subprocess.run([
                          "curl", "-sS", "--max-time", "60", "-o", response_path,
                          "-w", "%{http_code}", "-X", "POST", url,
                          "-H", "Content-Type: application/json",
                          "-H", f"X-Hub-Signature-256: sha256={sig}",
                          "--data-binary", f"@{event_path}",
                      ], capture_output=True, text=True, check=True).stdout.strip()
                  except (subprocess.CalledProcessError, OSError) as exc:
                      code = ""
                      print(f"nudge attempt {attempt}: transport error: {exc}")
                  if code and not code.startswith("5"):
                      break
                  if code:
                      print(f"nudge attempt {attempt}: HTTP {code}")
                  if attempt < 3:
                      sleep(attempt * 3)
              try:
                  body = open(response_path).read()
              except OSError:
                  body = ""
              print(f"{kind} -> HTTP {code or 'none'}: {body[:800]}")

              if code == "404":
                  warn("platform has no /api/github/devteam-pr-nudge route yet "
                       "(not deployed); no nudge sent")
                  return
              if not code.startswith("2"):
                  warn(f"platform answered HTTP {code or 'none'}; no nudge recorded")
                  return

              try:
                  out = json.loads(body)
              except ValueError:
                  out = {}
              verdict = str(out.get("verdict") or "unknown")
              reason = str(out.get("reason") or out.get("decision_reason") or "")
              line = f"**Devteam nudge** ({kind}) on #{pr}: `{verdict}`"
              if reason:
                  line += f" - {reason}"
              summary(line)

              # The review-ceiling escalation is delivered by this ASK, not by
              # the report step's store-only webhook. Mark it delivered only
              # when the platform confirms a question was really asked now:
              # `acted` is true for a delivered ASK and false for a dry run,
              # an already-asked replay or any failed/deferred ask. Anything
              # else leaves the marker off so the next refused run retries.
              if (verdict == "asked" and out.get("acted") is True
                      and "devteam:review-exhausted" in labels):
                  r = gh("api", "-X", "POST", f"repos/{repo}/issues/{pr}/labels",
                         "-f", "labels[]=devteam:review-escalated", "--silent")
                  if r.returncode != 0:
                      warn(f"could not stamp devteam:review-escalated: {r.stderr[:200]}")

              if kind in ("label", "comment") and verdict != "woken":
                  r = gh("api", "-X", "POST", f"repos/{repo}/issues/{pr}/comments",
                         "-f", f"body={line}", "--silent")
                  if r.returncode != 0:
                      warn(f"could not post the verdict comment: {r.stderr[:200]}")

          try:
              main()
          except Exception as exc:  # never fail a PR
              warn(f"unexpected error: {exc!r}")
          sys.exit(0)
          PYEOF
